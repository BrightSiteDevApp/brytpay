name: Generate Keystore
on: workflow_dispatch
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Create Official Keystore
        run: keytool -genkey -v -keystore brytpay-upload.jks -keyalg RSA -keysize 2048 -validity 10000 -alias brytpay -storepass brytpay2026 -keypass brytpay2026 -dname "CN=BRYT Digital Services, OU=BRYT Pay, O=BRYT Digital Services, L=Kaduna, ST=Kaduna, C=NG"
      - name: Save Keystore for Download
        uses: actions/upload-artifact@v4
        with:
          name: BRYT-Pay-Keystore
          path: brytpay-upload.jks