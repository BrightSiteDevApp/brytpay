<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Push Notifications — BRYT Admin</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="../../assets/css/main.css">
    <style>
        body { display: none; background: #f8fafc; font-family: system-ui, sans-serif; color: #0f172a; margin: 0; }
        .admin-container { max-width: 600px; margin: 40px auto; padding: 24px; }
        .back-link { display: inline-flex; align-items: center; gap: 6px; color: #64748b; text-decoration: none; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; margin-bottom: 24px; }
        .back-link:hover { color: #1D5ED0; }
        .composer-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 32px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
        h1 { font-size: 1.5rem; font-weight: 800; margin-top: 0; margin-bottom: 24px; }
        
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-weight: 800; font-size: 0.75rem; color: #475569; margin-bottom: 8px; text-transform: uppercase; }
        .form-input { width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 0.95rem; outline: none; background: #f8fafc; font-family: inherit; box-sizing: border-box; transition: 0.2s; }
        .form-input:focus { border-color: #1D5ED0; background: #ffffff; box-shadow: 0 0 0 3px rgba(29, 94, 208, 0.1); }
        
        .btn-dispatch { background: #0f172a; color: #ffffff; width: 100%; padding: 16px; border-radius: 12px; font-weight: 800; font-size: 1rem; border: none; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 12px; }
        .btn-dispatch:hover { background: #1D5ED0; }
        .btn-dispatch:disabled { background: #94a3b8; cursor: not-allowed; }
        
        .status-banner { display: none; padding: 16px; border-radius: 12px; font-size: 0.9rem; font-weight: 700; margin-bottom: 24px; text-align: center; }
        .status-success { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
        .status-error { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
    </style>
</head>
<body>
    <main class="admin-container">
        <!-- 🚀 BACK BUTTON -->
        <a href="/admin/" class="back-link">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Admin Hub
        </a>

        <div class="composer-card">
            <h1>Blast Notification</h1>
            
            <div id="status-msg" class="status-banner"></div>

            <div class="form-group">
                <label class="form-label">Notification Title</label>
                <input type="text" id="push-title" class="form-input" placeholder="e.g. System Maintenance" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Message Body</label>
                <textarea id="push-body" class="form-input" style="min-height: 100px; resize: vertical;" placeholder="e.g. BRYT Pay will be down for 15 mins tonight..." required></textarea>
            </div>
            
            <div class="form-group">
                <label class="form-label">Click Action URL (Optional)</label>
                <input type="text" id="push-url" class="form-input" placeholder="e.g. /dashboard/fund/" value="/dashboard/">
            </div>

            <button id="btn-send" class="btn-dispatch">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"></path><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                Send to All Devices
            </button>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/supabase-client.js"></script>
    <script>
        // Strict Admin Guard
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await window.db.auth.getSession();
            if (!session) return window.location.href = '/auth/login.html';
            const { data: admin } = await window.db.from('admins').select('email').eq('email', session.user.email).maybeSingle();
            if (!admin) return window.location.href = '/dashboard/';
            document.body.style.display = 'block';
        });

        // 🚀 DISPATCH LOGIC (Connected to send-push)
        document.getElementById('btn-send').addEventListener('click', async () => {
            const title = document.getElementById('push-title').value.trim();
            const body = document.getElementById('push-body').value.trim();
            const clickUrl = document.getElementById('push-url').value.trim();
            const statusBox = document.getElementById('status-msg');
            const btn = document.getElementById('btn-send');

            if (!title || !body) {
                statusBox.className = 'status-banner status-error';
                statusBox.textContent = 'Please fill out both the Title and Body.';
                statusBox.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = 'Broadcasting...';
            statusBox.style.display = 'none';

            try {
                // Ensure this targets your new 'send-push' edge function
                const { data, error } = await window.db.functions.invoke('send-push', {
                    body: { title, body, url: clickUrl }
                });

                if (error) throw new Error(error.message);
                if (data && data.error) throw new Error(data.error);

                // Display success payload from the Edge Function
                statusBox.className = 'status-banner status-success';
                statusBox.innerHTML = `Success! Sent to ${data.sent} devices.<br>(${data.failed} failed/uninstalled)`;
                statusBox.style.display = 'block';
                
                document.getElementById('push-title').value = '';
                document.getElementById('push-body').value = '';
            } catch (err) {
                statusBox.className = 'status-banner status-error';
                statusBox.textContent = `Error: ${err.message}`;
                statusBox.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"></path><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg> Send to All Devices`;
            }
        });
    </script>
</body>
</html>
