<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Notifications</title>
    <link rel="stylesheet" href="../../assets/css/main.css">
    <style>
        body { display: none; padding: 20px; background: #f8fafc; }
        .admin-card { background: white; padding: 32px; border-radius: 16px; max-width: 600px; margin: 0 auto; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <div style="max-width: 600px; margin: 0 auto;">
        <!-- 🚀 NEW BACK BUTTON -->
        <a href="../" style="text-decoration:none; color:var(--text-muted); font-size:0.9rem; font-weight:700; display:inline-flex; align-items:center; gap:6px; margin-bottom: 24px; transition: color 0.2s;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg> 
            Back to Admin Panel
        </a>

        <div class="admin-card">
            <h2 style="margin-bottom: 24px; color: var(--bryt-navy);">Send Notification</h2>
            <form id="admin-notif-form">
                <div class="form-group">
                    <label class="form-label">Recipient</label>
                    <select id="notif-target" class="form-input">
                        <option value="all">Broadcast to All Users</option>
                        <option value="specific">Specific User (Email)</option>
                    </select>
                </div>
                
                <div class="form-group" id="email-group" style="display: none;">
                    <label class="form-label">User Email</label>
                    <input type="email" id="notif-email" class="form-input" placeholder="user@example.com">
                </div>

                <div class="form-group">
                    <label class="form-label">Notification Type</label>
                    <select id="notif-type" class="form-input">
                        <option value="info">Info (Blue)</option>
                        <option value="success">Success (Green)</option>
                        <option value="alert">Alert (Red)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Title</label>
                    <input type="text" id="notif-title" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Message</label>
                    <textarea id="notif-message" class="form-input" rows="4" required></textarea>
                </div>

                <button type="submit" class="btn-primary" style="width: 100%; padding: 16px;">Send Notification</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/supabase-client.js"></script>
    <script src="../../assets/js/admin-guard.js"></script>
    <script src="../../assets/js/admin-notifications.js"></script>
</body>
</html>
