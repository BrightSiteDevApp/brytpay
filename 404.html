<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — BRYT Pay</title>
    <!-- Redirects automatically to the dashboard after 3 seconds -->
    <meta http-equiv="refresh" content="3;url=/dashboard/">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#1D5ED0">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #F5F8FC; font-family: 'Sora', sans-serif; text-align: center; color: #071A3A; flex-direction: column; }
        .error-code { font-size: 5rem; font-weight: 800; color: #1D5ED0; line-height: 1; margin-bottom: 16px; }
        .error-text { font-size: 1.2rem; font-weight: 600; margin-bottom: 8px; }
        .redirect-text { font-size: 0.9rem; color: #64748B; margin-bottom: 24px; }
        .spinner { border: 3px solid rgba(29, 94, 208, 0.2); border-left-color: #1D5ED0; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="error-code">404</div>
    <div class="error-text">Lost in the digital space?</div>
    <div class="redirect-text">Redirecting you to the dashboard in 3 seconds...</div>
    <div class="spinner"></div>
</body>
</html>
