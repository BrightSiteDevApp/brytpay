<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayVessel Live Test</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f8fafc; display: flex; justify-content: center; padding: 40px 20px; }
        .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 400px; }
        h2 { margin-top: 0; color: #0f172a; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #475569; }
        select, input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; box-sizing: border-box; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 1rem; }
        .btn-validate { background: #eff6ff; color: #1D5ED0; margin-bottom: 16px; }
        .btn-transfer { background: #1D5ED0; color: white; display: none; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .account-name-box { background: #f0fdf4; color: #16a34a; padding: 12px; border-radius: 8px; font-weight: bold; text-align: center; margin-bottom: 16px; display: none; border: 1px solid #bbf7d0; }
        .log-box { margin-top: 20px; background: #0f172a; color: #10b981; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 0.8rem; white-space: pre-wrap; word-break: break-all; display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Live Transfer Test</h2>
        
        <div class="form-group">
            <label>Select Bank</label>
            <select id="bank-code">
                <option value="">Loading banks...</option>
            </select>
        </div>

        <div class="form-group">
            <label>Account Number</label>
            <input type="text" id="account-number" placeholder="e.g. 0123456789" maxlength="10">
        </div>

        <button id="validate-btn" class="btn btn-validate" disabled>Verify Account</button>
        
        <div id="account-name-display" class="account-name-box"></div>
        
        <button id="transfer-btn" class="btn btn-transfer">Send ₦100 Now</button>

        <div id="log-display" class="log-box"></div>
    </div>

    <!-- Automatically loads your live Supabase configuration -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-client.js"></script>

    <script>
        const bankSelect = document.getElementById('bank-code');
        const validateBtn = document.getElementById('validate-btn');
        const transferBtn = document.getElementById('transfer-btn');
        const accountNameDisplay = document.getElementById('account-name-display');
        const logDisplay = document.getElementById('log-display');

        // Automatically fetch banks on page load using your project's window.db
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const { data, error } = await window.db.functions.invoke('payvessel-test', {
                    body: { action: 'get-banks' }
                });

                if (error) throw new Error("Could not communicate with Edge Function.");
                
                if (data && data.status && data.data) {
                    const sortedBanks = data.data.sort((a, b) => a.bank_name.localeCompare(b.bank_name));
                    
                    let optionsHtml = '<option value="">Select a Bank...</option>';
                    sortedBanks.forEach(bank => {
                        optionsHtml += `<option value="${bank.bank_code}">${bank.bank_name}</option>`;
                    });
                    
                    bankSelect.innerHTML = optionsHtml;
                    validateBtn.disabled = false;
                } else {
                    bankSelect.innerHTML = '<option value="">Failed to load banks</option>';
                    alert("PayVessel Error: " + (data.message || "Failed to retrieve banks."));
                }
            } catch (err) {
                bankSelect.innerHTML = '<option value="">Error loading banks</option>';
                alert(err.message);
            }
        });

        // Step 1: Validate Account
        validateBtn.addEventListener('click', async () => {
            const bankCode = bankSelect.value;
            const accNumber = document.getElementById('account-number').value.trim();

            if (!bankCode) return alert("Please select a bank from the dropdown.");
            if (accNumber.length < 10) return alert("Enter a valid 10-digit account number.");

            validateBtn.disabled = true;
            validateBtn.textContent = "Verifying...";
            accountNameDisplay.style.display = 'none';
            transferBtn.style.display = 'none';

            try {
                const { data, error } = await window.db.functions.invoke('payvessel-test', {
                    body: { action: 'validate', account_number: accNumber, bank_code: bankCode }
                });

                if (error) throw new Error("Edge Function Failed");

                if (data && data.status && data.data) {
                    accountNameDisplay.textContent = `Verified: ${data.data.account_name}`;
                    accountNameDisplay.style.display = 'block';
                    transferBtn.style.display = 'block';
                } else {
                    alert(data.message || "Could not verify account. Please check the details and try again.");
                }
            } catch (err) {
                alert("Verification failed: " + err.message);
            } finally {
                validateBtn.disabled = false;
                validateBtn.textContent = "Verify Account";
            }
        });

        // Step 2: Live Transfer (₦100)
        transferBtn.addEventListener('click', async () => {
            const bankCode = bankSelect.value;
            const accNumber = document.getElementById('account-number').value.trim();

            const confirmTransfer = confirm("You are about to send a real ₦100 to this account. Proceed?");
            if (!confirmTransfer) return;

            transferBtn.disabled = true;
            transferBtn.textContent = "Processing Transfer...";

            try {
                const { data, error } = await window.db.functions.invoke('payvessel-test', {
                    body: { 
                        action: 'transfer', 
                        account_number: accNumber, 
                        bank_code: bankCode, 
                        amount: "100.00" 
                    }
                });

                logDisplay.style.display = 'block';
                logDisplay.textContent = JSON.stringify(data, null, 2);

                if (data && data.status) {
                    alert("Transfer Initiated Successfully! Check your bank app.");
                } else {
                    alert("Transfer Failed: " + (data.message || "Unknown error"));
                }
            } catch (err) {
                alert("Transfer error: " + err.message);
            } finally {
                transferBtn.disabled = false;
                transferBtn.textContent = "Send ₦100 Now";
            }
        });
    </script>
</body>
</html>
