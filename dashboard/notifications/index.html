<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notifications — BRYT Pay</title>
    
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#1D5ED0">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    
    <style>
        /* Base Reset */
        * { box-sizing: border-box; }
        body { background: #f8fafc; margin: 0; font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; color: #0f172a; padding-bottom: 75px !important; }
        .app-container { max-width: 600px; margin: 0 auto; padding: 24px 16px; }

        /* Sleek Header */
        .page-header { margin-bottom: 24px; }
        .back-btn { 
            text-decoration: none; color: #64748b; font-size: 0.85rem; font-weight: 700; 
            display: inline-flex; align-items: center; gap: 6px; margin-bottom: 12px; transition: color 0.2s;
        }
        .back-btn:hover { color: #1D5ED0; }
        .title-row { display: flex; justify-content: space-between; align-items: flex-end; }
        .title-row h1 { font-size: 1.35rem; color: #071A3A; margin: 0; font-weight: 800; }
        
        .btn-mark-all { 
            background: #eff6ff; border: none; color: #1D5ED0; font-size: 0.75rem; 
            font-weight: 800; cursor: pointer; padding: 8px 14px; border-radius: 20px; transition: 0.2s; display: none;
        }
        .btn-mark-all:hover { background: #dbeafe; }

        /* Premium Notification Cards */
        .notif-feed { display: flex; flex-direction: column; gap: 14px; }
        
        .notif-card {
            background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 16px;
            display: flex; gap: 12px; align-items: flex-start; transition: 0.2s; position: relative;
        }
        
        /* Unread State Indicator */
        .notif-card.unread {
            background: #ffffff; border-color: #bfdbfe; box-shadow: 0 8px 24px rgba(29, 94, 208, 0.05);
        }
        .notif-card.unread::before {
            content: ''; position: absolute; top: 16px; right: 16px; width: 8px; height: 8px;
            background: #1D5ED0; border-radius: 50%; box-shadow: 0 0 0 4px #eff6ff;
        }

        /* Modern Icon System */
        .notif-icon-wrap {
            width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; 
            justify-content: center; flex-shrink: 0;
        }
        .notif-icon-wrap svg { width: 18px; height: 18px; }
        .type-info { background: #f1f5f9; color: #64748b; border: 1px solid #e2e8f0; }
        .type-alert { background: #fef2f2; color: #ef4444; border: 1px solid #fee2e2; }
        .type-success { background: #ecfdf5; color: #10b981; border: 1px solid #d1fae5; }
        .type-system { background: #eff6ff; color: #1D5ED0; border: 1px solid #dbeafe; }

        /* Typography */
        .notif-body { flex: 1; min-width: 0; padding-top: 2px; }
        .notif-title { font-size: 0.85rem; font-weight: 800; color: #071A3A; margin: 0 0 4px 0; line-height: 1.3; padding-right: 20px;}
        .notif-text { font-size: 0.75rem; color: #475569; line-height: 1.4; margin: 0 0 10px 0; }
        
        /* Bottom Meta Row */
        .notif-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .notif-time { font-size: 0.65rem; color: #94a3b8; font-weight: 700; }
        
        .btn-action-read {
            background: transparent; border: 1px solid #cbd5e1; color: #475569; font-size: 0.65rem; 
            font-weight: 800; padding: 4px 10px; border-radius: 10px; cursor: pointer; transition: 0.2s;
        }
        .btn-action-read:hover { background: #f8fafc; color: #0f172a; border-color: #94a3b8; }

        /* Skeleton Loaders */
        .skeleton {
            background: #e2e8f0; background-image: linear-gradient(90deg, #e2e8f0 0px, #f8fafc 40px, #e2e8f0 80px);
            background-size: 200% 100%; animation: shimmer 1.5s infinite linear; border-radius: 8px;
            color: transparent !important; pointer-events: none; border: none !important;
        }
        .skeleton * { visibility: hidden; }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        
        .skel-card { height: 110px; width: 100%; border-radius: 16px; margin-bottom: 12px; }
        
        /* Empty State */
        .empty-inbox { text-align: center; padding: 60px 20px; }
        .empty-icon { width: 56px; height: 56px; background: #f1f5f9; color: #94a3b8; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
        .empty-title { font-size: 1.05rem; font-weight: 800; color: #071A3A; margin: 0 0 8px 0; }
        .empty-desc { font-size: 0.8rem; color: #64748b; margin: 0; line-height: 1.5; }
        
        /* Fixed Mobile Navigation Override */
        .mobile-nav {
            position: fixed !important; bottom: 0 !important; left: 0 !important; right: 0 !important;
            background: #ffffff !important; z-index: 9999 !important; border-top: 1px solid #e2e8f0 !important;
            display: flex !important; justify-content: space-around !important; padding: 10px 0 8px 0 !important;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.03) !important;
        }
        .mobile-nav .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #94a3b8; text-decoration: none; transition: color 0.2s; }
        .mobile-nav .nav-item span { font-size: 0.65rem !important; font-weight: 700 !important; }
        .mobile-nav .nav-item svg { width: 20px !important; height: 20px !important; }
        .mobile-nav .nav-item.active { color: #1D5ED0 !important; }
        @media (min-width: 768px) { .mobile-nav { display: none !important; } body { padding-bottom: 0 !important; } }
    </style>
</head>
<body>

    <main class="app-container">
        <header class="page-header">
            <a href="/dashboard/" class="back-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>

            <div class="skel-card skeleton"></div>

        <a href="/dashboard/fund/" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg><span>Wallet</span></a>
        <a href="/dashboard/orders/" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg><span>Orders</span></a>
