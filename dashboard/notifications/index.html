<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notifications — BRYT Pay</title>
    
    <!-- Anti-Flash Dark Mode Script -->
    <script>
        if (localStorage.getItem('bryt_theme') === 'dark') {
            document.documentElement.classList.add('dark-theme');
        }
    </script>
    
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    
    <style>
        :root {
            --bryt-primary: #1D5ED0;
            --bryt-navy: #0B1220;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0B1220;
            --border-light: #f1f5f9;
        }

        html.dark-theme {
            --bryt-navy: #ffffff;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --border-light: #334155;
        }

        /* Base Reset */
        * { box-sizing: border-box; }
        body { background: var(--bg-color); color: var(--text-main); margin: 0; font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; padding-bottom: 75px !important; transition: background-color 0.3s, color 0.3s; }
        .app-container { max-width: 600px; margin: 0 auto; padding: 24px 16px; }

        /* Sleek Header */
        .page-header { margin-bottom: 24px; }
        .back-btn { 
            text-decoration: none; color: #64748b; font-size: 0.85rem; font-weight: 800; 
            display: inline-flex; align-items: center; gap: 6px; margin-bottom: 12px; transition: color 0.2s;
        }
        .back-btn:hover { color: var(--bryt-primary); }
        .title-row { display: flex; justify-content: space-between; align-items: flex-end; }
        .title-row h1 { font-size: 1.35rem; color: var(--text-main); margin: 0; font-weight: 800; }
        
        .btn-mark-all { 
            background: rgba(29, 94, 208, 0.1); border: none; color: var(--bryt-primary); font-size: 0.75rem; 
            font-weight: 800; cursor: pointer; padding: 8px 14px; border-radius: 20px; transition: 0.2s; display: none;
        }
        .btn-mark-all:hover { background: rgba(29, 94, 208, 0.2); }

        /* Premium Notification Cards */
        .notif-feed { display: flex; flex-direction: column; gap: 14px; }
        
        .notif-card {
            background: var(--card-bg); border: 1px solid var(--border-light); border-radius: 16px; padding: 16px;
            display: flex; gap: 12px; align-items: flex-start; transition: 0.2s; position: relative;
        }
        
        /* Unread State Indicator */
        .notif-card.unread {
            background: var(--card-bg); border-color: rgba(29, 94, 208, 0.3); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
        }
        .notif-card.unread::before {
            content: ''; position: absolute; top: 16px; right: 16px; width: 8px; height: 8px;
            background: var(--bryt-primary); border-radius: 50%; box-shadow: 0 0 0 4px rgba(29, 94, 208, 0.1);
        }

        /* Modern Icon System */
        .notif-icon-wrap {
            width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; 
            justify-content: center; flex-shrink: 0;
        }
        .notif-icon-wrap svg { width: 18px; height: 18px; }
        .type-info { background: var(--bg-color); color: #64748b; border: 1px solid var(--border-light); }
        .type-alert { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); }
        .type-success { background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); }
        .type-system { background: rgba(29, 94, 208, 0.1); color: var(--bryt-primary); border: 1px solid rgba(29, 94, 208, 0.2); }

        /* Typography */
        .notif-body { flex: 1; min-width: 0; padding-top: 2px; }
        .notif-title { font-size: 0.85rem; font-weight: 800; color: var(--text-main); margin: 0 0 4px 0; line-height: 1.3; padding-right: 20px;}
        .notif-text { font-size: 0.75rem; color: #64748b; line-height: 1.4; margin: 0 0 10px 0; font-weight: 500; }
        
        /* Bottom Meta Row */
        .notif-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .notif-time { font-size: 0.65rem; color: #64748b; font-weight: 700; }
        
        .btn-action-read {
            background: var(--bg-color); border: 1px solid var(--border-light); color: var(--text-main); font-size: 0.65rem; 
            font-weight: 800; padding: 4px 10px; border-radius: 10px; cursor: pointer; transition: 0.2s;
        }

        /* Skeleton Loaders (Adapted for Dark Mode) */
        .skeleton {
            background: var(--border-light); background-image: linear-gradient(90deg, var(--border-light) 0px, var(--bg-color) 40px, var(--border-light) 80px);
            background-size: 200% 100%; animation: shimmer 1.5s infinite linear; border-radius: 8px;
            color: transparent !important; pointer-events: none; border: none !important;
        }
        .skeleton * { visibility: hidden; }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        
        .skel-card { height: 110px; width: 100%; border-radius: 16px; margin-bottom: 12px; }
        
        /* Empty State */
        .empty-inbox { text-align: center; padding: 60px 20px; }
        .empty-icon { width: 56px; height: 56px; background: var(--bg-color); color: #64748b; border: 1px solid var(--border-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
        .empty-title { font-size: 1.05rem; font-weight: 800; color: var(--text-main); margin: 0 0 8px 0; }
        .empty-desc { font-size: 0.8rem; color: #64748b; margin: 0; line-height: 1.5; font-weight: 600; }
        
        /* Fixed Mobile Navigation Override */
        .mobile-nav {
            position: fixed !important; bottom: 0 !important; left: 0 !important; right: 0 !important;
            background: var(--card-bg) !important; z-index: 9999 !important; border-top: 1px solid var(--border-light) !important;
            display: flex !important; justify-content: space-around !important; padding: 10px 0 8px 0 !important;
            transition: background 0.3s, border 0.3s;
        }
        .mobile-nav .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #94a3b8; text-decoration: none; transition: color 0.2s; }
        .mobile-nav .nav-item span { font-size: 0.65rem !important; font-weight: 800 !important; }
        .mobile-nav .nav-item svg { width: 20px !important; height: 20px !important; }
        .mobile-nav .nav-item.active { color: var(--bryt-primary) !important; }
        @media (min-width: 768px) { .mobile-nav { display: none !important; } body { padding-bottom: 0 !important; } }
    </style>
</head>
<body>

    <main class="app-container">
        <header class="page-header">
            <a href="/dashboard/index.html" class="back-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Dashboard
            </a>
            <div class="title-row">
                <h1>Inbox</h1>
                <button id="mark-all-read" class="btn-mark-all">Mark all read</button>
            </div>
        </header>

        <div id="notifications-container" class="notif-feed">
            <!-- Shimmer Loaders -->
            <div class="skel-card skeleton"></div>
            <div class="skel-card skeleton"></div>
            <div class="skel-card skeleton"></div>
        </div>
    </main>
    
    <nav class="mobile-nav no-print">
        <a href="/dashboard/index.html" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Home</span></a>
        <a href="/dashboard/services/index.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg><span>Services</span></a>
        <a href="/dashboard/fund/index.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg><span>Wallet</span></a>
        <a href="/dashboard/orders/index.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg><span>Orders</span></a>
        <a href="/dashboard/account/index.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>Account</span></a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../../assets/js/notifications.js"></script>
</body>
</html>
