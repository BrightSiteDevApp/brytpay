<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cable TV & Streaming — BRYT Pay</title>
    <link rel="stylesheet" href="../../assets/css/main.css">
    <style>
        /* 4-Column Grid for the 4 Providers */
        .provider-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
        .provider-btn { background: #f8fafc; border: 1px solid var(--border-color); border-radius: 12px; padding: 12px 8px; text-align: center; cursor: pointer; transition: all 0.2s; }
        .provider-btn.active { border-color: var(--bryt-primary); background: #f0f9ff; box-shadow: 0 4px 12px rgba(29, 94, 208, 0.1); }
        .provider-logo { width: 42px; height: 42px; margin: 0 auto 8px; border-radius: 12px; object-fit: contain; background: transparent; }
        .provider-btn-label { font-size: 0.75rem; font-weight: 700; color: var(--bryt-navy); display: block; }

        .custom-select-wrapper { position: relative; user-select: none; }
        .custom-select-trigger { background: #f8fafc; border: 1px solid var(--border-color); padding: 16px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; color: var(--bryt-navy); font-size: 0.9rem; font-weight: 600; transition: border-color 0.2s; }
        .custom-select-wrapper.open .custom-select-trigger { border-color: var(--bryt-primary); background: #fff; }
        .custom-options { position: absolute; display: none; top: 100%; left: 0; right: 0; background: #ffffff; border: 1px solid var(--border-color); border-radius: 12px; margin-top: 8px; z-index: 10; max-height: 280px; overflow-y: auto; box-shadow: 0 10px 40px rgba(7, 26, 58, 0.15); }
        .custom-select-wrapper.open .custom-options { display: block; }
        .custom-option { padding: 16px; border-bottom: 1px solid #f1f5f9; cursor: pointer; font-size: 0.85rem; color: var(--bryt-navy); font-weight: 600; transition: background 0.2s; display: flex; justify-content: space-between; }
        .custom-option:last-child { border-bottom: none; }
        .custom-option:hover { background: #f0f9ff; color: var(--bryt-primary); }

        .bryt-toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-150px); background: #ffffff; padding: 14px 20px; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 12px; z-index: 9999; transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); min-width: 300px; border-left: 4px solid var(--bryt-primary); }
        .bryt-toast.show { transform: translateX(-50%) translateY(0); }
        .toast-icon { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0; }
        .toast-success .toast-icon { background: #16a34a; }
        .toast-success { border-left-color: #16a34a; }
        .toast-error .toast-icon { background: #dc2626; }
        .toast-error { border-left-color: #dc2626; }
        .toast-text { font-size: 0.85rem; font-weight: 600; color: var(--bryt-navy); }
    </style>
</head>
<body>

    <div id="bryt-toast" class="bryt-toast">
        <div id="toast-icon-wrap" class="toast-icon"></div>
        <div id="toast-text" class="toast-text">Message</div>
    </div>

    <main class="app-container" style="max-width: 520px;">
        <a href="/dashboard/" style="text-decoration:none; color:var(--text-muted); font-size:0.85rem; font-weight:600; display:inline-flex; align-items:center; gap:6px; margin-bottom: 24px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Dashboard
        </a>

        <div class="form-card">
            <header style="margin-bottom: 24px; display: flex; justify-content: space-between; align-items: flex-start;">
                <div>
                    <h1 style="font-size: 1.35rem; color: var(--bryt-navy); margin-bottom: 4px;">TV & Streaming</h1>
                    <p style="font-size: 0.85rem; color: var(--text-muted);">DStv, GOtv, StarTimes & Showmax</p>
                </div>
                <div style="text-align: right; background: #f8fafc; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border-color);">
                    <div style="font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; margin-bottom: 2px;">Balance</div>
                    <strong id="user-balance" style="color: var(--bryt-navy); font-size: 0.95rem;">₦0.00</strong>
                </div>
            </header>

            <form id="tv-form">
                <div class="form-group">
                    <label class="provider-select-label" style="font-weight: 700; margin-bottom: 12px; display: block;">Select Provider</label>
                    <div class="provider-grid">
                        <div class="provider-btn network-btn active" data-network="dstv" data-logo="dstv-logo.png">
                            <img src="../../assets/img/dstv-logo.png" class="provider-logo" alt="DStv">
                            <span class="provider-btn-label">DStv</span>
                        </div>
                        <div class="provider-btn network-btn" data-network="gotv" data-logo="gotv-logo.png">
                            <img src="../../assets/img/gotv-logo.png" class="provider-logo" alt="GOtv">
                            <span class="provider-btn-label">GOtv</span>
                        </div>
                        <div class="provider-btn network-btn" data-network="startimes" data-logo="startimes-logo.png">
                            <img src="../../assets/img/startimes-logo.png" class="provider-logo" alt="StarTimes">
                            <span class="provider-btn-label">StarTimes</span>
                        </div>
                        <div class="provider-btn network-btn" data-network="showmax" data-logo="showmax-logo.png">
                            <img src="../../assets/img/showmax-logo.png" class="provider-logo" alt="Showmax">
                            <span class="provider-btn-label">Showmax</span>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" style="font-weight: 700;">Select Package</label>
                    <div class="custom-select-wrapper" id="custom-select-wrapper">
                        <div class="custom-select-trigger" id="custom-select-trigger">
                            <span id="custom-select-text" style="opacity: 0.6;">Select a package...</span>
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </div>
                        <div class="custom-options" id="custom-options-list">
                            <!-- Populated dynamically -->
                        </div>
                    </div>
                    <input type="hidden" id="tv-plan" required>
                </div>

                <div class="form-group" style="margin-top: 24px;">
                    <label id="input-label" class="form-label" for="smartcard" style="font-weight: 700;">Smartcard / IUC Number</label>
                    <div style="display: flex; gap: 10px; align-items: stretch;">
                        <input type="text" id="smartcard" class="form-input" style="padding: 16px; font-size: 1.1rem; letter-spacing: 2px;" placeholder="e.g. 1029384756" required>
                        <button type="button" id="verify-btn" class="btn-secondary" style="width: auto; min-width: 110px; font-weight: 700;">Verify</button>
                    </div>
                    
                    <div id="customer-name-box" style="display: none; margin-top: 12px; padding: 14px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; color: #166534; font-size: 0.95rem; font-weight: 700; text-align: center;">
                        <!-- Name injects here -->
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="btn-primary" style="margin-top: 32px; width: 100%; padding: 18px; font-size: 1.05rem;" disabled>
                    Proceed
                </button>
            </form>
        </div>
    </main>

    <!-- Redesigned Confirmation Modal -->
    <div id="confirm-modal" class="modal-overlay">
        <div class="modal-content" style="padding: 32px 24px; text-align: center;">
            
            <img id="modal-network-logo" src="../../assets/img/dstv-logo.png" alt="Network" style="width: 72px; height: 72px; border-radius: 12px; margin: 0 auto 16px; object-fit: contain;">
            
            <h3 class="modal-title" style="font-size: 1.4rem; margin-bottom: 8px;">Confirm Subscription</h3>
            <p class="modal-desc" style="margin-bottom: 24px;">Verify the details below.</p>

            <div class="modal-breakdown" style="background: #f8fafc; border-radius: 16px; padding: 16px 20px; text-align: left; margin-bottom: 32px; border: 1px solid var(--border-color);">
                <div class="modal-row" style="margin-bottom: 12px; display: flex; justify-content: space-between;">
                    <span style="color: var(--text-muted); font-size: 0.85rem;">Account</span>
                    <strong id="modal-name" style="color: var(--bryt-navy); font-size: 0.9rem; max-width: 60%; text-align: right;">---</strong>
                </div>
                <div class="modal-row" style="margin-bottom: 16px; display: flex; justify-content: space-between;">
                    <span style="color: var(--text-muted); font-size: 0.85rem;">Package</span>
                    <strong id="modal-plan" style="color: var(--bryt-navy); font-size: 0.9rem;">---</strong>
                </div>
                <div class="modal-row" style="padding-top: 16px; border-top: 1px dashed #cbd5e1; display: flex; justify-content: space-between; align-items: center;">
                    <span style="color: var(--text-muted); font-size: 0.85rem;">Total Debit</span>
                    <strong id="modal-amount" style="color: var(--bryt-primary); font-size: 1.4rem; font-weight: 800;">₦0.00</strong>
                </div>
            </div>

            <div class="modal-actions" style="display: flex; gap: 12px;">
                <button type="button" id="modal-cancel" class="btn-secondary" style="flex: 1; padding: 16px; font-weight: 700; color: #64748b; border-color: #cbd5e1;">Cancel</button>
                <button type="button" id="modal-confirm" class="btn-primary" style="flex: 2.2; padding: 16px; font-weight: 800; font-size: 1.05rem;">Pay Securely</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/supabase-client.js"></script>
    <script src="../../assets/js/tv.js"></script>
</body>
</html>
