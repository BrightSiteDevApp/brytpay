<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cable TV & Streaming — BRYT Pay</title>
    
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#1D5ED0">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="../../assets/css/main.css">
    <style>
        .form-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 24px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        }

        /* 🚀 TV Provider Grid */
        .provider-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 10px; 
            margin-top: 10px;
            margin-bottom: 24px; 
        }
        @media (max-width: 440px) {
            .provider-grid { grid-template-columns: repeat(2, 1fr); }
        }
        .provider-btn { 
            background: #f8fafc; 
            border: 2px solid #e2e8f0; 
            border-radius: 14px; 
            padding: 12px 6px; 
            text-align: center; 
            cursor: pointer; 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .provider-btn:hover { 
            border-color: #cbd5e1; 
            background: #ffffff; 
        }
        .provider-btn.active { 
            border-color: var(--bryt-primary); 
            background: #F0F6FF; 
            box-shadow: 0 4px 14px rgba(29, 94, 208, 0.12); 
            transform: translateY(-2px); 
        }
        .provider-btn.active::after {
            content: '✓';
            position: absolute;
            top: -6px;
            right: -6px;
            background: var(--bryt-primary);
            color: #ffffff;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            font-size: 10px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #ffffff;
        }
        .provider-logo { 
            width: 38px; 
            height: 38px; 
            margin-bottom: 8px; 
            object-fit: contain; 
        }
        .provider-btn-label { 
            font-size: 0.72rem; 
            font-weight: 800; 
            color: var(--bryt-navy); 
        }

        /* 🚀 Sleek Custom Dropdown */
        .custom-select-wrapper { position: relative; user-select: none; margin-top: 8px; }
        .custom-select-trigger { 
            background: #f8fafc; 
            border: 1.5px solid #e2e8f0; 
            padding: 14px 16px; 
            border-radius: 12px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            cursor: pointer; 
            color: var(--bryt-navy); 
            font-size: 0.95rem; 
            font-weight: 600; 
            transition: all 0.2s; 
        }
        .custom-select-trigger svg {
            transition: transform 0.2s;
            color: #64748b;
        }
        .custom-select-wrapper.open .custom-select-trigger { 
            border-color: var(--bryt-primary); 
            background: #ffffff; 
            box-shadow: 0 0 0 3px rgba(29, 94, 208, 0.1); 
        }
        .custom-select-wrapper.open .custom-select-trigger svg {
            transform: rotate(180deg);
            color: var(--bryt-primary);
        }
        .custom-options { 
            position: absolute; 
            display: none; 
            top: calc(100% + 6px); 
            left: 0; 
            right: 0; 
            background: #ffffff; 
            border: 1px solid #e2e8f0; 
            border-radius: 14px; 
            z-index: 20; 
            max-height: 270px; 
            overflow-y: auto; 
            box-shadow: 0 12px 36px rgba(11, 18, 32, 0.08); 
            padding: 4px;
        }
        .custom-select-wrapper.open .custom-options { display: block; }
        .custom-option { 
            padding: 12px 14px; 
            border-radius: 8px;
            cursor: pointer; 
            font-size: 0.85rem; 
            color: var(--bryt-navy); 
            font-weight: 600; 
            transition: background 0.15s; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }
        .custom-option:hover { 
            background: #F0F6FF; 
            color: var(--bryt-primary); 
        }
        .custom-option strong {
            font-size: 0.9rem;
            color: #10b981;
            font-weight: 800;
        }

        /* 🚀 Integrated Verify Input */
        .input-verify-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            margin-top: 8px;
        }
        .input-verify-wrapper input {
            width: 100%;
            padding: 14px 110px 14px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 600;
            color: #0f172a;
            outline: none;
            transition: all 0.2s;
            background: #f8fafc;
            letter-spacing: 1px;
        }
        .input-verify-wrapper input:focus {
            border-color: var(--bryt-primary);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(29, 94, 208, 0.1);
        }
        .input-verify-btn {
            position: absolute;
            right: 6px;
            background: var(--bryt-navy);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .input-verify-btn:hover { background: #0f2854; }
        .input-verify-btn:disabled { background: #cbd5e1; cursor: not-allowed; }

        /* 🚀 Toast */
        .bryt-toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-150px); background: #ffffff; padding: 14px 20px; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 12px; z-index: 9999; transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); min-width: 300px; border-left: 4px solid var(--bryt-primary); }
        .bryt-toast.show { transform: translateX(-50%) translateY(0); }
        .toast-icon { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0; }
        .toast-success .toast-icon { background: #16a34a; }
        .toast-success { border-left-color: #16a34a; }
        .toast-error .toast-icon { background: #dc2626; }
        .toast-error { border-left-color: #dc2626; }
        .toast-text { font-size: 0.85rem; font-weight: 600; color: var(--bryt-navy); }
    </style>
</head>
<body>

    <div id="bryt-toast" class="bryt-toast">
        <div id="toast-icon-wrap" class="toast-icon"></div>
        <div id="toast-text" class="toast-text">Message</div>
    </div>

    <!-- 🚀 Padding Bottom Set to 90px -->
    <main class="app-container" style="max-width: 520px; padding-bottom: 10px;">
        <header style="margin-bottom: 24px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;">
            <div style="min-width: 0; flex: 1;">
                <!-- 🚀 Smart Back Button Placeholder -->
                <a href="/dashboard/" id="smart-back-btn" style="text-decoration:none; color:var(--text-muted); font-size:0.85rem; font-weight:700; display:inline-flex; align-items:center; gap:6px; margin-bottom: 12px; transition: color 0.2s;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    Dashboard
                </a>

                <h1 style="font-size: 1.45rem; font-weight: 800; color: var(--bryt-navy); margin: 0 0 4px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">TV & Streaming</h1>
                <p style="font-size: 0.85rem; color: var(--text-muted); margin: 0;">Instant Cable Subscription</p>
            </div>
            
            <!-- 🚀 New Sleek Balance Pill -->
            <div style="display: flex; align-items: center; gap: 8px; background: var(--bryt-primary); padding: 8px 14px; border-radius: 20px; box-shadow: 0 6px 15px rgba(29, 94, 208, 0.2); flex-shrink: 0; margin-top: 4px;">
                <div style="background: rgba(255,255,255,0.2); border-radius: 50%; padding: 4px; display: flex;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
                </div>
                <div style="display: flex; flex-direction: column; align-items: flex-end;">
                    <span style="font-size: 0.6rem; color: #e0f2fe; text-transform: uppercase; font-weight: 800; letter-spacing: 0.5px; line-height: 1;">Balance</span>
                    <strong id="user-balance" style="color: #ffffff; font-size: 0.95rem; font-weight: 800; line-height: 1.2;">₦0.00</strong>
                </div>
            </div>
        </header>

        <div class="form-card">
            <form id="tv-form">
                
                <!-- 1. Provider Selection -->
                <div class="form-group" style="margin-bottom: 20px;">
                    <label style="font-size: 0.8rem; font-weight: 800; color: #475569; text-transform: uppercase; letter-spacing: 0.5px;">1. Select Provider</label>
                    <div class="provider-grid">
                        <div class="provider-btn network-btn active" data-network="dstv" data-logo="dstv-logo.png">
                            <img src="../../assets/img/dstv-logo.png" class="provider-logo" alt="DStv">
                            <span class="provider-btn-label">DStv</span>
                        </div>
                        <div class="provider-btn network-btn" data-network="gotv" data-logo="gotv-logo.png">
                            <img src="../../assets/img/gotv-logo.png" class="provider-logo" alt="GOtv">
                            <span class="provider-btn-label">GOtv</span>
                        </div>
                        <div class="provider-btn network-btn" data-network="startimes" data-logo="startimes-logo.png">
                            <img src="../../assets/img/startimes-logo.png" class="provider-logo" alt="StarTimes">
                            <span class="provider-btn-label">StarTimes</span>
                        </div>
                        <div class="provider-btn network-btn" data-network="showmax" data-logo="showmax-logo.png">
                            <img src="../../assets/img/showmax-logo.png" class="provider-logo" alt="Showmax">
                            <span class="provider-btn-label">Showmax</span>
                        </div>
                    </div>
                </div>

                <!-- 2. Select Package -->
                <div class="form-group" style="margin-bottom: 24px;">
                    <label class="form-label" style="font-size: 0.8rem; font-weight: 800; color: #475569; text-transform: uppercase; letter-spacing: 0.5px;">2. Select Package</label>
                    <div class="custom-select-wrapper" id="custom-select-wrapper">
                        <div class="custom-select-trigger" id="custom-select-trigger">
                            <span id="custom-select-text" style="opacity: 0.6;">Select a package...</span>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </div>
                        <div class="custom-options" id="custom-options-list">
                            <!-- Populated dynamically via JS -->
                        </div>
                    </div>
                    <input type="hidden" id="tv-plan" required>
                </div>

                <!-- 3. Smartcard Input + Inline Verify -->
                <div class="form-group" style="margin-bottom: 28px;">
                    <label id="input-label" class="form-label" for="smartcard" style="font-size: 0.8rem; font-weight: 800; color: #475569; text-transform: uppercase; letter-spacing: 0.5px;">3. Smartcard / IUC Number</label>
                    <div class="input-verify-wrapper">
                        <input type="text" id="smartcard" placeholder="e.g. 1029384756" required>
                        <button type="button" id="verify-btn" class="input-verify-btn">Verify</button>
                    </div>
                    
                    <div id="customer-name-box" style="display: none; margin-top: 12px; padding: 12px 16px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 12px; color: #166534; font-size: 0.9rem; font-weight: 700; text-align: left; display: flex; align-items: center; gap: 8px;">
                        <!-- Name injects here -->
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="btn-primary" style="padding: 16px; font-size: 1rem; border-radius: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px;" disabled>
                    Proceed
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </button>
            </form>
        </div>
    </main>

    <!-- Confirmation Modal -->
    <div id="confirm-modal" class="modal-overlay">
        <div class="modal-content" style="max-width: 400px; padding: 28px 24px; border-radius: 20px; text-align: center;">
            <img id="modal-network-logo" src="../../assets/img/dstv-logo.png" alt="Network" style="width: 64px; height: 64px; border-radius: 12px; margin: 0 auto 16px; object-fit: contain;">
            
            <h3 class="modal-title" style="font-size: 1.25rem; margin-bottom: 4px;">Confirm Subscription</h3>
            <p class="modal-desc" style="font-size: 0.82rem; margin-bottom: 20px; color: var(--text-muted);">Review details before wallet deduction.</p>

            <div class="modal-breakdown" style="background: #f8fafc; border-radius: 14px; padding: 16px; text-align: left; margin-bottom: 24px; border: 1px solid #e2e8f0;">
                <div class="modal-row" style="margin-bottom: 12px; display: flex; justify-content: space-between;">
                    <span style="color: var(--text-muted); font-size: 0.85rem;">Account</span>
                    <strong id="modal-name" style="color: var(--bryt-navy); font-size: 0.85rem; max-width: 60%; text-align: right; text-transform: uppercase;">---</strong>
                </div>
                <div class="modal-row" style="margin-bottom: 16px; display: flex; justify-content: space-between;">
                    <span style="color: var(--text-muted); font-size: 0.85rem;">Package</span>
                    <strong id="modal-plan" style="color: var(--bryt-navy); font-size: 0.95rem;">---</strong>
                </div>
                <div class="modal-row" style="padding-top: 12px; border-top: 1px dashed #cbd5e1; display: flex; justify-content: space-between; align-items: center; margin-bottom: 0;">
                    <span style="color: var(--text-muted); font-size: 0.85rem;">Total Debit</span>
                    <strong id="modal-amount" style="color: #10b981; font-size: 1.25rem; font-weight: 800;">₦0.00</strong>
                </div>
            </div>

            <div class="modal-actions" style="display: flex; gap: 10px;">
                <button type="button" id="modal-cancel" class="btn-secondary" style="flex: 1; padding: 14px; font-weight: 700;">Cancel</button>
                <button type="button" id="modal-confirm" class="btn-primary" style="flex: 1.8; padding: 14px; font-weight: 800;">Pay Now</button>
            </div>
        </div>
    </div>

      <!-- Mobile Bottom Navigation -->
   <nav class="mobile-nav no-print">
    <a href="/dashboard/" class="nav-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Home</span></a>
    <a href="/dashboard/services/" class="nav-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg><span>Services</span></a>
    <a href="/dashboard/fund/" class="nav-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg><span>Wallet</span></a>
    <a href="/dashboard/orders/" class="nav-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg><span>My Orders</span></a>
    <a href="/dashboard/account/" class="nav-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>Account</span></a>
</nav>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/supabase-client.js"></script>
    <script src="../../assets/js/tv.js"></script>
</body>
</html>
