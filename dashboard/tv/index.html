<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cable TV — BRYT Pay</title>
    
    <!-- Anti-Flash Dark Mode Script -->
    <script>
        if (localStorage.getItem('bryt_theme') === 'dark') {
            document.documentElement.classList.add('dark-theme');
        }
    </script>

    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../../assets/css/main.css">

    <style>
        :root {
            --bryt-primary: #1D5ED0;
            --bryt-navy: #0B1220;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #0B1220;
            --border-light: #f1f5f9;
        }

        html.dark-theme {
            --bryt-navy: #ffffff;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --border-light: #334155;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 80px !important;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Topbar Header */
        .app-topbar { 
            display: flex; align-items: center; gap: 16px; padding: 16px 20px; 
            background: var(--card-bg); position: sticky; top: 0; z-index: 100; 
            border-bottom: 1px solid var(--border-light); transition: background 0.3s, border 0.3s; 
        }
        .smart-back { 
            color: var(--text-main); display: flex; align-items: center; 
            text-decoration: none; padding: 4px; margin-left: -4px;
        }
        .page-title { font-size: 1.15rem; font-weight: 800; color: var(--text-main); margin: 0; }

        .main-content { padding: 20px; }

        /* Sleek Balance Pill */
        .balance-pill { background: var(--card-bg); border: 1px solid var(--border-light); padding: 16px 20px; border-radius: 16px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.02); transition: 0.3s; }
        .balance-label { font-size: 0.65rem; font-weight: 800; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
        .balance-amount { font-size: 1.4rem; font-weight: 800; color: var(--text-main); line-height: 1; }
        .balance-icon { width: 42px; height: 42px; background: rgba(29, 94, 208, 0.1); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--bryt-primary); }

        .form-card { background: var(--card-bg); border-radius: 16px; padding: 20px; border: 1px solid var(--border-light); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02); transition: 0.3s; }

        /* Network Grid */
        .provider-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; margin-bottom: 20px; }
        .provider-btn { background: var(--bg-color); border: 1.5px solid var(--border-light); border-radius: 12px; padding: 12px 4px; text-align: center; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .provider-btn.active { border-color: var(--bryt-primary); background: rgba(29, 94, 208, 0.05); }
        .provider-btn.active::after { content: '✓'; position: absolute; top: -6px; right: -6px; background: var(--bryt-primary); color: #ffffff; width: 18px; height: 18px; border-radius: 50%; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; border: 2px solid var(--card-bg); }
        
        .provider-logo-wrap { width: 44px; height: 44px; background: #ffffff; border-radius: 10px; display: flex; align-items: center; justify-content: center; padding: 6px; margin-bottom: 6px; border: 1px solid var(--border-light); }
        .provider-logo { width: 100%; height: 100%; object-fit: contain; }
        .provider-btn-label { font-size: 0.75rem; font-weight: 800; color: var(--text-main); }

        /* Custom Dropdown mapped to Dark Mode */
        .form-group label { font-size: 0.7rem; font-weight: 800; color: #64748b; text-transform: uppercase; margin-bottom: 6px; display: block; }
        .custom-select-wrapper { position: relative; user-select: none; margin-top: 8px; }
        .custom-select-trigger { background: var(--bg-color); border: 1.5px solid var(--border-light); padding: 14px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; color: var(--text-main); font-size: 0.85rem; font-weight: 700; transition: 0.2s; }
        .custom-select-trigger svg { transition: transform 0.2s; color: #64748b; width: 18px; height: 18px; }
        .custom-select-wrapper.open .custom-select-trigger { border-color: var(--bryt-primary); background: var(--card-bg); }
        .custom-select-wrapper.open .custom-select-trigger svg { transform: rotate(180deg); color: var(--bryt-primary); }
        
        .custom-options { position: absolute; display: none; top: calc(100% + 4px); left: 0; right: 0; background: var(--card-bg); border: 1px solid var(--border-light); border-radius: 12px; z-index: 20; max-height: 240px; overflow-y: auto; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15); padding: 6px; }
        .custom-select-wrapper.open .custom-options { display: block; }
        .custom-option { padding: 12px 14px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; color: var(--text-main); font-weight: 600; transition: background 0.15s; display: flex; justify-content: space-between; align-items: center; }
        .custom-option:hover { background: rgba(29, 94, 208, 0.05); color: var(--bryt-primary); }
        .custom-option strong { font-size: 0.85rem; color: #10b981; font-weight: 800; }

        /* Verify Input Logic */
        .input-verify-wrapper { position: relative; display: flex; align-items: center; }
        .input-verify-wrapper input { width: 100%; padding: 14px 90px 14px 14px; border: 1.5px solid var(--border-light); border-radius: 12px; font-size: 0.95rem; font-weight: 700; color: var(--text-main); outline: none; transition: 0.2s; background: var(--bg-color); letter-spacing: 1px; }
        .input-verify-wrapper input:focus { border-color: var(--bryt-primary); background: var(--card-bg); }
        .input-verify-btn { position: absolute; right: 8px; background: var(--bryt-primary); color: white; border: none; padding: 8px 12px; border-radius: 8px; font-size: 0.7rem; font-weight: 800; cursor: pointer; transition: 0.2s; text-transform: uppercase; letter-spacing: 0.5px; }
        .input-verify-btn:disabled { background: #94a3b8; cursor: not-allowed; }

        /* Fullscreen Success Overlay */
        .success-overlay { position: fixed; inset: 0; background: var(--card-bg); z-index: 20000; display: none; flex-direction: column; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s; }
        .success-overlay.active { display: flex; opacity: 1; }
        .success-circle { width: 80px; height: 80px; border-radius: 50%; background: #10b981; color: #fff; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; box-shadow: 0 0 0 10px rgba(16, 185, 129, 0.15); animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .success-circle svg { width: 40px; height: 40px; }
        .success-title { font-size: 1.5rem; font-weight: 800; color: var(--text-main); margin-bottom: 8px; animation: slideUp 0.5s ease 0.1s both; }
        .success-desc { font-size: 0.85rem; color: #64748b; font-weight: 600; animation: slideUp 0.5s ease 0.2s both; }
        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes slideUp { 0% { transform: translateY(10px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }

        /* Modals & Toasts */
        .modal-overlay { position: fixed; inset: 0; background: rgba(11, 18, 32, 0.8); backdrop-filter: blur(4px); z-index: 10000; display: none; align-items: center; justify-content: center; padding: 16px; }
        .modal-card { background: var(--card-bg); border-radius: 16px; max-width: 360px; width: 100%; padding: 24px; border: 1px solid var(--border-light); text-align: center; }
        .modal-breakdown { background: var(--bg-color); border-radius: 12px; padding: 14px; text-align: left; margin-bottom: 20px; border: 1px solid var(--border-light); }
        .modal-row { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 8px; font-weight: 600; }

        .bryt-toast { position: fixed; top: 20px; left: 0; right: 0; margin: 0 auto; width: max-content; max-width: 90%; transform: translateY(-150px); background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-light); padding: 12px 16px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 10px; z-index: 9999; transition: transform 0.4s; border-left: 4px solid var(--bryt-primary); }
        .bryt-toast.show { transform: translateY(0); }
        .toast-icon { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0; }
        .toast-success .toast-icon { background: #16a34a; }
        .toast-error .toast-icon { background: #dc2626; }
        .toast-text { font-size: 0.8rem; font-weight: 600; }

        /* Native Bottom Nav */
        .mobile-nav { position: fixed !important; bottom: 0 !important; left: 0 !important; right: 0 !important; background: var(--card-bg) !important; z-index: 9999 !important; border-top: 1px solid var(--border-light) !important; display: flex !important; justify-content: space-around !important; padding: 12px 0 10px 0 !important; transition: background 0.3s, border 0.3s; }
        .mobile-nav .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #94a3b8; text-decoration: none; transition: color 0.2s; }
        .mobile-nav .nav-item span { font-size: 0.65rem; font-weight: 800; }
        .mobile-nav .nav-item svg { width: 22px; height: 22px; }
        .mobile-nav .nav-item.active { color: var(--bryt-primary); }
    </style>
</head>
<body>

    <div id="bryt-toast" class="bryt-toast">
        <div id="toast-icon-wrap" class="toast-icon"></div>
        <div id="toast-text" class="toast-text">Message</div>
    </div>

    <!-- Fullscreen Success Animation -->
    <div id="success-overlay" class="success-overlay">
        <div class="success-circle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <div class="success-title">Activated!</div>
        <div class="success-desc">TV Subscription successful.</div>
    </div>

    <header class="app-topbar">
        <a href="/dashboard/index.html" class="smart-back">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </a>
        <h1 class="page-title">Cable TV</h1>
    </header>

    <main class="main-content">
        <!-- Sleek Balance Pill -->
        <div class="balance-pill">
            <div>
                <div class="balance-label">Wallet Balance</div>
                <div class="balance-amount" id="user-balance">₦0.00</div>
            </div>
            <div class="balance-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
            </div>
        </div>

        <div class="form-card">
            <form id="tv-form">
                
                <div class="form-group" style="margin-bottom: 20px;">
                    <label>1. Select Provider</label>
                    <div class="provider-grid">
                        <div class="provider-btn network-btn active" data-network="dstv" data-logo="dstv-logo.png">
                            <div class="provider-logo-wrap"><img src="../../assets/img/dstv-logo.png" class="provider-logo" alt="DStv"></div>
                            <span class="provider-btn-label">DStv</span>
                        </div>
                        <div class="provider-btn network-btn" data-network="gotv" data-logo="gotv-logo.png">
                            <div class="provider-logo-wrap"><img src="../../assets/img/gotv-logo.png" class="provider-logo" alt="GOtv"></div>
                            <span class="provider-btn-label">GOtv</span>
                        </div>
                        <div class="provider-btn network-btn" data-network="startimes" data-logo="startimes-logo.png">
                            <div class="provider-logo-wrap"><img src="../../assets/img/startimes-logo.png" class="provider-logo" alt="StarTimes"></div>
                            <span class="provider-btn-label">StarTimes</span>
                        </div>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 20px;">
                    <label>2. Select Package</label>
                    <div class="custom-select-wrapper" id="custom-select-wrapper">
                        <div class="custom-select-trigger" id="custom-select-trigger">
                            <span id="custom-select-text" style="opacity: 0.6;">Select a package...</span>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </div>
                        <div class="custom-options" id="custom-options-list"></div>
                    </div>
                    <input type="hidden" id="tv-plan" required>
                </div>

                <div class="form-group" style="margin-bottom: 28px;">
                    <label id="input-label" for="smartcard">3. Smartcard / IUC Number</label>
                    <div class="input-verify-wrapper">
                        <input type="text" id="smartcard" placeholder="e.g. 1029384756" required>
                        <button type="button" id="verify-btn" class="input-verify-btn">Verify</button>
                    </div>
                    
                    <div id="customer-name-box" style="display: none; margin-top: 12px; padding: 12px 14px; background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.3); border-radius: 10px; color: #16a34a; font-size: 0.85rem; font-weight: 700; align-items: center; gap: 8px;">
                        <!-- Name injects here -->
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="btn-primary" style="padding: 14px; font-size: 0.9rem; border-radius: 12px; font-weight: 800; display: flex; justify-content: center; align-items: center; gap: 8px; width: 100%; border: none;" disabled>
                    Proceed
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </form>
        </div>
    </main>

    <!-- Review Modal -->
    <div id="confirm-modal" class="modal-overlay">
        <div class="modal-card">
            <div style="width: 54px; height: 54px; background: #ffffff; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; border: 1px solid var(--border-light); padding: 6px;">
                <img id="modal-network-logo" src="../../assets/img/dstv-logo.png" style="width: 100%; height: 100%; object-fit: contain;">
            </div>
            
            <h3 style="font-size: 1.15rem; font-weight: 800; color: var(--text-main); margin: 0 0 4px 0;">Confirm Subscription</h3>
            <p style="font-size: 0.75rem; color: #64748b; margin-bottom: 20px;">Review details before wallet deduction.</p>

            <div class="modal-breakdown">
                <div class="modal-row" style="margin-bottom: 8px;">
                    <span style="color: #64748b;">Account</span>
                    <strong id="modal-name" style="color: var(--text-main); max-width: 60%; text-align: right; text-transform: uppercase;">---</strong>
                </div>
                <div class="modal-row" style="margin-bottom: 12px;">
                    <span style="color: #64748b;">Package</span>
                    <strong id="modal-plan" style="color: var(--text-main); font-size: 0.85rem;">---</strong>
                </div>
                <div class="modal-row" style="padding-top: 12px; border-top: 1px dashed var(--border-light); align-items: center; margin-bottom: 0;">
                    <span style="color: #64748b;">Total Debit</span>
                    <strong id="modal-amount" style="color: #10b981; font-size: 1.25rem; font-weight: 800;">₦0.00</strong>
                </div>
            </div>

            <div style="display: flex; gap: 8px;">
                <button type="button" id="modal-cancel" style="flex: 1; padding: 12px; border-radius: 12px; background: var(--bg-color); color: var(--text-main); border: 1px solid var(--border-light); font-weight: 700; font-size: 0.85rem; cursor: pointer;">Cancel</button>
                <button type="button" id="modal-confirm" style="flex: 1.5; padding: 12px; border-radius: 12px; background: var(--bryt-primary); color: #ffffff; border: none; font-weight: 800; font-size: 0.85rem; cursor: pointer;">Pay Now</button>
            </div>
        </div>
    </div>

    <!-- Native Bottom Nav -->
    <nav class="mobile-nav no-print">
        <a href="/dashboard/index.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Home</span></a>
        <a href="/dashboard/services/index.html" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg><span>Services</span></a>
        <a href="/dashboard/fund/index.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg><span>Wallet</span></a>
        <a href="/dashboard/orders/index.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg><span>Orders</span></a>
        <a href="/dashboard/account/index.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>Account</span></a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/supabase-client.js"></script>
    <script src="../../assets/js/tv.js"></script>
</body>
</html>
