<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Transaction Summary — BRYT Pay</title>

    <script>
        if (localStorage.getItem('bryt_theme') === 'dark') {
            document.documentElement.classList.add('dark-theme');
        }
    </script>

    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../../assets/css/main.css">

    <style>
        :root {
            --bryt-primary: #1D5ED0;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #0B1220;
            --border-light: #f1f5f9;
        }

        html.dark-theme {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --border-light: #334155;
        }

        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 20px !important; /* Adjusted padding */ font-family: system-ui, -apple-system, sans-serif; margin: 0; transition: background-color 0.3s, color 0.3s; }
        
        .app-topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: var(--card-bg); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border-light); transition: background 0.3s, border 0.3s; }
        .app-topbar-left { display: flex; align-items: center; gap: 16px; }
        .smart-back { color: var(--text-main); display: flex; align-items: center; text-decoration: none; padding: 4px; margin-left: -4px; cursor: pointer; border: none; background: transparent; }
        .page-title { font-size: 1.15rem; font-weight: 800; color: var(--text-main); margin: 0; }
        
        .page-container { padding: 20px; }

        .summary-card { background: var(--card-bg); border-radius: 16px; padding: 16px; display: flex; align-items: center; gap: 14px; margin-bottom: 20px; border: 1px solid var(--border-light); box-shadow: 0 4px 10px rgba(0,0,0,0.02); transition: 0.3s; }
        .summary-icon-wrap { width: 50px; height: 50px; background: #ffffff; border-radius: 12px; padding: 8px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border-light); }
        .summary-icon-wrap img { width: 100%; height: 100%; object-fit: contain; }
        .summary-info { flex-grow: 1; }
        .summary-title { font-size: 0.85rem; font-weight: 800; color: var(--text-main); margin-bottom: 2px; }
        .summary-price { font-size: 1.25rem; font-weight: 800; color: var(--bryt-primary); }
        
        .details-list { background: var(--card-bg); padding: 0 16px; border-radius: 16px; border: 1px solid var(--border-light); box-shadow: 0 4px 10px rgba(0,0,0,0.02); margin-bottom: 20px; transition: 0.3s; }
        .detail-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px dashed var(--border-light); }
        .detail-item:last-child { border-bottom: none; }
        .detail-label { font-size: 0.7rem; color: #64748b; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; }
        .detail-value { font-size: 0.8rem; font-weight: 800; color: var(--text-main); text-align: right; }
        
        .status-pill { padding: 4px 10px; border-radius: 8px; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .action-grid { display: flex; gap: 10px; width: 100%; align-items: stretch; }
        .btn-query { background: var(--bg-color); border: 1px solid var(--border-light); color: var(--text-main); padding: 14px; border-radius: 12px; font-weight: 800; font-size: 0.85rem; cursor: pointer; transition: 0.2s; text-align: center; flex: 1; white-space: nowrap; }
        .btn-download { background: var(--bryt-primary); color: #ffffff; border: none; padding: 14px; border-radius: 12px; font-weight: 800; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: background 0.2s; white-space: nowrap; flex: 1; }
        .btn-download svg { width: 18px; height: 18px; flex-shrink: 0; }
        .btn-download:disabled { background: #94a3b8; cursor: not-allowed; }

        /* Bottom Sheet */
        .bottom-sheet-overlay { position: fixed; inset: 0; background: rgba(11, 18, 32, 0.8); backdrop-filter: blur(4px); z-index: 10000; display: none; align-items: flex-end; justify-content: center; opacity: 0; transition: opacity 0.3s; }
        .bottom-sheet-overlay.active { display: flex; opacity: 1; }
        .bottom-sheet { background: var(--card-bg); width: 100%; max-width: 480px; border-radius: 24px 24px 0 0; padding: 24px 20px 40px 20px; border-top: 1px solid var(--border-light); transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1); max-height: 90vh; overflow-y: auto; }
        .bottom-sheet-overlay.active .bottom-sheet { transform: translateY(0); }
        
        .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .sheet-header h3 { margin: 0; font-size: 1.15rem; font-weight: 800; color: var(--text-main); }
        .btn-close-modal { background: var(--bg-color); border: none; color: #64748b; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        
        .query-info-box { background: var(--bg-color); padding: 12px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border-light); }
        .sheet-row { display: flex; justify-content: space-between; font-size: 0.75rem; border-bottom: 1px dashed var(--border-light); padding: 10px 0; }
        .sheet-row:last-child { border-bottom: none; }
        .sheet-row span { color: #64748b; font-weight: 600; }
        .sheet-row strong { color: var(--text-main); font-weight: 800; }
        
        .sheet-input { width: 100%; background: var(--bg-color); border: 1.5px solid var(--border-light); color: var(--text-main); padding: 14px; border-radius: 12px; margin-bottom: 16px; outline: none; font-size: 0.85rem; font-weight: 600; resize: vertical; min-height: 80px; transition: 0.2s; box-sizing: border-box; }
        .sheet-input:focus { border-color: var(--bryt-primary); background: var(--card-bg); }
        .btn-submit-query { background: var(--bryt-primary); color: #fff; width: 100%; padding: 14px; font-size: 0.9rem; font-weight: 800; border: none; border-radius: 12px; cursor: pointer; transition: 0.2s; }
    </style>
</head>
<body>

    <header class="app-topbar">
        <div class="app-topbar-left">
            <a id="smart-back-btn" class="smart-back">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </a>
            <h1 class="page-title">Order Details</h1>
        </div>
    </header>

    <main class="page-container">
        
        <div class="summary-card">
            <div class="summary-icon-wrap">
                <img src="../../assets/img/jamb-logo.png" onerror="this.src='../../assets/img/brytpay-logo.png'">
            </div>
            <div class="summary-info">
                <div class="summary-title" id="sum-title">---</div>
                <div class="summary-price" id="sum-price">₦0.00</div>
            </div>
        </div>

        <div class="details-list">
            <div class="detail-item">
                <div class="detail-label">Order Reference</div>
                <div class="detail-value" id="sum-ref" style="font-family: monospace; color: var(--bryt-primary);">---</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">Payment Method</div>
                <div class="detail-value">Wallet</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">Amount Paid</div>
                <div class="detail-value" id="sum-amount">₦0.00</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">Date</div>
                <div class="detail-value" id="sum-date">---</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">Status</div>
                <div><span id="sum-status" class="status-pill">---</span></div>
            </div>
        </div>

        <div class="action-grid">
            <button class="btn-query" id="btn-open-query">Query Order</button>
            <button class="btn-download" id="btn-download-doc" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                Pending
            </button>
        </div>
    </main>

    <div class="bottom-sheet-overlay" id="query-overlay">
        <div class="bottom-sheet" id="query-sheet">
            <div class="sheet-header">
                <h3>Query Order</h3>
                <button type="button" class="btn-close-modal" id="btn-close-query">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            
            <div class="query-info-box">
                <div class="sheet-row"><span>Candidate</span><strong id="q-name">---</strong></div>
                <div class="sheet-row"><span>Reg No</span><strong id="q-reg">---</strong></div>
                <div class="sheet-row"><span>Year</span><strong id="q-year">---</strong></div>
            </div>

            <textarea id="q-message" class="sheet-input" placeholder="Describe your issue in detail..." required></textarea>
            <button id="btn-submit-query" class="btn-submit-query">Submit Query</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/supabase-client.js"></script>
    <script src="../../assets/js/jamb-order-details.js"></script>
</body>
</html>
