<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Transaction Summary — BRYT Pay</title>

    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#1D5ED0">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="../../assets/css/main.css">
    <style>
        * { box-sizing: border-box; }
        body { background: #f8fafc; margin: 0; color: var(--bryt-navy); overflow-x: hidden; padding-bottom: 75px !important; font-family: system-ui, -apple-system, sans-serif; }
        
        /* Centered Header Fix */
        .header-bar { 
            padding: 12px 16px; 
            display: flex; 
            align-items: center; 
            justify-content: center; /* This perfectly centers the title */
            background: #ffffff; 
            border-bottom: 1px solid #e2e8f0; 
            position: sticky; 
            top: 0; 
            z-index: 10; 
        }
        .header-bar h2 { margin: 0; font-size: 0.95rem; font-weight: 800; color: var(--bryt-navy); }
        .header-back-btn { 
            position: absolute; /* Anchors button to the left so it doesn't push the title */
            left: 16px; 
            text-decoration: none; 
            color: #64748b; 
            font-size: 0.75rem; 
            font-weight: 800; 
            display: inline-flex; 
            align-items: center; 
            gap: 4px; 
            transition: color 0.2s; 
        }
        .header-back-btn:hover { color: var(--bryt-primary); }
        
        .page-container { padding: 16px; max-width: 520px; margin: 0 auto; }

        /* Sleek Horizontal Summary Card */
        .summary-card { background: #ffffff; border-radius: 12px; padding: 16px; display: flex; align-items: center; gap: 14px; margin-bottom: 16px; border: 1px solid #e2e8f0; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        .summary-icon { width: 44px; height: 44px; background: #f1f5f9; border-radius: 50%; padding: 8px; object-fit: contain; flex-shrink: 0; }
        .summary-info { flex-grow: 1; }
        .summary-title { font-size: 0.85rem; font-weight: 800; color: var(--bryt-navy); margin-bottom: 2px; }
        .summary-price { font-size: 1.15rem; font-weight: 800; color: var(--bryt-primary); }
        
        /* Compact Details List */
        .details-list { background: #ffffff; padding: 0 16px; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 2px 8px rgba(0,0,0,0.02); margin-bottom: 20px; }
        .detail-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px dashed #e2e8f0; }
        .detail-item:last-child { border-bottom: none; }
        .detail-label { font-size: 0.7rem; color: #64748b; font-weight: 600; }
        .detail-value { font-size: 0.75rem; font-weight: 800; color: var(--bryt-navy); text-align: right; }
        
        .status-pill { padding: 4px 10px; border-radius: 8px; font-size: 0.6rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
        .status-completed { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
        .status-processing { background: #fef9c3; color: #a16207; border: 1px solid #fef08a; }
        .status-failed { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
        
        /* Side-by-Side Action Buttons */
        .action-grid { display: flex; gap: 10px; }
        .btn-query { background: #ffffff; border: 1px solid #cbd5e1; color: #475569; padding: 12px; border-radius: 10px; font-weight: 800; font-size: 0.75rem; flex: 1; cursor: pointer; transition: all 0.2s; text-align: center; }
        .btn-query:hover { background: #f8fafc; color: var(--bryt-navy); border-color: #94a3b8; }
        .btn-download { background: var(--bryt-primary); color: #ffffff; border: none; padding: 12px; border-radius: 10px; font-weight: 800; font-size: 0.75rem; flex: 1.5; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: background 0.2s; white-space: nowrap; }
        .btn-download svg { width: 14px; height: 14px; }
        .btn-download:hover { background: #154c9a; }
        .btn-download:disabled { background: #94a3b8; cursor: not-allowed; }

        /* Fixed Overlay (High Z-Index covers Mobile Nav) */
        .bottom-sheet-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); display: none; z-index: 99999; align-items: flex-end; justify-content: center; }
        .bottom-sheet { background: #ffffff; width: 100%; max-width: 520px; border-radius: 20px 20px 0 0; padding: 16px 20px 24px; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 -10px 40px rgba(0,0,0,0.15); max-height: 85vh; display: flex; flex-direction: column; }
        .bottom-sheet.open { transform: translateY(0); }
        .sheet-handle { width: 40px; height: 4px; background: #cbd5e1; border-radius: 4px; margin: 0 auto 16px; flex-shrink: 0; }
        .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-shrink: 0; }
        .sheet-header h3 { margin: 0; font-size: 1.05rem; font-weight: 800; color: var(--bryt-navy); }
        .sheet-scroll-area { overflow-y: auto; flex-grow: 1; flex-shrink: 1; }
        
        .query-info-box { background: #f8fafc; padding: 8px 12px; border-radius: 10px; margin-bottom: 16px; border: 1px solid #e2e8f0; }
        .sheet-row { display: flex; justify-content: space-between; font-size: 0.7rem; border-bottom: 1px dashed #e2e8f0; padding: 8px 0; }
        .sheet-row:last-child { border-bottom: none; }
        .sheet-row span { color: #64748b; font-weight: 600; }
        .sheet-row strong { color: var(--bryt-navy); font-weight: 800; text-align: right; }
        
        .sheet-input { width: 100%; background: #ffffff; border: 1px solid #cbd5e1; color: var(--bryt-navy); padding: 12px; border-radius: 10px; margin-bottom: 16px; outline: none; font-size: 0.75rem; resize: vertical; min-height: 70px; transition: border 0.2s; }
        .sheet-input:focus { border-color: var(--bryt-primary); box-shadow: 0 0 0 3px #eff6ff; }
        .btn-submit-query { background: var(--bryt-navy); color: #fff; width: 100%; padding: 14px; font-size: 0.85rem; font-weight: 800; border: none; border-radius: 10px; cursor: pointer; transition: 0.2s; }
        .btn-submit-query:hover { background: #1e293b; }

        .mobile-nav { position: fixed !important; bottom: 0 !important; left: 0 !important; right: 0 !important; background: #ffffff !important; z-index: 9000 !important; border-top: 1px solid #e2e8f0 !important; display: flex !important; justify-content: space-around !important; padding: 10px 0 8px 0 !important; }
        .mobile-nav .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #94a3b8; text-decoration: none; transition: color 0.2s; }
        .mobile-nav .nav-item span { font-size: 0.65rem; font-weight: 700; }
        .mobile-nav .nav-item svg { width: 20px; height: 20px; }
        .mobile-nav .nav-item.active { color: var(--bryt-primary); }
        @media (min-width: 768px) { .mobile-nav { display: none !important; } body { padding-bottom: 0 !important; } }
    </style>
</head>
<body>

    <div class="header-bar">
        <a href="orders.html" id="smart-back-btn" class="header-back-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back
        </a>
        <h2>Order Summary</h2>
    </div>

    <main class="page-container">
        
        <div class="summary-card">
            <img src="../../assets/img/jamb-logo.png" class="summary-icon" onerror="this.src='../../assets/img/brytpay-logo.png'">
            <div class="summary-info">
                <div class="summary-title" id="sum-title">---</div>
                <div class="summary-price" id="sum-price">₦0.00</div>
            </div>
        </div>

        <div class="details-list">
            <div class="detail-item">
                <div class="detail-label">Order Reference</div>
                <div class="detail-value" id="sum-ref" style="font-family: monospace; color: var(--bryt-primary);">---</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">Payment Method</div>
                <div class="detail-value">BRYT Wallet</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">Amount Paid</div>
                <div class="detail-value" id="sum-amount">₦0.00</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">Transaction Date</div>
                <div class="detail-value" id="sum-date">---</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">Processing Status</div>
                <div><span id="sum-status" class="status-pill status-processing">Processing</span></div>
            </div>
        </div>

        <div class="action-grid">
            <button class="btn-query" id="btn-open-query">Query Order</button>
            <button class="btn-download" id="btn-download-doc" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                Pending
            </button>
        </div>
    </main>

    <div class="bottom-sheet-overlay" id="query-overlay">
        <div class="bottom-sheet" id="query-sheet">
            <div class="sheet-handle"></div>
            
            <div class="sheet-header">
                <h3>Query Order</h3>
                <svg id="btn-close-query" style="cursor: pointer;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </div>
            
            <div class="sheet-scroll-area">
                <div class="query-info-box">
                    <div class="sheet-row"><span>Candidate</span><strong id="q-name">---</strong></div>
                    <div class="sheet-row"><span>JAMB Reg No</span><strong id="q-reg">---</strong></div>
                    <div class="sheet-row" style="border: none;"><span>JAMB Year</span><strong id="q-year">---</strong></div>
                </div>

                <textarea id="q-message" class="sheet-input" placeholder="Please describe your issue in detail so our support team can assist you immediately..." required></textarea>
                
                <button id="btn-submit-query" class="btn-submit-query">Submit Query</button>
            </div>
        </div>
    </div>

    <nav class="mobile-nav no-print">
        <a href="/dashboard/" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Home</span></a>
        <a href="/dashboard/services/" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg><span>Services</span></a>
        <a href="/dashboard/fund/" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg><span>Wallet</span></a>
        <a href="/dashboard/orders/" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg><span>My Orders</span></a>
        <a href="/dashboard/account/" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>Account</span></a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/supabase-client.js"></script>
    <script src="../../assets/js/jamb-order-details.js"></script>
</body>
</html>
