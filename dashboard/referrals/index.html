<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Refer & Earn — BRYT Pay</title>
    
    <script>
        if (localStorage.getItem('bryt_theme') === 'dark') {
            document.documentElement.classList.add('dark-theme');
        }
    </script>

    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../../assets/css/main.css">

    <style>
        :root {
            --bryt-primary: #1D5ED0;
            --bryt-navy: #0B1220;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #0B1220;
            --border-light: #f1f5f9;
        }

        html.dark-theme {
            --bryt-navy: #ffffff;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --border-light: #334155;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 80px !important;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        .app-topbar { display: flex; align-items: center; gap: 16px; padding: 16px 20px; background: var(--card-bg); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border-light); transition: background 0.3s, border 0.3s; }
        .smart-back { color: var(--text-main); display: flex; align-items: center; text-decoration: none; padding: 4px; margin-left: -4px; }
        .page-title { font-size: 1.15rem; font-weight: 800; color: var(--text-main); margin: 0; }

        .main-content { padding: 20px; }

        .balance-pill { background: var(--card-bg); border: 1px solid var(--border-light); padding: 16px 20px; border-radius: 16px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.02); transition: 0.3s; }
        .balance-label { font-size: 0.65rem; font-weight: 800; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
        .balance-amount { font-size: 1.4rem; font-weight: 800; color: #10b981; line-height: 1; }
        .balance-icon { width: 42px; height: 42px; background: rgba(16, 185, 129, 0.1); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #10b981; }

        .form-card { background: var(--card-bg); border-radius: 16px; padding: 20px; border: 1px solid var(--border-light); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02); transition: 0.3s; margin-bottom: 20px; }
        
        .code-display-box { background: rgba(29, 94, 208, 0.05); border: 1.5px dashed var(--bryt-primary); border-radius: 12px; padding: 20px; text-align: center; margin-bottom: 16px; }
        .code-title { font-size: 0.75rem; font-weight: 800; color: var(--text-main); text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }
        .referral-code { font-size: 2rem; font-weight: 900; color: var(--bryt-primary); letter-spacing: 4px; font-family: monospace; user-select: all; }
        
        .btn-primary { background: var(--bryt-primary); color: #fff; border: none; padding: 14px; font-size: 0.9rem; font-weight: 800; border-radius: 12px; width: 100%; cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn-primary:active { transform: scale(0.98); }

        .section-header { font-size: 0.85rem; font-weight: 800; color: var(--text-main); text-transform: uppercase; margin: 24px 0 12px 4px; }

        .referral-item { display: flex; align-items: center; gap: 12px; padding: 14px; background: var(--bg-color); border: 1px solid var(--border-light); border-radius: 12px; margin-bottom: 8px; }
        .ref-avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--card-bg); color: var(--text-main); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.1rem; flex-shrink: 0; border: 1px solid var(--border-light); text-transform: uppercase; }
        .ref-info { flex: 1; min-width: 0; }
        .ref-name { font-size: 0.9rem; font-weight: 800; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; text-transform: capitalize; }
        
        /* Dynamic Status Badges */
        .status-badge { font-size: 0.65rem; font-weight: 800; padding: 4px 8px; border-radius: 6px; display: inline-flex; align-items: center; gap: 4px; text-transform: uppercase; }
        .status-pending-kyc { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); }
        .status-pending-fund { background: rgba(245, 158, 11, 0.1); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.2); }
        .status-completed { background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); }

        .bryt-toast { position: fixed; top: 20px; left: 0; right: 0; margin: 0 auto; width: max-content; max-width: 90%; transform: translateY(-150px); background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-light); padding: 12px 16px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 10px; z-index: 999999; transition: transform 0.4s;}
        .bryt-toast.show { transform: translateY(0); }

        .empty-state { text-align: center; padding: 30px 20px; color: #64748b; font-size: 0.85rem; font-weight: 600; line-height: 1.5; }
        .empty-icon { width: 48px; height: 48px; margin: 0 auto 12px; color: var(--border-light); }
    </style>
</head>
<body>

    <div id="bryt-toast" class="bryt-toast">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
        <div id="toast-text" style="font-size: 0.8rem; font-weight: 700;">Copied to clipboard</div>
    </div>

    <header class="app-topbar">
        <a href="/dashboard/index.html" class="smart-back">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </a>
        <h1 class="page-title">Refer & Earn</h1>
    </header>

    <main class="main-content">
        
        <!-- Total Earnings Pill -->
        <div class="balance-pill">
            <div>
                <div class="balance-label">Total Earned</div>
                <div class="balance-amount" id="total-earned">₦0.00</div>
            </div>
            <div class="balance-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 12 20 22 4 22 4 12"></polyline><rect x="2" y="7" width="20" height="5"></rect><line x1="12" y1="22" x2="12" y2="7"></line><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path></svg>
            </div>
        </div>

        <!-- Share Code Card -->
        <div class="form-card">
            <p style="font-size: 0.8rem; color: #64748b; margin: 0 0 16px; line-height: 1.5; font-weight: 600; text-align: center;">Share your code. When a friend signs up and funds their wallet, you earn 10% of their first deposit (Up to ₦300).</p>
            
            <div class="code-display-box">
                <div class="code-title">Your Referral Code</div>
                <div class="referral-code" id="user-ref-code">----</div>
            </div>

            <button type="button" id="btn-copy-code" class="btn-primary">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                Copy Code
            </button>
        </div>

        <h3 class="section-header">Your Referrals</h3>
        
        <div id="referrals-container">
            <div class="empty-state">Loading your network...</div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/supabase-client.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await window.db.auth.getSession();
            if (!session) { window.location.href = '/auth/login.html'; return; }
            
            const userId = session.user.id;

            // 1. Fetch User's Unique Code (account_id)
            const { data: profile } = await window.db.from('profiles').select('account_id').eq('id', userId).single();
            const refCodeDisplay = document.getElementById('user-ref-code');
            if (profile && profile.account_id) {
                refCodeDisplay.textContent = profile.account_id;
            }

            // 2. Fetch Referrals & Calculate Earnings
            async function loadReferralData() {
                const container = document.getElementById('referrals-container');
                const earningsDisplay = document.getElementById('total-earned');

                const { data: referrals, error } = await window.db
                    .from('referrals')
                    .select('*')
                    .eq('referrer_id', userId)
                    .order('created_at', { ascending: false });

                if (error || !referrals || referrals.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg><br>
                            You haven't referred anyone yet.<br>Share your code to start earning!
                        </div>
                    `;
                    return;
                }

                let totalEarned = 0;
                let html = '';

                referrals.forEach(ref => {
                    // Safety check to ensure we have a name to display
                    const displayName = (ref.referred_name || "New User").split(' ')[0];
                    const initial = displayName.charAt(0).toUpperCase();

                    let badgeHtml = '';
                    
                    // State Machine Logic
                    if (ref.bonus_paid) {
                        // Calculate what they actually earned (10% capped at 300)
                        let earned = parseFloat(ref.qualifying_amount) * 0.10;
                        if (earned > 300) earned = 300;
                        
                        totalEarned += earned;
                        badgeHtml = `<span class="status-badge status-completed"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg> Earned ₦${earned.toFixed(0)}</span>`;
                    } else if (ref.has_kyc && !ref.has_funded) {
                        badgeHtml = `<span class="status-badge status-pending-fund"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg> Pending Funding</span>`;
                    } else {
                        badgeHtml = `<span class="status-badge status-pending-kyc"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg> Pending KYC</span>`;
                    }

                    html += `
                        <div class="referral-item">
                            <div class="ref-avatar">${initial}</div>
                            <div class="ref-info">
                                <div class="ref-name">${displayName}</div>
                                ${badgeHtml}
                            </div>
                        </div>
                    `;
                });

                earningsDisplay.textContent = `₦${totalEarned.toLocaleString('en-NG', { minimumFractionDigits: 2 })}`;
                container.innerHTML = html;
            }

            loadReferralData();

            // 3. Copy Code Utility
            document.getElementById('btn-copy-code').addEventListener('click', () => {
                const code = refCodeDisplay.textContent;
                if (code === '----') return;

                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(code).then(showSuccessToast);
                } else {
                    const temp = document.createElement('textarea');
                    temp.value = code;
                    document.body.appendChild(temp);
                    temp.select();
                    document.execCommand('copy');
                    document.body.removeChild(temp);
                    showSuccessToast();
                }
            });

            function showSuccessToast() {
                const toast = document.getElementById('bryt-toast');
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 3000);
            }
        });
    </script>
</body>
</html>
