<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout — BRYT Pay</title>
    
    <!-- STRICT APP PRIVACY DIRECTIVE: Do not index or crawl -->
    <meta name="robots" content="noindex, nofollow">
    
    <!-- Branding -->
    <meta name="theme-color" content="#1D5ED0">
     <link rel="icon" href="/favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="../../assets/css/main.css">
    <style>
        .checkout-container { max-width: 420px; margin: 40px auto; padding: 0 16px; }
        .checkout-card { background: #FFFFFF; border-radius: 20px; padding: 32px 24px; box-shadow: 0 10px 40px rgba(7, 26, 58, 0.08); text-align: center; border: 1px solid var(--border-color); }
        
        .app-logo { width: 64px; height: 64px; border-radius: 16px; object-fit: contain; margin: 0 auto 16px; background: #f8fafc; padding: 8px; border: 1px solid #e2e8f0; }
        .app-name { font-size: 1.2rem; font-weight: 800; color: var(--bryt-navy); margin-bottom: 4px; }
        .service-name { font-size: 0.9rem; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 24px; }

        .amount-box { background: #f0f9ff; border: 1px dashed #bae6fd; border-radius: 16px; padding: 24px; margin-bottom: 24px; }
        .amount-label { font-size: 0.75rem; color: #0284c7; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 8px; }
        .amount-value { font-size: 2.4rem; font-weight: 800; color: var(--bryt-primary); }

        .wallet-info { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-top: 1px solid #f1f5f9; border-bottom: 1px solid #f1f5f9; margin-bottom: 24px; }
        .wallet-label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }
        .wallet-balance { font-size: 0.95rem; font-weight: 800; color: var(--bryt-navy); }

        .bryt-toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-150px); background: #ffffff; padding: 14px 20px; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 12px; z-index: 9999; transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); min-width: 300px; border-left: 4px solid var(--bryt-primary); }
        .bryt-toast.show { transform: translateX(-50%) translateY(0); }
        .toast-icon { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0; }
        .toast-success .toast-icon { background: #16a34a; }
        .toast-success { border-left-color: #16a34a; }
        .toast-error .toast-icon { background: #dc2626; }
        .toast-error { border-left-color: #dc2626; }
        .toast-text { font-size: 0.85rem; font-weight: 600; color: var(--bryt-navy); }
    </style>
</head>
<body>
    <div id="bryt-toast" class="bryt-toast">
        <div id="toast-icon-wrap" class="toast-icon"></div>
        <div id="toast-text" class="toast-text">Message</div>
    </div>

    <main class="checkout-container">
        <div class="checkout-card" id="checkout-ui" style="display: none;">
            <img src="../../assets/img/brytpay-logo.png" alt="App" class="app-logo" id="checkout-logo">
            <h2 class="app-name" id="checkout-app">Loading...</h2>
            <p class="service-name" id="checkout-service">...</p>

            <div class="amount-box">
                <div class="amount-label">Total to Pay</div>
                <div class="amount-value" id="checkout-amount">₦0.00</div>
            </div>

            <div class="wallet-info">
                <span class="wallet-label">Your BRYT Pay Balance</span>
                <span class="wallet-balance" id="wallet-balance">₦0.00</span>
            </div>

            <div id="insufficient-warning" style="display: none; color: #dc2626; font-size: 0.8rem; font-weight: 600; margin-bottom: 16px; background: #fee2e2; padding: 10px; border-radius: 8px;">
                Insufficient funds. Please fund your wallet to continue.
            </div>

            <button id="pay-btn" class="btn-primary" style="width: 100%; padding: 18px; font-size: 1.05rem; font-weight: 800;">
                <i class="fas fa-lock" style="margin-right: 8px;"></i> Pay Securely
            </button>

            <a href="/dashboard/" class="btn-secondary" style="display: block; width: 100%; text-align: center; text-decoration: none; margin-top: 12px; padding: 16px; font-weight: 700;">
                Cancel Payment
            </a>
        </div>

        <div id="loading-ui" style="text-align: center; padding: 60px 20px;">
            <h3 style="color: var(--bryt-navy);">Securing Session...</h3>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/supabase-client.js"></script>
    <script src="../../assets/js/checkout.js"></script>
</body>
</html>
