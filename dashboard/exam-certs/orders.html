<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Certificates — BRYT Pay</title>

    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#1D5ED0">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="../../assets/css/main.css">
    <style>
        .tx-card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            margin-top: 16px;
        }
        
        .tx-row { display: flex; align-items: center; justify-content: space-between; padding: 16px; border-bottom: 1px dashed #e2e8f0; gap: 10px; transition: background 0.15s ease; cursor: pointer; text-decoration: none; }
        .tx-row:last-child { border-bottom: none; }
        .tx-row:hover { background: #f8fafc; }
        
        .tx-left { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
        .tx-info { min-width: 0; flex: 1; }
        
        .tx-brand { 
            width: 36px; height: 36px; border-radius: 50%; background: #f8fafc; 
            border: 1px solid #e2e8f0; display: flex; align-items: center; 
            justify-content: center; overflow: hidden; flex-shrink: 0; padding: 4px; 
        }
        .tx-brand img { width: 100%; height: 100%; object-fit: contain; }
        
        .tx-title { font-weight: 800; font-size: 0.85rem; color: #0B1220; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
        .tx-date { font-size: 0.7rem; color: #64748b; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 4px; }
        
        .tx-right { text-align: right; flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
        .tx-amount { font-weight: 800; font-size: 0.95rem; letter-spacing: -0.3px; white-space: nowrap; color: #0B1220; }
        
        .tx-status { display: inline-block; font-size: 0.65rem; font-weight: 800; padding: 4px 10px; border-radius: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        .status-successful { background: #dcfce7 !important; color: #16a34a !important; border: 1px solid #bbf7d0; }
        .status-pending { background: #fef9c3 !important; color: #ca8a04 !important; border: 1px solid #fef08a; }
        .status-failed { background: #fee2e2 !important; color: #dc2626 !important; border: 1px solid #fecaca; }
    </style>
</head>
<body>

    <main class="app-container" style="max-width: 520px; padding-bottom: 90px;">
        <header style="margin-bottom: 20px;">
            <a href="/dashboard/exam-certs/" id="smart-back-btn" style="text-decoration:none; color:var(--text-muted); font-size:0.85rem; font-weight:700; display:inline-flex; align-items:center; gap:6px; margin-bottom: 12px; transition: color 0.2s;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg> 
                Back
            </a>
            
            <h1 style="font-size: 1.45rem; font-weight: 800; color: var(--bryt-navy); margin: 0 0 4px 0;">My Certificates</h1>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin: 0;">View all your recent exam certificate requests.</p>
        </header>

        <section class="tx-card">
            <div id="orders-container">
                <div style="padding: 40px 20px; text-align: center; color: #94a3b8; font-size: 0.9rem; font-weight: 600;">Loading transactions...</div>
            </div>
        </section>
    </main>

    <nav class="mobile-nav no-print">
        <a href="/dashboard/" class="nav-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Home</span></a>
        <a href="/dashboard/services/" class="nav-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg><span>Services</span></a>
        <a href="/dashboard/fund/" class="nav-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg><span>Wallet</span></a>
        <a href="/dashboard/orders/" class="nav-item active"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg><span>My Orders</span></a>
        <a href="/dashboard/account/" class="nav-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>Account</span></a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/supabase-client.js"></script>
    <script src="../../assets/js/cert-orders.js"></script>
</body>
</html>
