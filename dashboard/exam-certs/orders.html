<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Certificates — BRYT Pay</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#1D5ED0">
    <link rel="stylesheet" href="../../assets/css/main.css">
    <style>
        body { background: #f8fafc; margin: 0; color: var(--bryt-navy); }
        .header-bar { padding: 16px 20px; display: flex; align-items: center; gap: 16px; background: #ffffff; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 10; }
        .page-container { padding: 24px 16px; max-width: 520px; margin: 0 auto; padding-bottom: 90px; }

        .empty-state { text-align: center; padding: 40px 20px; }
        .empty-state svg { width: 64px; height: 64px; color: #cbd5e1; margin-bottom: 16px; }

        .order-card { background: #ffffff; border: 1px solid var(--border-color); border-radius: 16px; padding: 16px; margin-bottom: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        .order-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; border-bottom: 1px dashed #e2e8f0; padding-bottom: 12px; }
        .order-meta { font-size: 0.8rem; color: var(--text-muted); font-family: monospace; }
        
        .status-badge { font-size: 0.65rem; font-weight: 800; padding: 4px 8px; border-radius: 12px; text-transform: uppercase; }
        .badge-processing { background: #fef9c3; color: #a16207; }
        .badge-completed { background: #dcfce7; color: #15803d; }
        .badge-failed { background: #fee2e2; color: #b91c1c; }

        .order-details { font-size: 0.85rem; margin-bottom: 16px; line-height: 1.5; color: #475569; }
        .order-details strong { color: var(--bryt-navy); }

        .btn-download { display: flex; align-items: center; justify-content: center; gap: 8px; background: #16a34a; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: 700; cursor: pointer; width: 100%; transition: background 0.2s; text-decoration: none; }
        .btn-download:hover { background: #15803d; }
    </style>
</head>
<body>

    <div class="header-bar">
        <a href="index.html" style="color: var(--bryt-navy);"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg></a>
        <h2 style="margin: 0; font-size: 1.15rem; font-weight: 700;">My Certificates</h2>
    </div>

    <main class="page-container" id="orders-container">
        <div style="text-align: center; padding: 40px 0; color: var(--text-muted); font-weight: 600;">Loading your certificates...</div>
    </main>
    
 <nav class="mobile-nav">
        <a href="/dashboard/" class="nav-item active"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Home</span></a>
        <a href="/dashboard/history/" class="nav-item"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span>History</span></a>
        <a href="/dashboard/fund/" class="nav-item"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg><span>Wallet</span></a>
        <a href="/dashboard/account/" class="nav-item"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>Account</span></a>
    </nav>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/supabase-client.js"></script>
    <script src="../../assets/js/cert-orders.js"></script>
</body>
</html>
