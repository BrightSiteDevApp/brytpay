<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Certificate Summary — BRYT Pay</title>

    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#1D5ED0">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="../../assets/css/main.css">
    <style>
        * { box-sizing: border-box; }
        body { background: #f8fafc; margin: 0; color: var(--bryt-navy); overflow-x: hidden; }
        
        .header-bar { padding: 16px 20px; display: flex; align-items: center; gap: 16px; background: #ffffff; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 10; }
        
        .page-container { padding: 24px 16px; max-width: 520px; margin: 0 auto; padding-bottom: 10px; }

        .summary-card { background: #ffffff; border-radius: 16px; padding: 32px 24px; display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 24px; border: 1px solid var(--border-color); box-shadow: 0 10px 30px rgba(7, 26, 58, 0.03); }
        .summary-icon { width: 72px; height: 72px; background: #f8fafc; border-radius: 50%; padding: 12px; object-fit: contain; border: 1px solid #e2e8f0; margin-bottom: 16px; }
        .summary-title { font-size: 1.15rem; font-weight: 700; color: var(--bryt-navy); margin-bottom: 6px; }
        .summary-price { font-size: 1.6rem; font-weight: 800; color: var(--bryt-primary); }
        
        .details-list { background: #ffffff; padding: 8px 24px; border-radius: 16px; border: 1px solid var(--border-color); box-shadow: 0 4px 15px rgba(0,0,0,0.02); margin-bottom: 24px; }
        .detail-item { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px dashed #e2e8f0; }
        .detail-item:last-child { border-bottom: none; }
        .detail-label { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; }
        .detail-value { font-size: 0.9rem; font-weight: 700; color: var(--bryt-navy); text-align: right; }
        
        .status-pill { padding: 6px 14px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .status-completed { background: var(--success-bg); color: var(--success-text); border: 1px solid #bbf7d0; }
        .status-processing { background: var(--pending-bg); color: var(--pending-text); border: 1px solid #fef08a; }
        .status-failed { background: var(--failed-bg); color: var(--failed-text); border: 1px solid #fecaca; }
        
        .action-grid { display: flex; flex-direction: column; gap: 12px; }
        .btn-download { background: var(--bryt-primary); color: #ffffff; border: none; padding: 16px; border-radius: 12px; font-weight: 700; width: 100%; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.2s; }
        .btn-download:hover { background: #0369a1; }
        .btn-download:disabled { background: #cbd5e1; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="header-bar">
        <a href="orders.html" id="smart-back-btn" style="text-decoration:none; color:var(--text-muted); font-size:0.85rem; font-weight:700; display:inline-flex; align-items:center; gap:6px; transition: color 0.2s;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back
        </a>
        <h2 style="margin: 0; font-size: 1.15rem; font-weight: 800; color: var(--bryt-navy);">Order Summary</h2>
    </div>

    <main class="page-container">
        
        <div class="summary-card">
            <img src="../../assets/img/waec-logo.png" id="sum-icon" class="summary-icon" onerror="this.src='../../assets/img/brytpay-logo.png'">
            <div class="summary-title" id="sum-title">---</div>
            <div class="summary-price" id="sum-price">₦0.00</div>
        </div>

        <div class="details-list">
            <div class="detail-item">
                <div class="detail-label">Order Reference</div>
                <div class="detail-value" id="sum-ref" style="font-family: monospace;">---</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">Payment Method</div>
                <div class="detail-value">BRYT Wallet</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">Amount Paid</div>
                <div class="detail-value" id="sum-amount">₦0.00</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">Transaction Date</div>
                <div class="detail-value" id="sum-date">---</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">Processing Status</div>
                <div><span id="sum-status" class="status-pill status-processing">Pending</span></div>
            </div>
        </div>

        <div class="action-grid">
            <button class="btn-download" id="btn-download-doc" disabled>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                Document Pending
            </button>
        </div>
    </main>

    <nav class="mobile-nav no-print">
        <a href="/dashboard/" class="nav-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Home</span></a>
        <a href="/dashboard/services/" class="nav-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg><span>Services</span></a>
        <a href="/dashboard/fund/" class="nav-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg><span>Wallet</span></a>
        <a href="/dashboard/orders/" class="nav-item active"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg><span>My Orders</span></a>
        <a href="/dashboard/account/" class="nav-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>Account</span></a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/supabase-client.js"></script>
    <script src="../../assets/js/cert-order-details.js"></script>
</body>
</html>
