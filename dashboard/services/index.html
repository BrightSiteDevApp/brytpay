<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Services — BRYT Pay</title>
    
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#1D5ED0">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../../assets/css/main.css">

    <style>
        .services-header {
            margin-bottom: 24px;
        }
        .services-header h1 {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--bryt-navy);
            margin: 0 0 4px 0;
        }
        .services-header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 0;
        }

        .services-full-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 32px;
        }
        @media (max-width: 480px) {
            .services-full-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }
        }

        .service-full-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 18px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            text-decoration: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }
        .service-full-card:hover {
            border-color: var(--bryt-primary);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(29, 94, 208, 0.08);
        }

        .service-full-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }

        .service-full-title {
            font-size: 0.78rem;
            font-weight: 800;
            color: var(--bryt-navy);
            line-height: 1.3;
        }

        .badge-soon {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #f1f5f9;
            color: #64748b;
            font-size: 0.6rem;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <main class="app-container" style="max-width: 520px; padding-bottom: 20px;">
        <header class="services-header">
            <a href="/dashboard/" style="text-decoration:none; color:var(--text-muted); font-size:0.85rem; font-weight:700; display:inline-flex; align-items:center; gap:6px; margin-bottom: 12px;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Dashboard
            </a>
            <h1>All Services</h1>
            <p>Select any service to begin</p>
        </header>

        <section class="services-full-grid">
            <!-- 1. Airtime -->
            <a href="/dashboard/airtime/" class="service-full-card">
                <div class="service-full-icon" style="background: #F0F6FF; color: var(--bryt-primary);">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
                </div>
                <span class="service-full-title">Airtime</span>
            </a>

            <!-- 2. Data -->
            <a href="/dashboard/data/" class="service-full-card">
                <div class="service-full-icon" style="background: #F0F6FF; color: var(--bryt-primary);">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
                </div>
                <span class="service-full-title">Data Bundles</span>
            </a>

            <!-- 3. JAMB Services -->
            <a href="/dashboard/jamb/" class="service-full-card">
                <div class="service-full-icon" style="background: #F0F6FF; color: var(--bryt-primary);">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                </div>
                <span class="service-full-title">JAMB Services</span>
            </a>

            <!-- 4. NIN Services -->
            <a href="/dashboard/nin/" class="service-full-card">
                <div class="service-full-icon" style="background: #F0F6FF; color: var(--bryt-primary);">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                </div>
                <span class="service-full-title">NIN Services</span>
            </a>

            <!-- 5. Education PINs -->
            <a href="/dashboard/education/" class="service-full-card">
                <div class="service-full-icon" style="background: #F0F6FF; color: var(--bryt-primary);">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                </div>
                <span class="service-full-title">Education PINs</span>
            </a>

            <!-- 6. Cable TV -->
            <a href="/dashboard/tv/" class="service-full-card">
                <div class="service-full-icon" style="background: #F0F6FF; color: var(--bryt-primary);">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect><polyline points="17 2 12 7 7 2"></polyline></svg>
                </div>
                <span class="service-full-title">Cable TV</span>
            </a>

            <!-- 7. Exam Certifications -->
            <a href="/dashboard/exam-certs/" class="service-full-card">
                <div class="service-full-icon" style="background: #F0F6FF; color: var(--bryt-primary);">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="7"></circle><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline></svg>
                </div>
                <span class="service-full-title">Exam Certifications</span>
            </a>

            <!-- 8. Electricity (Coming Soon) -->
            <div class="service-full-card" style="opacity: 0.6; cursor: not-allowed;">
                <span class="badge-soon">Soon</span>
                <div class="service-full-icon" style="background: #f8fafc; color: #94a3b8;">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg>
                </div>
                <span class="service-full-title">Electricity</span>
            </div>
        </section>
    </main>

    <!-- 5-Tab Navigation -->
    <nav class="mobile-nav no-print">
        <a href="/dashboard/" class="nav-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Home</span></a>
        <a href="/dashboard/services/" class="nav-item active"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg><span>Services</span></a>
        <a href="/dashboard/fund/" class="nav-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg><span>Wallet</span></a>
        <a href="/dashboard/orders/" class="nav-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg><span>My Orders</span></a>
        <a href="/dashboard/account/" class="nav-item"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>Account</span></a>
    </nav>

</body>
</html>
