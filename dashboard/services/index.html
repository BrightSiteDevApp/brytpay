<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>All Services — BRYT Pay</title>
    
    <!-- Anti-Flash Dark Mode Script -->
    <script>
        if (localStorage.getItem('bryt_theme') === 'dark') {
            document.documentElement.classList.add('dark-theme');
        }
    </script>

    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../../assets/css/main.css">

    <style>
        :root {
            --bryt-primary: #1D5ED0;
            --bryt-navy: #0B1220;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #0B1220;
            --border-light: #f1f5f9;
        }

        /* FIX: Added Dark Theme Variables to mute the borders */
        html.dark-theme {
            --bryt-navy: #ffffff;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --border-light: #334155;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 80px !important;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Topbar Header */
        .app-topbar { 
            display: flex; align-items: center; gap: 16px; padding: 16px 20px; 
            background: var(--card-bg); position: sticky; top: 0; z-index: 100; 
            border-bottom: 1px solid var(--border-light); transition: background 0.3s, border 0.3s; 
        }
        .smart-back { 
            color: var(--text-main); display: flex; align-items: center; 
            text-decoration: none; padding: 4px; margin-left: -4px;
        }
        .page-title { font-size: 1.15rem; font-weight: 800; color: var(--text-main); margin: 0; }

        .main-content { padding: 24px 20px; }

        /* Small 4-Grid Layout (Matches Dashboard exactly) */
        .utility-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px 10px; }
        .utility-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; gap: 8px; position: relative; }
        .utility-icon { 
            width: 52px; height: 52px; background: var(--card-bg); border-radius: 14px; 
            display: flex; align-items: center; justify-content: center; color: var(--bryt-primary); 
            box-shadow: 0 4px 10px rgba(0,0,0,0.03); border: 1px solid var(--border-light); 
            transition: background 0.3s, border 0.3s; 
        }
        .utility-icon svg { width: 24px; height: 24px; }
        .utility-label { font-size: 0.7rem; font-weight: 700; color: var(--text-main); text-align: center; }

        /* Future Feature Badge */
        .badge-soon { 
            position: absolute; top: -8px; right: -4px; background: #e2e8f0; color: #64748b; 
            font-size: 0.55rem; font-weight: 800; padding: 2px 6px; border-radius: 6px; 
            text-transform: uppercase; z-index: 2; border: 2px solid var(--bg-color); 
        }
        html.dark-theme .badge-soon { background: #334155; color: #94a3b8; border-color: var(--bg-color); }

        /* Native Bottom Nav */
        .mobile-nav { position: fixed !important; bottom: 0 !important; left: 0 !important; right: 0 !important; background: var(--card-bg) !important; z-index: 9999 !important; border-top: 1px solid var(--border-light) !important; display: flex !important; justify-content: space-around !important; padding: 12px 0 10px 0 !important; transition: background 0.3s, border 0.3s; }
        .mobile-nav .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #94a3b8; text-decoration: none; transition: color 0.2s; }
        .mobile-nav .nav-item span { font-size: 0.65rem; font-weight: 800; }
        .mobile-nav .nav-item svg { width: 22px; height: 22px; }
        .mobile-nav .nav-item.active { color: var(--bryt-primary); }
    </style>
</head>
<body>

    <header class="app-topbar">
        <a href="/dashboard/index.html" class="smart-back">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </a>
        <h1 class="page-title">All Services</h1>
    </header>

    <main class="main-content">

                <span class="utility-label">JAMB</span>

            <a href="/dashboard/nin/index.html" class="utility-item">

                <div class="utility-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></div>

            </a>
            
            <!-- Inactive Module -->
            <div class="utility-item" style="opacity: 0.5; cursor: not-allowed;">
                <span class="badge-soon">Soon</span>
                <div class="utility-icon" style="color: #94a3b8; background: transparent;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg></div>
                <span class="utility-label">Electricity</span>
            </div>
        </section>
    </main>

    <!-- Native Bottom Nav -->
    <nav class="mobile-nav no-print">

</body>
