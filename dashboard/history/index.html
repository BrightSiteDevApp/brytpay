<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Transaction History — BRYT Pay</title>

    <!-- STRICT APP PRIVACY DIRECTIVE: Do not index or crawl -->
    <meta name="robots" content="noindex, nofollow">
    
    <!-- Branding -->
    <meta name="theme-color" content="#1D5ED0">
     <link rel="icon" href="/favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="../../assets/css/main.css">
    <style>
        /* History-Specific Filter Tabs */
        .filter-tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
        .filter-tabs::-webkit-scrollbar { display: none; }
        .filter-btn { background: var(--surface-white, #ffffff); border: 1px solid var(--border-color, #e2e8f0); color: var(--text-muted, #64748b); padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all 0.2s; font-family: 'Sora', sans-serif; }
        .filter-btn:hover { border-color: #94a3b8; }
        .filter-btn.active { background: #0B1220; color: #ffffff; border-color: #0B1220; }

        /* Responsive Transaction Row Styles */
        .tx-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid #f1f5f9; gap: 10px; transition: background 0.15s ease; cursor: pointer; }
        .tx-row:hover { background: #f8fafc; }
        .tx-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
        .tx-brand { width: 36px; height: 36px; border-radius: 50%; background: #ffffff; border: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; padding: 4px; }
        .tx-brand img { width: 100%; height: 100%; object-fit: contain; }
        .tx-info { min-width: 0; flex: 1; }
        .tx-title { font-weight: 700; font-size: 0.82rem; color: #0B1220; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
        .tx-date { font-size: 0.68rem; color: #64748b; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
        .tx-right { text-align: right; flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
        .tx-amount { font-weight: 800; font-size: 0.9rem; letter-spacing: -0.3px; white-space: nowrap; }
        .tx-status { display: inline-block; font-size: 0.65rem; font-weight: 700; padding: 2px 8px; border-radius: 12px; text-transform: capitalize; letter-spacing: 0.3px; }
        
        /* Explicit Badge Colors */
        .status-successful { background: #dcfce7 !important; color: #15803d !important; border: 1px solid #bbf7d0; }
        .status-pending { background: #fef9c3 !important; color: #a16207 !important; border: 1px solid #fef08a; }
        .status-failed { background: #fee2e2 !important; color: #b91c1c !important; border: 1px solid #fecaca; }
    </style>
</head>
<body>

    <main class="app-container" style="max-width: 540px;">
        
        <a href="/dashboard/" style="text-decoration:none; color:var(--text-muted); font-size:0.85rem; font-weight:600; display:inline-flex; align-items:center; gap:6px; margin-bottom: 20px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Dashboard
        </a>
        
        <header style="margin-bottom: 20px;">
            <h1 style="font-size: 1.35rem; font-weight: 800; color: #0B1220; margin-bottom: 4px;">Transaction History</h1>
            <p style="font-size: 0.8rem; color: #64748b; margin: 0;">View and filter all your wallet top-ups and payments.</p>
        </header>

        <!-- Filter Tabs -->
        <div class="filter-tabs">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="successful">Successful</button>
            <button class="filter-btn" data-filter="pending">Pending</button>
            <button class="filter-btn" data-filter="failed">Failed</button>
        </div>

        <!-- Ledger Card -->
        <section class="tx-card" style="background: white; border-radius: 16px; border: 1px solid #e2e8f0; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.03);">
            <div id="history-container">
                <div class="empty-state" style="padding: 2.5rem; text-align: center; color: #94a3b8; font-size: 0.85rem;">Loading transactions...</div>
            </div>
        </section>

    </main>

    <!-- Mobile Bottom Navigation -->
    <nav class="mobile-nav">
        <a href="/dashboard/" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
            <span>Home</span>
        </a>
        <a href="/dashboard/history/" class="nav-item active">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span>History</span>
        </a>
        <a href="/dashboard/fund/" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
            <span>Wallet</span>
        </a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/supabase-client.js"></script>
    <script src="../../assets/js/history.js"></script>
</body>
</html>
