<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fund Wallet — BRYT Pay</title>
    
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#1D5ED0">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="../../assets/css/main.css">
    
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <script src="https://checkout.flutterwave.com/v3.js"></script>

    <style>
        .form-card { padding: 24px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid #e2e8f0; background: #ffffff; }
        
        .input-currency-wrapper { position: relative; display: flex; align-items: center; margin-top: 8px; }
        .input-currency-prefix { position: absolute; left: 16px; font-weight: 700; color: #475569; font-size: 1.1rem; }
        .input-currency-wrapper input { width: 100%; padding: 16px 16px 16px 40px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 1.1rem; font-weight: 700; color: #0f172a; transition: 0.2s; outline: none; }
        .input-currency-wrapper input:focus { border-color: #1D5ED0; box-shadow: 0 0 0 3px rgba(29, 94, 208, 0.1); }

        .preset-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
        .preset-chip { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px 8px; text-align: center; font-size: 0.85rem; font-weight: 700; color: #475569; cursor: pointer; transition: 0.2s; }
        .preset-chip:hover { background: #F0F6FF; border-color: #1D5ED0; color: #1D5ED0; }

        .gateway-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; margin-bottom: 24px; }
        .gateway-card { border: 2px solid #e2e8f0; border-radius: 12px; padding: 16px 12px; text-align: center; cursor: pointer; transition: 0.2s; background: #f8fafc; color: #64748b; font-weight: 600; font-size: 0.75rem; display: flex; flex-direction: column; align-items: center; gap: 8px; position: relative; }
        .gateway-card img { height: 20px; width: auto; object-fit: contain; filter: grayscale(100%) opacity(0.6); transition: 0.2s; }
        .gateway-card:hover { border-color: #cbd5e1; }
        .gateway-card.active { border-color: #1D5ED0; background: #F0F6FF; color: #1D5ED0; }
        .gateway-card.active img { filter: grayscale(0%) opacity(1); }
        .gateway-card.active::after { content: '✓'; position: absolute; top: -8px; right: -8px; background: #1D5ED0; color: white; width: 20px; height: 20px; border-radius: 50%; font-size: 11px; font-weight: bold; display: flex; justify-content: center; align-items: center; border: 2px solid white; }

        .summary-card { background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 12px; padding: 16px; margin-top: 24px; text-align: center; }
        .summary-row.total { font-size: 1rem; font-weight: 800; color: #0B1220; display: flex; justify-content: space-between; align-items: center; }
        
        .success-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.95); z-index: 10000; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .success-overlay.active { opacity: 1; pointer-events: all; }
        .check-circle { width: 80px; height: 80px; border-radius: 50%; background: #10b981; color: white; display: flex; justify-content: center; align-items: center; margin-bottom: 20px; transform: scale(0); transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        .success-overlay.active .check-circle { transform: scale(1); }
        .check-circle svg { width: 40px; height: 40px; }
        .status-text { font-size: 1.1rem; color: #0B1220; font-weight: 800; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="success-overlay" id="success-overlay">
        <div class="check-circle" id="check-icon" style="background: #1D5ED0;">
            <svg id="loading-svg" style="animation: spin 1s linear infinite;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
            <svg id="success-svg" style="display: none;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg>
        </div>
        <div class="status-text" id="overlay-status">Verifying secure payment...</div>
    </div>
    <style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>

    <main class="app-container" style="max-width: 520px; padding-bottom: 100px;">
        <header style="margin-bottom: 24px; display: flex; justify-content: space-between; align-items: flex-start;">
            <div>
                <a href="/dashboard/" style="text-decoration:none; color:var(--text-muted); font-size:0.85rem; font-weight:700; display:inline-flex; align-items:center; gap:6px; margin-bottom: 12px;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    Back to Dashboard
                </a>
                <h1 style="font-size: 1.4rem; font-weight: 800; color: var(--bryt-navy); margin: 0 0 4px 0;">Fund Wallet</h1>
                <p style="font-size: 0.85rem; color: var(--text-muted); margin: 0;">Add money to your account.</p>
            </div>
            <div style="text-align: right; background: #F0F6FF; padding: 10px 14px; border-radius: 12px; border: 1px solid #dbeafe;">
                <div style="font-size: 0.7rem; color: #3b82f6; text-transform: uppercase; font-weight: 800; margin-bottom: 2px;">Balance</div>
                <strong id="user-balance" style="color: #1D5ED0; font-size: 1rem; font-weight: 800;">₦0.00</strong>
            </div>
        </header>

        <div class="form-card">
            <form id="fund-form">
                
                <!-- Standard, User-Friendly Input -->
                <div class="form-group" style="margin-bottom: 0;">
                    <label class="form-label" style="font-size: 0.85rem; font-weight: 700; color: #475569;">Amount to Fund <span style="font-size: 0.75rem; font-weight: 500; color: #94a3b8;">(Min ₦100)</span></label>
                    <div class="input-currency-wrapper">
                        <span class="input-currency-prefix">₦</span>
                        <input type="number" id="amount" min="100" max="500000" placeholder="0.00" required>
                    </div>
                </div>
                
                <div class="preset-grid">
                    <div class="preset-chip" data-amount="1000">₦1,000</div>
                    <div class="preset-chip" data-amount="2000">₦2,000</div>
                    <div class="preset-chip" data-amount="3000">₦3,000</div>
                    <div class="preset-chip" data-amount="5000">₦5,000</div>
                    <div class="preset-chip" data-amount="10000">₦10,000</div>
                    <div class="preset-chip" data-amount="20000">₦20,000</div>
                </div>

                <div style="margin-top: 24px;">
                    <label style="font-size: 0.85rem; font-weight: 700; color: #475569; display: block;">Select Payment Method</label>
                    <div class="gateway-grid">
                        <div class="gateway-card active" data-gateway="PAYSTACK">
                            <img src="../../assets/img/paystack-logo.png" alt="Paystack">
                            <span>Card, Bank, USSD</span>
                        </div>
                        <div class="gateway-card" data-gateway="FLUTTERWAVE">
                            <img src="../../assets/img/flutterwave-logo.png" alt="Flutterwave">
                            <span>Card, Transfer</span>
                        </div>
                    </div>
                </div>

                <div class="summary-card">
                    <div class="summary-row total">
                        <span style="color: #64748b; font-size: 0.95rem;">You will fund:</span> 
                        <span id="summary-total" style="color: #10b981; font-size: 1.15rem;">₦0.00</span>
                    </div>
                    <div style="font-size: 0.75rem; color: #94a3b8; margin-top: 14px; text-align: center; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 500;">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                        Gateway processing charges may apply at checkout.
                    </div>
                </div>

                <button type="submit" id="pay-btn" class="btn-primary" style="margin-top: 24px; padding: 18px; font-size: 1.05rem; border-radius: 12px; background: #1D5ED0; width: 100%; display: flex; justify-content: center; align-items: center; gap: 8px;">
                    Pay ₦0.00
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
                </button>
            </form>
        </div>
    </main>

    <nav class="mobile-nav">
        <a href="/dashboard/" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Home</span>
        </a>
        <a href="/dashboard/history/" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span>History</span>
        </a>
        <a href="/dashboard/fund/" class="nav-item active">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg><span>Wallet</span>
        </a>
        <a href="/dashboard/account/" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>Account</span>
        </a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/supabase-client.js"></script>
    <script src="../../assets/js/fund.js"></script>
</body>
</html>
