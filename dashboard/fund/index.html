<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fund Wallet — BRYT Pay</title>
    
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#1D5ED0">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="../../assets/css/main.css">
    
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <script src="https://checkout.flutterwave.com/v3.js"></script>

    <style>
        /* 🚀 Sleek, Open Form Card */
        .form-card { padding: 32px 24px; border-radius: 24px; box-shadow: 0 4px 25px rgba(0,0,0,0.03); border: 1px solid #e2e8f0; background: #ffffff; margin-bottom: 24px; }
        
        .input-currency-wrapper { position: relative; display: flex; align-items: center; margin-top: 12px; }
        .input-currency-prefix { position: absolute; left: 20px; font-weight: 800; color: var(--bryt-navy); font-size: 1.25rem; }
        .input-currency-wrapper input { width: 100%; padding: 20px 16px 20px 52px; border: 2px solid #e2e8f0; border-radius: 16px; font-size: 1.25rem; font-weight: 800; color: #0f172a; transition: 0.2s; outline: none; background: #f8fafc; }
        .input-currency-wrapper input:focus { border-color: #1D5ED0; background: #ffffff; box-shadow: 0 0 0 4px rgba(29, 94, 208, 0.08); }

        .preset-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 20px; }
        .preset-chip { background: #ffffff; border: 1px solid #cbd5e1; border-radius: 12px; padding: 14px 4px; text-align: center; font-size: 0.85rem; font-weight: 800; color: #334155; cursor: pointer; transition: all 0.2s; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
        .preset-chip:hover { background: #F0F6FF; border-color: #1D5ED0; color: #1D5ED0; transform: translateY(-2px); box-shadow: 0 6px 12px rgba(29, 94, 208, 0.08); }

        /* 🚀 Unboxed, Wide Gateway Cards */
        .gateway-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
        .gateway-card { border: 2px solid #e2e8f0; border-radius: 16px; padding: 20px 12px; text-align: center; cursor: pointer; transition: all 0.2s; background: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; position: relative; }
        .gateway-card img { height: 24px; width: auto; object-fit: contain; }
        .gateway-label { font-size: 0.75rem; color: #64748b; font-weight: 700; white-space: nowrap; }
        
        .gateway-card:hover { border-color: #cbd5e1; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0,0,0,0.04); }
        
        .gateway-card.active { border-color: #1D5ED0; background: #F0F6FF; box-shadow: 0 6px 15px rgba(29, 94, 208, 0.1); transform: translateY(-2px); }
        .gateway-card.active .gateway-label { color: #1D5ED0; }
        .gateway-card.active::after { content: '✓'; position: absolute; top: -10px; right: -10px; background: #1D5ED0; color: white; width: 24px; height: 24px; border-radius: 50%; font-size: 12px; font-weight: bold; display: flex; justify-content: center; align-items: center; border: 3px solid white; box-shadow: 0 2px 6px rgba(29, 94, 208, 0.2); }

        /* 🚀 Clean Summary Section */
        .summary-block { margin-top: 32px; padding-top: 24px; border-top: 1px solid #e2e8f0; }
        
        .success-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.95); z-index: 10000; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .success-overlay.active { opacity: 1; pointer-events: all; }
        .check-circle { width: 80px; height: 80px; border-radius: 50%; background: #10b981; color: white; display: flex; justify-content: center; align-items: center; margin-bottom: 20px; transform: scale(0); transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        .success-overlay.active .check-circle { transform: scale(1); }
        .check-circle svg { width: 40px; height: 40px; }
        .status-text { font-size: 1.1rem; color: #0B1220; font-weight: 800; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="success-overlay" id="success-overlay">
        <div class="check-circle" id="check-icon" style="background: #1D5ED0;">
            <svg id="loading-svg" style="animation: spin 1s linear infinite;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
            <svg id="success-svg" style="display: none;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg>
        </div>
        <div class="status-text" id="overlay-status">Verifying secure payment...</div>
    </div>
    <style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>

    <main class="app-container" style="max-width: 520px; padding-bottom: 10px;">
        
        <header style="margin-bottom: 24px; display: flex; justify-content: space-between; align-items: flex-start;">
            <div>
                <a href="/dashboard/" style="text-decoration:none; color:var(--text-muted); font-size:0.85rem; font-weight:700; display:inline-flex; align-items:center; gap:6px; margin-bottom: 12px; transition: color 0.2s;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    Dashboard
                </a>
                
                <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--bryt-navy); margin: 0 0 4px 0;">Fund Wallet</h1>
                <p style="font-size: 0.85rem; color: var(--text-muted); margin: 0;">Add money to your account.</p>
            </div>
            
            <div style="display: flex; align-items: center; gap: 8px; background: var(--bryt-primary); padding: 8px 14px; border-radius: 20px; box-shadow: 0 6px 15px rgba(29, 94, 208, 0.2); margin-top: 4px;">
                <div style="background: rgba(255,255,255,0.2); border-radius: 50%; padding: 4px; display: flex;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
                </div>
                <div style="display: flex; flex-direction: column; align-items: flex-end;">
                    <span style="font-size: 0.6rem; color: #e0f2fe; text-transform: uppercase; font-weight: 800; letter-spacing: 0.5px; line-height: 1;">Balance</span>
                    <strong id="user-balance" style="color: #ffffff; font-size: 0.95rem; font-weight: 800; line-height: 1.2;">₦0.00</strong>
                </div>
            </div>
        </header>

        <div class="form-card">
            <form id="fund-form">
                
                <div class="form-group" style="margin-bottom: 0;">
                    <label class="form-label" style="font-size: 0.85rem; font-weight: 800; color: var(--bryt-navy); text-transform: uppercase; letter-spacing: 0.5px;">Amount to Fund</label>
                    <div class="input-currency-wrapper">
                        <span class="input-currency-prefix">₦</span>
                        <input type="number" id="amount" min="100" max="500000" placeholder="0.00" required>
                    </div>
                </div>
                
                <div class="preset-grid">
                    <div class="preset-chip" data-amount="1000">₦1,000</div>
                    <div class="preset-chip" data-amount="2000">₦2,000</div>
                    <div class="preset-chip" data-amount="3000">₦3,000</div>
                    <div class="preset-chip" data-amount="5000">₦5,000</div>
                    <div class="preset-chip" data-amount="10000">₦10,000</div>
                    <div class="preset-chip" data-amount="20000">₦20,000</div>
                </div>

                <div style="margin-top: 36px;">
                    <label style="font-size: 0.85rem; font-weight: 800; color: var(--bryt-navy); text-transform: uppercase; letter-spacing: 0.5px; display: block;">Select Payment Method</label>
                    
                    <div class="gateway-grid">
                        <div class="gateway-card active" data-gateway="PAYSTACK">
                            <img src="../../assets/img/paystack-logo.png" alt="Paystack">
                            <span class="gateway-label">Card, Bank, USSD</span>
                        </div>
                        <div class="gateway-card" data-gateway="FLUTTERWAVE">
                            <img src="../../assets/img/flutterwave-logo.png" alt="Flutterwave">
                            <span class="gateway-label">Card, Transfer</span>
                        </div>
                    </div>
                </div>

                <div class="summary-block">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <span style="color: #64748b; font-size: 0.95rem; font-weight: 600;">You will fund:</span> 
                        <span id="summary-total" style="color: #10b981; font-size: 1.4rem; font-weight: 800;">₦0.00</span>
                    </div>
                    <div style="font-size: 0.75rem; color: #94a3b8; display: flex; align-items: center; gap: 6px; font-weight: 500;">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                        Gateway processing charges may apply.
                    </div>
                </div>

                <button type="submit" id="pay-btn" class="btn-primary" style="margin-top: 24px; padding: 20px; font-size: 1.1rem; border-radius: 16px; background: #1D5ED0; width: 100%; display: flex; justify-content: center; align-items: center; gap: 8px; font-weight: 800; box-shadow: 0 8px 20px rgba(29, 94, 208, 0.25);">
                    Pay ₦0.00
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
                </button>
            </form>
        </div>
    </main>

   <nav class="mobile-nav no-print">
    <a href="/dashboard/" class="nav-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Home</span></a>
    <a href="/dashboard/services/" class="nav-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg><span>Services</span></a>
    <a href="/dashboard/fund/" class="nav-item active"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg><span>Wallet</span></a>
    <a href="/dashboard/orders/" class="nav-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg><span>My Orders</span></a>
    <a href="/dashboard/account/" class="nav-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>Account</span></a>
</nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/supabase-client.js"></script>
    <script src="../../assets/js/fund.js"></script>
</body>
</html>
