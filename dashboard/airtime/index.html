<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchase Airtime — BRYT Pay</title>
    
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#1D5ED0">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="../../assets/css/main.css">
    <style>
        .form-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 24px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        }

        /* 🚀 Sleek Network Selector (Added mobile wrapping) */
        .provider-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 10px;
            margin-bottom: 24px;
        }
        @media (max-width: 400px) {
            .provider-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        .provider-btn {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            padding: 12px 6px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .provider-btn:hover {
            border-color: #cbd5e1;
            background: #ffffff;
        }
        .provider-btn.active {
            border-color: var(--bryt-primary);
            background: #F0F6FF;
            box-shadow: 0 4px 14px rgba(29, 94, 208, 0.12);
            transform: translateY(-2px);
        }
        .provider-btn.active::after {
            content: '✓';
            position: absolute;
            top: -6px;
            right: -6px;
            background: var(--bryt-primary);
            color: #ffffff;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            font-size: 10px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #ffffff;
        }
        .provider-logo {
            width: 36px;
            height: 36px;
            margin-bottom: 6px;
            border-radius: 50%;
            object-fit: contain;
        }
        .provider-btn-label {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--bryt-navy);
        }

        /* 🚀 Input Field with Integrated Carrier Badge */
        .input-carrier-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            margin-top: 8px;
        }
        .input-carrier-wrapper input {
            width: 100%;
            padding: 14px 80px 14px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 600;
            color: #0f172a;
            outline: none;
            transition: all 0.2s;
            background: #f8fafc;
        }
        .input-carrier-wrapper input:focus {
            border-color: var(--bryt-primary);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(29, 94, 208, 0.1);
        }
        .carrier-badge {
            position: absolute;
            right: 12px;
            background: #e2e8f0;
            color: #475569;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: none;
            transition: all 0.2s;
        }
        .carrier-badge.active {
            display: inline-block;
            background: #dbeafe;
            color: var(--bryt-primary);
        }

        /* 🚀 Currency Input & Presets */
        .input-currency-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            margin-top: 8px;
        }
        .input-currency-prefix {
            position: absolute;
            left: 16px;
            font-weight: 800;
            color: var(--bryt-navy);
            font-size: 1.1rem;
        }
        .input-currency-wrapper input {
            width: 100%;
            padding: 14px 16px 14px 38px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #0f172a;
            outline: none;
            transition: all 0.2s;
            background: #f8fafc;
        }
        .input-currency-wrapper input:focus {
            border-color: var(--bryt-primary);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(29, 94, 208, 0.1);
        }

        .preset-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 12px;
        }
        .preset-chip {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 10px 4px;
            text-align: center;
            font-size: 0.8rem;
            font-weight: 700;
            color: #475569;
            cursor: pointer;
            transition: all 0.2s;
        }
        .preset-chip:hover, .preset-chip.active {
            border-color: var(--bryt-primary);
            color: var(--bryt-primary);
            background: #F0F6FF;
        }

        /* 🚀 Toast */
        .bryt-toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-150px);
            background: #ffffff;
            padding: 14px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 9999;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            min-width: 300px;
            border-left: 4px solid var(--bryt-primary);
        }
        .bryt-toast.show { transform: translateX(-50%) translateY(0); }
        .toast-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            flex-shrink: 0;
        }
        .toast-success .toast-icon { background: #16a34a; }
        .toast-success { border-left-color: #16a34a; }
        .toast-error .toast-icon { background: #dc2626; }
        .toast-error { border-left-color: #dc2626; }
        .toast-text { font-size: 0.85rem; font-weight: 600; color: var(--bryt-navy); }
    </style>
</head>
<body>

    <div id="bryt-toast" class="bryt-toast">
        <div id="toast-icon-wrap" class="toast-icon"></div>
        <div id="toast-text" class="toast-text">Message goes here</div>
    </div>

    <main class="app-container" style="max-width: 520px; padding-bottom: 90px;">
        <!-- 🚀 THE FIX: Header layout changed to align items center and handle text overflow -->
        <header style="margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; gap: 8px;">
            <div style="min-width: 0; flex: 1;">
                <a href="/dashboard/" style="text-decoration:none; color:var(--text-muted); font-size:0.85rem; font-weight:700; display:inline-flex; align-items:center; gap:6px; margin-bottom: 12px; transition: color 0.2s;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    Back
                </a>
                <h1 style="font-size: 1.3rem; font-weight: 800; color: var(--bryt-navy); margin: 0 0 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Purchase Airtime</h1>
                <p style="font-size: 0.8rem; color: var(--text-muted); margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Instant top-up to any network</p>
            </div>
            <div style="text-align: right; background: #F0F6FF; padding: 10px 14px; border-radius: 12px; border: 1px solid #dbeafe; flex-shrink: 0;">
                <div style="font-size: 0.7rem; color: #3b82f6; text-transform: uppercase; font-weight: 800; margin-bottom: 2px;">Balance</div>
                <strong id="user-balance" style="color: #1D5ED0; font-size: 0.95rem; font-weight: 800;">₦0.00</strong>
            </div>
        </header>

        <div class="form-card">
            <form id="airtime-form">
                
                <!-- Network Selection -->
                <div class="form-group" style="margin-bottom: 20px;">
                    <label style="font-size: 0.8rem; font-weight: 800; color: #475569; text-transform: uppercase; letter-spacing: 0.5px;">1. Select Network</label>
                    <div class="provider-grid" id="provider-container">
                        <div class="provider-btn network-btn active" data-network="mtn" data-logo="mtn-logo.png">
                            <img src="../../assets/img/mtn-logo.png" class="provider-logo" alt="MTN">
                            <span class="provider-btn-label">MTN</span>
                        </div>
                        <div class="provider-btn network-btn" data-network="airtel" data-logo="airtel-logo.png">
                            <img src="../../assets/img/airtel-logo.png" class="provider-logo" alt="Airtel">
                            <span class="provider-btn-label">Airtel</span>
                        </div>
                        <div class="provider-btn network-btn" data-network="glo" data-logo="glo-logo.png">
                            <img src="../../assets/img/glo-logo.png" class="provider-logo" alt="Glo">
                            <span class="provider-btn-label">Glo</span>
                        </div>
                        <div class="provider-btn network-btn" data-network="9mobile" data-logo="9mob-logo.png">
                            <img src="../../assets/img/9mob-logo.png" class="provider-logo" alt="9mobile">
                            <span class="provider-btn-label">9mobile</span>
                        </div>
                    </div>
                </div>

                <!-- Phone Input with Carrier Auto-Indicator -->
                <div class="form-group" style="margin-bottom: 20px;">
                    <label class="form-label" for="phone" style="font-size: 0.8rem; font-weight: 800; color: #475569; text-transform: uppercase; letter-spacing: 0.5px;">2. Phone Number</label>
                    <div class="input-carrier-wrapper">
                        <input type="tel" id="phone" placeholder="0801 234 5678" maxlength="11" required>
                        <span id="carrier-indicator" class="carrier-badge">MTN</span>
                    </div>
                </div>

                <!-- Amount Input & Presets -->
                <div class="form-group" style="margin-bottom: 28px;">
                    <label class="form-label" for="amount" style="font-size: 0.8rem; font-weight: 800; color: #475569; text-transform: uppercase; letter-spacing: 0.5px;">3. Amount (₦)</label>
                    <div class="input-currency-wrapper">
                        <span class="input-currency-prefix">₦</span>
                        <input type="number" id="amount" min="100" max="50000" placeholder="0.00" required>
                    </div>
                    
                    <div class="preset-grid">
                        <div class="preset-chip" data-amt="100">₦100</div>
                        <div class="preset-chip" data-amt="200">₦200</div>
                        <div class="preset-chip" data-amt="500">₦500</div>
                        <div class="preset-chip" data-amt="1000">₦1,000</div>
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="btn-primary" style="padding: 16px; font-size: 1rem; border-radius: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px;">
                    Proceed
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </button>
            </form>
        </div>
    </main>

    <!-- Confirmation Modal -->
    <div id="confirm-modal" class="modal-overlay">
        <div class="modal-content" style="max-width: 400px; padding: 28px 24px; border-radius: 20px; text-align: center;">
            <img id="modal-network-logo" src="../../assets/img/mtn-logo.png" alt="Network" style="width: 58px; height: 58px; border-radius: 50%; margin: 0 auto 14px; object-fit: contain; background: #f8fafc; padding: 6px; border: 1.5px solid #e2e8f0;">
            
            <h3 class="modal-title" style="font-size: 1.25rem; margin-bottom: 4px;">Confirm Purchase</h3>
            <p class="modal-desc" style="font-size: 0.82rem; margin-bottom: 20px; color: var(--text-muted);">Review details before wallet deduction.</p>

            <div class="modal-breakdown" style="background: #f8fafc; border-radius: 14px; padding: 16px; text-align: left; margin-bottom: 24px; border: 1px solid #e2e8f0;">
                <div class="modal-row" style="margin-bottom: 10px; display: flex; justify-content: space-between;">
                    <span style="color: var(--text-muted); font-size: 0.85rem;">Network</span>
                    <strong id="modal-network" style="color: var(--bryt-navy); font-size: 0.9rem;">MTN Airtime</strong>
                </div>
                <div class="modal-row" style="margin-bottom: 12px; display: flex; justify-content: space-between;">
                    <span style="color: var(--text-muted); font-size: 0.85rem;">Recipient</span>
                    <strong id="modal-phone" style="color: var(--bryt-navy); font-size: 0.95rem; font-family: monospace;">---</strong>
                </div>
                <div class="modal-row" style="padding-top: 12px; border-top: 1px dashed #cbd5e1; display: flex; justify-content: space-between; align-items: center; margin-bottom: 0;">
                    <span style="color: var(--text-muted); font-size: 0.85rem;">Total Debit</span>
                    <strong id="modal-amount" style="color: #10b981; font-size: 1.25rem; font-weight: 800;">₦0.00</strong>
                </div>
            </div>

            <div class="modal-actions" style="display: flex; gap: 10px;">
                <button type="button" id="modal-cancel" class="btn-secondary" style="flex: 1; padding: 14px; font-weight: 700;">Cancel</button>
                <button type="button" id="modal-confirm" class="btn-primary" style="flex: 1.8; padding: 14px; font-weight: 800;">Pay Now</button>
            </div>
        </div>
    </div>

    <nav class="mobile-nav">
        <a href="/dashboard/" class="nav-item"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Home</span></a>
        <a href="/dashboard/history/" class="nav-item"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span>History</span></a>
        <a href="/dashboard/fund/" class="nav-item"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg><span>Wallet</span></a>
        <a href="/dashboard/account/" class="nav-item"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>Account</span></a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/supabase-client.js"></script>
    <script src="../../assets/js/airtime.js"></script>
</body>
</html>
