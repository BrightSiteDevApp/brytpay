<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account — BRYT Pay</title>
    
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#1D5ED0">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="../../assets/css/main.css">
    <style>
        .profile-card { text-align: center; padding: 24px 20px; margin-bottom: 20px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        .avatar-circle { width: 64px; height: 64px; background: #F0F6FF; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; color: var(--bryt-primary); border: 4px solid #ffffff; box-shadow: 0 8px 20px rgba(29, 94, 208, 0.1); }
        .info-text { color: var(--text-muted); font-size: 0.8rem; margin-bottom: 6px; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600; }
        
        .id-card { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px; background: #F0F6FF; border: 1px dashed #93c5fd; border-radius: 16px; margin-bottom: 24px; transition: all 0.2s; }
        .id-card:hover { border-color: var(--bryt-primary); background: #e0f2fe; }
        .id-label { font-size: 0.7rem; color: #3b82f6; text-transform: uppercase; font-weight: 800; margin-bottom: 4px; letter-spacing: 0.5px; }
        .id-value { font-size: 1.25rem; font-weight: 800; color: var(--bryt-navy); letter-spacing: 1px; font-family: monospace; }
        
        .copy-btn { display: inline-flex; align-items: center; gap: 6px; background: #ffffff; color: #1D5ED0; border: 1px solid #bfdbfe; padding: 6px 12px; border-radius: 10px; font-size: 0.75rem; font-weight: 800; cursor: pointer; transition: all 0.2s; text-transform: uppercase; }
        .copy-btn:hover { background: #1D5ED0; color: #ffffff; }
        
        #admin-portal-wrap { display: none; margin-bottom: 24px; }
        .admin-link-btn { display: flex; align-items: center; justify-content: center; gap: 10px; background: #0f172a; color: #ffffff; padding: 14px; border-radius: 16px; text-decoration: none; font-weight: 800; font-size: 0.85rem; box-shadow: 0 4px 15px rgba(15, 23, 42, 0.2); }

        .action-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
        .action-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; text-decoration: none; transition: 0.2s; }
        .action-row:hover { border-color: #cbd5e1; background: #f8fafc; transform: translateX(4px); }
        .action-row-left { display: flex; align-items: center; gap: 12px; }
        .action-icon-wrap { width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
        .action-icon-wrap svg { width: 16px; height: 16px; }
        .action-title { color: var(--bryt-navy); font-size: 0.85rem; font-weight: 700; }

        .logout-modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.6); backdrop-filter: blur(4px); z-index: 9999; display: none; align-items: center; justify-content: center; opacity: 0; transition: 0.3s; }
        .logout-modal-overlay.active { display: flex; opacity: 1; }
        .logout-modal { background: white; border-radius: 20px; padding: 24px; width: 90%; max-width: 320px; text-align: center; transform: translateY(20px); transition: 0.3s; }
        .logout-modal-overlay.active .logout-modal { transform: translateY(0); }
        .logout-icon { width: 48px; height: 48px; background: #fee2e2; color: #ef4444; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
        .logout-icon svg { width: 20px; height: 20px; }
    </style>
</head>
<body>
    <main class="app-container" style="max-width: 520px;">
        
        <header style="margin-bottom: 20px;">
            <a href="/dashboard/" id="smart-back-btn" style="text-decoration:none; color:var(--text-muted); font-size:0.85rem; font-weight:700; display:inline-flex; align-items:center; gap:6px; margin-bottom: 12px;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg> 
                Dashboard
            </a>
            <h1 style="font-size: 1.35rem; color: var(--bryt-navy); margin: 0; font-weight: 800;">My Account</h1>
        </header>

        <div class="profile-card">
            <div class="avatar-circle">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </div>
            <h2 id="acc-name" style="color: var(--bryt-navy); font-size: 1.2rem; margin-bottom: 8px; font-weight: 800;">Loading...</h2>
            
            <div class="info-text">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                <span id="acc-email">...</span>
            </div>
            <div class="info-text" style="margin-bottom: 16px;">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                <span id="acc-phone">...</span>
            </div>

            <span style="background: #10b981; color: #ffffff; padding: 4px 10px; border-radius: 20px; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;">Verified User</span>
        </div>

        <div class="id-card">
            <div>
                <div class="id-label">BRYT Account ID</div>
                <div class="id-value" id="acc-id">----</div>
            </div>
            <button class="copy-btn" id="copy-id-btn">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                Copy
            </button>
        </div>

        <div id="admin-portal-wrap">
            <a href="/admin/" class="admin-link-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                Open Admin Portal
            </a>
        </div>

        <div class="action-list">
            <a href="https://wa.me/2349153375488" target="_blank" class="action-row">
                <div class="action-row-left">
                    <div class="action-icon-wrap" style="background: #dcfce7; color: #16a34a;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                    </div>
                    <span class="action-title">Contact Support</span>
                </div>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </a>
            
            <a href="/doc/how-it-works/" class="action-row">
                <div class="action-row-left">
                    <div class="action-icon-wrap" style="background: #F0F6FF; color: var(--bryt-primary);">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                    </div>
                    <span class="action-title">How it Works</span>
                </div>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </a>
        </div>

        <button id="trigger-logout-btn" class="btn-primary" style="background: #ffffff; color: #ef4444; border: 1px solid #fecaca; width: 100%; font-size: 0.85rem; padding: 12px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; box-shadow: none;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            Sign Out
        </button>

        <div style="text-align: center; margin-top: 24px;">
            <p style="font-size: 0.65rem; color: #94a3b8; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;">
                &copy; <span id="current-year"></span> BRYT Technologies
            </p>
        </div>
    </main>

    <!-- Logout Confirmation Modal -->
    <div class="logout-modal-overlay" id="logout-modal">
        <div class="logout-modal">
            <div class="logout-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            </div>
            <h3 style="font-size: 1.15rem; font-weight: 800; color: #0f172a; margin-bottom: 8px;">Sign Out?</h3>
            <p style="font-size: 0.8rem; color: #64748b; margin-bottom: 20px; line-height: 1.4;">Are you sure you want to sign out of your account?</p>
            <div style="display: flex; gap: 8px;">
                <button id="cancel-logout" style="flex: 1; padding: 10px; border-radius: 10px; background: #f1f5f9; color: #475569; border: none; font-weight: 700; font-size: 0.85rem; cursor: pointer;">Cancel</button>
                <button id="confirm-logout" style="flex: 1; padding: 10px; border-radius: 10px; background: #ef4444; color: #ffffff; border: none; font-weight: 800; font-size: 0.85rem; cursor: pointer;">Sign Out</button>
            </div>
        </div>
    </div>

    <!-- Navigation included via main.css fix! -->
    <nav class="mobile-nav no-print">
        <a href="/dashboard/" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Home</span></a>
        <a href="/dashboard/services/" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg><span>Services</span></a>
        <a href="/dashboard/fund/" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg><span>Wallet</span></a>
        <a href="/dashboard/orders/" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg><span>My Orders</span></a>
        <a href="/dashboard/account/" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>Account</span></a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/supabase-client.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('current-year').textContent = new Date().getFullYear();
            const { data: { session } } = await window.db.auth.getSession();
            if (!session) { window.location.href = '/auth/login.html'; return; }
            document.getElementById('acc-email').textContent = session.user.email;
            
            const { data: profile } = await window.db.from('profiles').select('full_name, phone_number, account_id').eq('id', session.user.id).single();
            if (profile) {
                if(profile.full_name) document.getElementById('acc-name').textContent = profile.full_name;
                if(profile.phone_number) document.getElementById('acc-phone').textContent = profile.phone_number;
                if(profile.account_id) document.getElementById('acc-id').textContent = profile.account_id;
            }

            const { data: adminRecord } = await window.db.from('admins').select('email').eq('email', session.user.email).maybeSingle();
            if (adminRecord) document.getElementById('admin-portal-wrap').style.display = 'block';

            const copyBtn = document.getElementById('copy-id-btn');
            copyBtn.addEventListener('click', async () => {
                const accIdText = document.getElementById('acc-id').textContent;
                const showSuccess = () => {
                    const originalHTML = copyBtn.innerHTML;
                    copyBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg> Copied!`;
                    setTimeout(() => { copyBtn.innerHTML = originalHTML; }, 2000);
                };
                if (navigator.clipboard && window.isSecureContext) {
                    try { await navigator.clipboard.writeText(accIdText); showSuccess(); return; } catch (err) {}
                }
                const textArea = document.createElement("textarea"); textArea.value = accIdText; textArea.style.position = "fixed"; textArea.style.left = "-999999px"; document.body.appendChild(textArea); textArea.focus(); textArea.select();
                try { document.execCommand('copy'); showSuccess(); } catch (err) {} finally { textArea.remove(); }
            });

            const logoutModal = document.getElementById('logout-modal');
            document.getElementById('trigger-logout-btn').addEventListener('click', () => { logoutModal.classList.add('active'); });
            document.getElementById('cancel-logout').addEventListener('click', () => { logoutModal.classList.remove('active'); });
            document.getElementById('confirm-logout').addEventListener('click', async () => {
                document.getElementById('confirm-logout').textContent = "Signing out...";
                await window.db.auth.signOut();
                window.location.href = '/auth/login.html';
            });
        });
    </script>
</body>
</html>
