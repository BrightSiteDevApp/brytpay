<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard — BRYT Pay</title>
    
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../../assets/css/main.css">
    
    <script>
        if (localStorage.getItem('bryt_theme') === 'dark') {
            document.documentElement.classList.add('dark-theme');
        }
    </script>

    <style>
        :root {
            --bryt-primary: #1D5ED0;
            --bryt-navy: #0B1220;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #0B1220;
            --border-light: #f1f5f9;
        }

        html.dark-theme {
            --bryt-navy: #ffffff;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --border-light: #334155;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 80px !important;
            font-family: system-ui, -apple-system, sans-serif;
            overscroll-behavior-y: contain; 
            transition: background-color 0.3s, color 0.3s;
            margin: 0;
        }

        #ptr-indicator { position: fixed; top: 0; left: 0; right: 0; height: 60px; display: flex; align-items: center; justify-content: center; transform: translateY(-100%); transition: transform 0.2s; color: var(--bryt-primary); z-index: 9999; font-weight: 700; font-size: 0.85rem; gap: 8px; }
        #ptr-indicator.refreshing { transform: translateY(0); }
        .spinner { width: 20px; height: 20px; border: 3px solid #e2e8f0; border-top-color: var(--bryt-primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .app-topbar { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; background: var(--card-bg); position: sticky; top: 0; z-index: 100; transition: background 0.3s; border-bottom: 1px solid var(--border-light); }
        .profile-container { display: flex; align-items: center; gap: 12px; }
        .profile-avatar { width: 42px; height: 42px; background: #e2e8f0; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--bryt-primary); font-weight: 800; font-size: 1.2rem; text-decoration: none; cursor: pointer; }
        .greeting-time { font-size: 0.65rem; color: #64748b; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .greeting-name { font-size: 1.1rem; font-weight: 800; color: var(--text-main); line-height: 1.1; }
        
        .top-icons { display: flex; gap: 14px; align-items: center; }
        .icon-btn { color: var(--text-main); display: flex; align-items: center; justify-content: center; cursor: pointer; background: transparent; border: none; padding: 4px; }
        .notif-dot { position: absolute; top: 2px; right: 2px; width: 8px; height: 8px; background: #ef4444; border-radius: 50%; border: 2px solid var(--card-bg); display: none; }
        .notif-dot.active { display: block; }

        .main-content { padding: 16px 20px; }

        .wallet-card { background: linear-gradient(135deg, var(--bryt-primary) 0%, #113c88 100%); border-radius: 20px; padding: 24px 20px; color: #ffffff; box-shadow: 0 12px 24px rgba(29, 94, 208, 0.2); position: relative; overflow: hidden; margin-bottom: 24px; }
        .wallet-card::before { content: ''; position: absolute; top: -30px; right: -30px; width: 120px; height: 120px; background: rgba(255,255,255,0.1); border-radius: 50%; }
        .wallet-label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; position: relative; z-index: 1; }
        .wallet-label { font-size: 0.75rem; font-weight: 600; opacity: 0.9; text-transform: uppercase; letter-spacing: 0.5px; }
        .btn-visibility { background: rgba(255,255,255,0.2); border: none; color: #fff; padding: 4px 10px; border-radius: 12px; font-size: 0.7rem; font-weight: 700; cursor: pointer; backdrop-filter: blur(4px); }
        .wallet-balance-row { display: flex; align-items: baseline; position: relative; z-index: 1; }
        .wallet-currency { font-size: 1.2rem; font-weight: 700; opacity: 0.9; margin-right: 4px; }
        .wallet-amount { font-size: 2.2rem; font-weight: 800; letter-spacing: -0.5px; line-height: 1; }

        /* Action Buttons */
        .action-row { display: flex; gap: 12px; margin-bottom: 20px; }
        .slim-action-btn { flex: 1; border-radius: 12px; padding: 12px 16px; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; font-size: 0.85rem; text-decoration: none; transition: 0.2s; cursor: pointer;}
        .slim-action-btn svg { width: 18px; height: 18px; }
        .btn-send { background: #1e293b; color: #ffffff; border: 1px solid #334155; }
        .btn-add { background: #ffffff; color: #0B1220; border: 1px solid #cbd5e1; }
        html.dark-theme .btn-send { background: #1e293b; color: #f8fafc; border-color: #334155; }
        html.dark-theme .btn-add { background: var(--bryt-primary); color: #ffffff; border: none; }

        /* 🚀 SLIM HORIZONTAL VIRTUAL ACCOUNTS */
        .va-scroll-wrapper {
            display: flex; overflow-x: auto; gap: 10px; padding-bottom: 12px; margin-bottom: 20px;
            scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none;
        }
        .va-scroll-wrapper::-webkit-scrollbar { display: none; }
        .va-card {
            flex: 0 0 90%; max-width: 320px; scroll-snap-align: center;
            background: #f8fafc; border: 1px solid #e2e8f0; 
            border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between;
        }
        html.dark-theme .va-card { background: #1e293b; border-color: #334155; }
        .va-info-left { display: flex; align-items: center; gap: 12px; }
        .va-icon-wrap {
            width: 38px; height: 38px; border-radius: 10px;
            background: #e0e7ff; color: #4f46e5;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        html.dark-theme .va-icon-wrap { background: rgba(79, 70, 229, 0.2); }
        .va-bank-title { font-size: 0.65rem; font-weight: 800; color: var(--text-main); margin-bottom: 2px; text-transform: uppercase;}
        .va-acc-number { font-size: 1rem; font-weight: 800; color: var(--text-main); letter-spacing: 0.5px; line-height: 1.1; margin-bottom: 2px;}
        .va-acc-name { font-size: 0.65rem; color: #64748b; font-weight: 700; line-height: 1.2; }
        .va-fee-text { font-size: 0.6rem; color: var(--bryt-primary); font-weight: 800; }
        
        .btn-va-copy {
            background: var(--bryt-primary); color: #fff; border: none;
            padding: 8px 14px; border-radius: 12px; font-size: 0.7rem; font-weight: 800;
            cursor: pointer; display: flex; align-items: center; gap: 6px; flex-shrink: 0;
            transition: 0.2s;
        }
        .btn-va-copy:active { transform: scale(0.95); }

        /* Utilities */
        .section-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 16px; }
        .section-title { font-size: 1.05rem; font-weight: 800; color: var(--text-main); margin: 0; }
        .section-link { font-size: 0.8rem; font-weight: 700; color: var(--bryt-primary); text-decoration: none; }
        
        .utility-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 10px; margin-bottom: 28px; }
        .utility-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; gap: 6px; }
        .utility-icon { width: 48px; height: 48px; background: var(--card-bg); border-radius: 14px; display: flex; align-items: center; justify-content: center; color: var(--bryt-primary); box-shadow: 0 4px 10px rgba(0,0,0,0.03); border: 1px solid var(--border-light); transition: background 0.3s, border 0.3s; }
        .utility-icon svg { width: 22px; height: 22px; }
        .utility-label { font-size: 0.65rem; font-weight: 700; color: var(--text-main); text-align: center; }

        .promo-banner { width: 100%; height: auto; border-radius: 16px; overflow: hidden; margin-bottom: 24px; position: relative; border: 1px solid var(--border-light); background: #e2e8f0; }
        .promo-banner img { width: 100%; height: auto; display: block; object-fit: contain; }

        .mobile-nav { position: fixed !important; bottom: 0 !important; left: 0 !important; right: 0 !important; background: var(--card-bg) !important; z-index: 9999 !important; border-top: 1px solid var(--border-light) !important; display: flex !important; justify-content: space-around !important; padding: 12px 0 10px 0 !important; transition: background 0.3s, border 0.3s; }
        .mobile-nav .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #94a3b8; text-decoration: none; transition: color 0.2s; }
        .mobile-nav .nav-item span { font-size: 0.65rem; font-weight: 800; }
        .mobile-nav .nav-item svg { width: 22px; height: 22px; }
        .mobile-nav .nav-item.active { color: var(--bryt-primary); }

        .tx-card { background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border-light); padding: 12px; margin-bottom: 24px; box-shadow: 0 4px 10px rgba(0,0,0,0.02); transition: background 0.3s, border 0.3s; }
        .skeleton { color: transparent !important; background: #e2e8f0; border-radius: 8px; animation: pulse 1.5s infinite; }
        html.dark-theme .skeleton { background: #334155; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .toast-msg-box { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--bryt-primary); color: #ffffff; padding: 12px 20px; border-radius: 20px; font-size: 0.8rem; font-weight: 800; z-index: 10000; display: none; align-items: center; gap: 8px; box-shadow: 0 10px 30px rgba(29, 94, 208, 0.3); border: 1px solid rgba(255,255,255,0.2); }
        
        .bryt-toast { position: fixed; top: 20px; left: 0; right: 0; margin: 0 auto; width: max-content; max-width: 90%; transform: translateY(-150px); background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-light); padding: 12px 16px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 10px; z-index: 9999; transition: transform 0.4s; border-left: 4px solid var(--bryt-primary); }
        .bryt-toast.show { transform: translateY(0); }
        .toast-icon { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0; }
        .toast-success .toast-icon { background: #16a34a; }
        .toast-text { font-size: 0.8rem; font-weight: 600; }
    </style>
</head>
<body>

    <!-- NATIVE PULL TO REFRESH & DARK MODE SCRIPT -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const themeToggle = document.getElementById('theme-toggle');
            if (themeToggle) {
                themeToggle.addEventListener('click', () => {
                    document.documentElement.classList.toggle('dark-theme');
                    const isDark = document.documentElement.classList.contains('dark-theme');
                    localStorage.setItem('bryt_theme', isDark ? 'dark' : 'light');
                });
            }

            const container = document.body;
            const ptrIndicator = document.getElementById('ptr-indicator');
            let startY = 0; let currentY = 0; let isPulling = false;

            container.addEventListener('touchstart', (e) => {
                if (window.scrollY === 0) { startY = e.touches[0].clientY; isPulling = true; }
            }, { passive: true });

            container.addEventListener('touchmove', (e) => {
                if (!isPulling) return;
                currentY = e.touches[0].clientY;
                if (currentY - startY > 50 && window.scrollY === 0) { ptrIndicator.classList.add('refreshing'); } 
                else { ptrIndicator.classList.remove('refreshing'); }
            }, { passive: true });

            container.addEventListener('touchend', () => {
                if (isPulling && ptrIndicator.classList.contains('refreshing')) { window.location.reload(); }
                isPulling = false; ptrIndicator.classList.remove('refreshing');
            });
        });
    </script>
</body>
