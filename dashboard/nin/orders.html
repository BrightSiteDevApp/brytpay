<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My NIN Orders — BRYT Pay</title>

    <!-- Anti-Flash Dark Mode Script -->
    <script>
        if (localStorage.getItem('bryt_theme') === 'dark') {
            document.documentElement.classList.add('dark-theme');
        }
    </script>

    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../../assets/css/main.css">

    <style>
        :root {
            --bryt-primary: #1D5ED0;
            --bryt-navy: #0B1220;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #0B1220;
            --border-light: #f1f5f9;
        }

        html.dark-theme {
            --bryt-navy: #ffffff;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --border-light: #334155;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 20px !important;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Topbar Header */
        .app-topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: var(--card-bg); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border-light); transition: background 0.3s, border 0.3s; }
        .app-topbar-left { display: flex; align-items: center; gap: 16px; }
        .smart-back { color: var(--text-main); display: flex; align-items: center; text-decoration: none; padding: 4px; margin-left: -4px; cursor: pointer; border: none; background: transparent; }
        .page-title { font-size: 1.15rem; font-weight: 800; color: var(--text-main); margin: 0; }
        .page-subtitle { font-size: 0.75rem; color: #64748b; margin: 0; font-weight: 600; }

        .main-content { padding: 20px; }

        .tx-card { background: var(--card-bg); border: 1px solid var(--border-light); border-radius: 16px; padding: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); transition: 0.3s; }
        .tx-row:last-child { border-bottom: none !important; }

    </style>
</head>
<body>

    <header class="app-topbar">
        <div class="app-topbar-left">
            <a id="smart-back-btn" class="smart-back">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </a>
            <div>
                <h1 class="page-title">NIN Orders</h1>
                <p class="page-subtitle">Your service history</p>
            </div>
        </div>
    </header>

    <main class="main-content">
        <section class="tx-card">
            <div id="orders-container">
                <div style="padding: 40px 20px; text-align: center; color: #64748b; font-size: 0.85rem; font-weight: 600;">Loading transactions...</div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/supabase-client.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await window.db.auth.getSession();
            if (!session) { window.location.href = '/auth/login.html'; return; }

            const backBtn = document.getElementById('smart-back-btn');
            if (backBtn) {
                const referrer = document.referrer || '';
                if (referrer.includes('/dashboard/orders/')) {
                    backBtn.href = '/dashboard/orders/index.html';
                } else {
                    backBtn.href = '/dashboard/nin/index.html';
                }
            }

            const container = document.getElementById('orders-container');
            const { data, error } = await window.db
                .from('nin_orders')
                .select('id, service_type, identifier_value, amount, status, created_at')
                .eq('user_id', session.user.id)
                .order('created_at', { ascending: false });

            if (error || !data || data.length === 0) {
                container.innerHTML = `<div style="padding: 40px 20px; text-align: center; color: #64748b; font-size: 0.85rem; font-weight: 600;">No NIN requests found.</div>`;
                return;
            }

            container.innerHTML = '';
            data.forEach(order => {
                const dateObj = new Date(order.created_at);
                const dateStr = dateObj.toLocaleDateString('en-NG', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute:'2-digit' });
                
                let statusStyle = 'background: #fef9c3; color: #a16207; border: 1px solid #fef08a;';
                let statusText = 'Pending';
                const st = (order.status || '').toUpperCase();

                if (st.includes('REFUND')) { statusStyle = 'background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0;'; statusText = 'Refunded'; }
                else if (st.includes('FAIL')) { statusStyle = 'background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca;'; statusText = 'Failed'; }
                else if (st.includes('COMPLETE') || st.includes('SUCCESS')) { statusStyle = 'background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0;'; statusText = 'Processed'; }
                else if (st.includes('PROCESS')) { statusStyle = 'background: #fef9c3; color: #a16207; border: 1px solid #fef08a;'; statusText = 'Processing'; }

                const title = order.service_type || 'NIN SERVICE';
                const amount = `₦${parseFloat(order.amount).toLocaleString('en-NG', { minimumFractionDigits: 2 })}`;

                container.innerHTML += `
                    <a href="order-details.html?id=${order.id}" class="tx-row" style="display: flex; align-items: center; justify-content: space-between; padding: 14px 12px; border-bottom: 1px solid var(--border-light); gap: 10px; cursor: pointer; text-decoration: none;">
                        <div class="tx-left" style="display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1;">
                            <div class="tx-brand" style="width: 36px; height: 36px; border-radius: 12px; background: #ffffff; border: 1px solid var(--border-light); display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; padding: 4px;">
                                <img src="../../assets/img/nimc-logo.png" alt="NIN" style="width:100%;height:100%;object-fit:contain;">
                            </div>
                            <div style="min-width: 0; flex: 1;">
                                <div style="font-weight: 700; font-size: 0.85rem; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2;">${title}</div>
                                <div style="font-size: 0.68rem; color: #64748b; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 4px;">${dateStr} • ID: ${order.identifier_value || 'N/A'}</div>
                            </div>
                        </div>
                        <div class="tx-right" style="text-align: right; flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 6px;">
                            <div style="font-weight: 800; font-size: 0.95rem; color: var(--text-main); letter-spacing: -0.3px; white-space: nowrap;">${amount}</div>
                            <span style="display: inline-block; font-size: 0.65rem; font-weight: 700; padding: 3px 8px; border-radius: 12px; text-transform: capitalize; ${statusStyle}">${statusText}</span>
                        </div>
                    </a>
                `;
            });
        });
    </script>
</body>
</html>
