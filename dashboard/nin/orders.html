<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My NIN Orders — BRYT Pay</title>

    <!-- STRICT APP PRIVACY DIRECTIVE: Do not index or crawl -->
    <meta name="robots" content="noindex, nofollow">
    
    <!-- Branding -->
    <meta name="theme-color" content="#1D5ED0">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="../../assets/css/main.css">
    <style>
        .list-card { display: flex; justify-content: space-between; align-items: center; padding: 16px; background: #ffffff; border-bottom: 1px solid #f1f5f9; text-decoration: none; transition: background 0.2s; cursor: pointer; }
        .list-card:hover { background: #f8fafc; }
        .list-left { display: flex; gap: 12px; align-items: center; }
        .list-icon { width: 48px; height: 48px; border-radius: 12px; background: #ffffff; border: 1px solid #e2e8f0; padding: 4px; object-fit: contain; flex-shrink: 0; }
        .list-title { font-size: 0.85rem; font-weight: 700; color: var(--bryt-navy); margin-bottom: 4px; line-height: 1.2; max-width: 180px; }
        .list-date { font-size: 0.75rem; color: var(--text-muted); }
        .list-right { text-align: right; }
        .list-amount { font-size: 0.95rem; font-weight: 800; color: var(--bryt-navy); margin-bottom: 6px; }
        
        .status-badge { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; padding: 4px 8px; border-radius: 6px; }
        .status-paid { background: #f1f5f9; color: #475569; }
        .status-processing { background: #fef9c3; color: #a16207; }
        .status-completed { background: #dcfce7; color: #15803d; }
        .status-failed { background: #fee2e2; color: #b91c1c; }
    </style>
</head>
<body style="background: #f8fafc;">

    <main class="app-container" style="max-width: 520px; padding: 0; padding-bottom: 90px; background: #ffffff; min-height: 100vh;">
        <header style="padding: 20px 16px; border-bottom: 1px solid #f1f5f9; display: flex; align-items: center; gap: 12px; background: #ffffff;">
            <a href="/dashboard/nin/" style="color: var(--bryt-navy);"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg></a>
            <h1 style="font-size: 1.25rem; font-weight: 700; color: var(--bryt-navy); margin: 0;">NIN Slips History</h1>
        </header>

        <div id="orders-container">
            <div class="empty-state" style="padding: 40px 20px;">Loading your orders...</div>
        </div>
    </main>
     <nav class="mobile-nav">
        <a href="/dashboard/" class="nav-item active"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Home</span></a>
        <a href="/dashboard/history/" class="nav-item"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span>History</span></a>
        <a href="/dashboard/fund/" class="nav-item"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg><span>Wallet</span></a>
        <a href="/dashboard/account/" class="nav-item"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>Account</span></a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/supabase-client.js"></script>
    <script>
       document.addEventListener('DOMContentLoaded', async () => {
    const { data: { session } } = await window.db.auth.getSession();
    if (!session) { window.location.href = '/auth/login.html'; return; }

    const container = document.getElementById('orders-container');
    const { data, error } = await window.db
        .from('nin_orders')
        .select('id, service_type, identifier_value, amount, status, created_at')
        .eq('user_id', session.user.id)
        .order('created_at', { ascending: false });

    if (error || !data || data.length === 0) {
        container.innerHTML = `<div style="padding: 40px 20px; text-align: center; color: #64748b;">No NIN requests found.</div>`;
        return;
    }

    container.innerHTML = '';
    data.forEach(order => {
        const dateObj = new Date(order.created_at);
        const dateStr = dateObj.toLocaleDateString('en-NG', { month: 'short', day: 'numeric' });
        
        let statusClass = 'status-processing';
        let statusText = 'Pending';
        const st = (order.status || '').toUpperCase();

        // 🚀 SMART STATUS SCANNER
        if (st.includes('REFUND')) { statusClass = 'status-failed'; statusText = 'Refunded'; }
        else if (st.includes('FAIL')) { statusClass = 'status-failed'; statusText = 'Failed'; }
        else if (st.includes('COMPLETE') || st.includes('SUCCESS')) { statusClass = 'status-completed'; statusText = 'Processed'; }
        else if (st.includes('PROCESS')) { statusClass = 'status-processing'; statusText = 'Processing'; }

        container.innerHTML += `
            <a href="order-details.html?id=${order.id}" class="list-card">
                <div class="list-left">
                    <img src="../../assets/img/nimc-logo.png" class="list-icon" alt="NIMC" onerror="this.src='../../assets/img/brytpay-logo.png'">
                    <div>
                        <div class="list-title">${order.service_type}</div>
                        <div class="list-date">${dateStr} | ${order.identifier_value}</div>
                    </div>
                </div>
                <div class="list-right">
                    <div class="list-amount">₦${parseFloat(order.amount).toLocaleString()}</div>
                    <span class="status-badge ${statusClass}">${statusText}</span>
                </div>
            </a>
        `;
    });
});
    </script>
</body>
</html>
