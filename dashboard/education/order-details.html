<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Transaction Summary — BRYT Pay</title>

    <script>
        if (localStorage.getItem('bryt_theme') === 'dark') {
            document.documentElement.classList.add('dark-theme');
        }
    </script>

    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../../assets/css/main.css">

    <style>
        :root {
            --bryt-primary: #1D5ED0;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #0B1220;
            --border-light: #f1f5f9;
        }

        html.dark-theme {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --border-light: #334155;
        }

        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 20px !important; /* Adjusted padding */ font-family: system-ui, -apple-system, sans-serif; margin: 0; transition: background-color 0.3s, color 0.3s; }
        
        .app-topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: var(--card-bg); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border-light); transition: background 0.3s, border 0.3s; }
        .app-topbar-left { display: flex; align-items: center; gap: 16px; }
        .smart-back { color: var(--text-main); display: flex; align-items: center; text-decoration: none; padding: 4px; margin-left: -4px; cursor: pointer; border: none; background: transparent; }
        .page-title { font-size: 1.15rem; font-weight: 800; color: var(--text-main); margin: 0; }
        
        .page-container { padding: 20px; }

        .summary-card { background: var(--card-bg); border-radius: 16px; padding: 16px; display: flex; align-items: center; gap: 14px; margin-bottom: 20px; border: 1px solid var(--border-light); box-shadow: 0 4px 10px rgba(0,0,0,0.02); transition: 0.3s; }
        .summary-icon-wrap { width: 50px; height: 50px; background: #ffffff; border-radius: 12px; padding: 8px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border-light); }
        .summary-icon-wrap img { width: 100%; height: 100%; object-fit: contain; }
        .summary-info { flex-grow: 1; }
        .summary-title { font-size: 0.85rem; font-weight: 800; color: var(--text-main); margin-bottom: 2px; }
        .summary-price { font-size: 1.25rem; font-weight: 800; color: var(--bryt-primary); }
        
        /* PIN Display Box */
        .pin-display-card { background: var(--bg-color); border: 1px dashed var(--bryt-primary); border-radius: 12px; padding: 16px; margin-bottom: 20px; text-align: center; }
        .pin-display-title { font-size: 0.65rem; font-weight: 800; color: var(--bryt-primary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
        .pin-text { font-family: monospace; font-size: 0.85rem; font-weight: 800; color: var(--text-main); white-space: pre-wrap; word-break: break-word; line-height: 1.5; margin-bottom: 16px; }
        .btn-copy-pin { background: rgba(29, 94, 208, 0.1); color: var(--bryt-primary); border: 1px solid rgba(29, 94, 208, 0.2); padding: 8px 16px; border-radius: 10px; font-size: 0.75rem; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: 0.2s; }
        
        .details-list { background: var(--card-bg); padding: 0 16px; border-radius: 16px; border: 1px solid var(--border-light); box-shadow: 0 4px 10px rgba(0,0,0,0.02); margin-bottom: 24px; transition: 0.3s; }
        .detail-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px dashed var(--border-light); }
        .detail-item:last-child { border-bottom: none; }
        .detail-label { font-size: 0.7rem; color: #64748b; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; }
        .detail-value { font-size: 0.8rem; font-weight: 800; color: var(--text-main); text-align: right; }
        
        .btn-download { background: var(--bryt-primary); color: #ffffff; border: none; padding: 14px 24px; border-radius: 12px; font-weight: 800; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.2s; width: max-content; margin: 0 auto; white-space: nowrap; }
        .btn-download svg { width: 18px; height: 18px; flex-shrink: 0; }

    </style>
</head>
<body>

    <header class="app-topbar">
        <div class="app-topbar-left">
            <a id="smart-back-btn" class="smart-back">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </a>
            <h1 class="page-title">PIN Details</h1>
        </div>
    </header>

    <main class="page-container">
        
        <div class="summary-card">
            <div class="summary-icon-wrap">
                <img src="../../assets/img/waec-logo.png" id="exam-logo" onerror="this.src='../../assets/img/brytpay-logo.png'">
            </div>
            <div class="summary-info">
                <div class="summary-title" id="sum-title">Result Checker</div>
                <div class="summary-price" id="sum-price">₦0.00</div>
            </div>
        </div>

        <div class="pin-display-card">
            <div class="pin-display-title">Your PIN Details</div>
            <div class="pin-text" id="sum-pins">Loading...</div>
            <button type="button" class="btn-copy-pin" onclick="copyDetail('sum-pins', this)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                Copy Details
            </button>
        </div>

        <div class="details-list">
            <div class="detail-item">
                <div class="detail-label">Order Reference</div>
                <div class="detail-value" id="sum-ref" style="font-family: monospace; color: var(--bryt-primary);">---</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">Payment Method</div>
                <div class="detail-value">Wallet</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">Date</div>
                <div class="detail-value" id="sum-date">---</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">Status</div>
                <div><span style="background: rgba(21, 128, 61, 0.1); color: #16a34a; border: 1px solid rgba(21, 128, 61, 0.2); padding: 4px 10px; border-radius: 8px; font-size: 0.65rem; font-weight: 800; text-transform: uppercase;">Completed</span></div>
            </div>
        </div>

       <button class="btn-download" id="btn-download-doc">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            Download PIN Card
        </button>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/supabase-client.js"></script>
    <script src="../../assets/js/education-order-details.js"></script>

    <script>
        function copyDetail(elementId, btnElement) {
            const el = document.getElementById(elementId);
            if (!el) return;
            let textToCopy = el.textContent.trim();
            if (!textToCopy || textToCopy === 'Loading...') return;

            const originalHTML = btnElement.innerHTML;
            const showSuccess = () => {
                btnElement.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg> Copied!';
                setTimeout(() => { btnElement.innerHTML = originalHTML; }, 2000);
            };

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(textToCopy).then(showSuccess);
            } else {
                const temp = document.createElement('textarea');
                temp.value = textToCopy;
                document.body.appendChild(temp);
                temp.select();
                document.execCommand('copy');
                document.body.removeChild(temp);
                showSuccess();
            }
        }
    </script>
</body>
</html>
