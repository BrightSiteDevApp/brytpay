<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Transaction Receipt — BRYT Pay</title>
    
    <!-- STRICT APP PRIVACY DIRECTIVE: Do not index or crawl -->
    <meta name="robots" content="noindex, nofollow">
    
    <!-- Branding -->
    <meta name="theme-color" content="#1D5ED0">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="../../assets/css/main.css">
    <style>
        * { box-sizing: border-box; }
        body { background: #f8fafc; margin: 0; font-family: system-ui, -apple-system, sans-serif; padding-bottom: 75px !important; }

        .receipt-container { max-width: 400px; margin: 0 auto; padding: 16px; }
        
        /* Sleek Back Button */
        .smart-back { 
            text-decoration: none; color: #64748b; font-size: 0.75rem; font-weight: 800; 
            display: inline-flex; align-items: center; gap: 4px; margin-bottom: 12px; transition: color 0.2s; 
        }
        .smart-back:hover { color: var(--bryt-primary); }
        .smart-back svg { width: 16px; height: 16px; }

        /* Compact Receipt Card */
        .receipt-card { 
            background: #FFFFFF; 
            border-radius: 12px; 
            padding: 20px 16px; 
            box-shadow: 0 4px 20px rgba(7, 26, 58, 0.05); 
            position: relative; 
            overflow: hidden; 
            margin-bottom: 16px; 
        }
        
        /* Perfectly Scaled Jagged Edge */
        .receipt-card::before { 
            content: ''; 
            position: absolute; 
            top: -6px; left: 0; right: 0; height: 12px; 
            background: radial-gradient(circle, #f8fafc 6px, transparent 7px); 
            background-size: 16px 12px; 
            background-repeat: repeat-x; 
            z-index: 2;
        }

        /* Scaled Watermark */
        .receipt-card::after {
            content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 140px; height: 140px;
            background-image: url('../../assets/img/brytpay-logo.png');
            background-size: contain; background-repeat: no-repeat; background-position: center;
            opacity: 0.03; z-index: 0; pointer-events: none;
        }
        
        .receipt-content-wrapper { position: relative; z-index: 1; }
        .receipt-header { text-align: center; margin-bottom: 16px; }
        
        /* Fixed Provider Logo for Horizontal Images */
        .receipt-provider-logo { 
            max-width: 100px; /* Allows horizontal logos to stretch naturally */
            height: 38px; /* Fixed height to prevent breaking the layout */
            border-radius: 6px; 
            object-fit: contain; 
            background: transparent; 
            margin: 0 auto 10px; 
            display: block;
        }
        
        .receipt-title { font-size: 0.9rem; font-weight: 800; color: var(--bryt-navy); letter-spacing: -0.2px; }
        .receipt-date { font-size: 0.6rem; color: #64748b; margin-top: 2px; font-weight: 600; }

        .receipt-amount-box { text-align: center; padding: 12px 0; border-top: 1px dashed #e2e8f0; border-bottom: 1px dashed #e2e8f0; margin-bottom: 16px; }
        .receipt-amount-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.5px; color: #64748b; font-weight: 800; margin-bottom: 2px; }
        .receipt-amount { font-size: 1.6rem; font-weight: 800; color: var(--bryt-primary); letter-spacing: -0.5px; }
        
        .receipt-status { display: inline-block; padding: 3px 10px; border-radius: 8px; font-size: 0.6rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 6px; }

        .receipt-details { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
        .receipt-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
        
        .receipt-key { 
            font-size: 0.6rem; color: #64748b; font-weight: 700; 
            text-transform: uppercase; letter-spacing: 0.5px; flex-shrink: 0;
        }
        .receipt-value { 
            font-size: 0.7rem; font-weight: 800; color: var(--bryt-navy); 
            text-align: right; word-break: break-word; line-height: 1.3;
        }

        .receipt-footer { text-align: center; font-size: 0.6rem; color: #94a3b8; font-weight: 600; }
        
        .action-buttons { display: flex; flex-direction: column; gap: 8px; }
        .btn-row { display: flex; gap: 8px; }

        /* Compact Action Buttons */
        .btn-action { 
            flex: 1; padding: 10px; font-size: 0.75rem; font-weight: 800; border-radius: 8px; 
            display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; transition: 0.2s; border: none; text-decoration: none;
        }
        .btn-action svg { width: 14px; height: 14px; }
        .btn-save-pdf { background: var(--bryt-navy); color: #ffffff; }
        .btn-save-pdf:hover { background: #0f172a; }
        .btn-save-img { background: #ffffff; border: 1px solid var(--bryt-primary); color: var(--bryt-primary); }
        .btn-save-img:hover { background: #eff6ff; }
        .btn-back-dash { background: #e2e8f0; color: #475569; }
        .btn-back-dash:hover { background: #cbd5e1; }

        /* PIN Display Container */
        .pin-container {
            display: none; background: #f8fafc; border: 1px dashed var(--bryt-primary); border-radius: 10px; 
            padding: 12px; margin-bottom: 16px; text-align: center;
        }
        .pin-title { font-size: 0.6rem; color: var(--bryt-primary); text-transform: uppercase; font-weight: 800; margin-bottom: 4px; letter-spacing: 0.5px; }
        .pin-data { font-size: 0.75rem; color: var(--bryt-navy); font-family: monospace; font-weight: 800; line-height: 1.4; word-break: break-word; }

        /* Mobile Nav Override */
        .mobile-nav { position: fixed !important; bottom: 0 !important; left: 0 !important; right: 0 !important; background: #ffffff !important; z-index: 9000 !important; border-top: 1px solid #e2e8f0 !important; display: flex !important; justify-content: space-around !important; padding: 10px 0 8px 0 !important; }
        .mobile-nav .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #94a3b8; text-decoration: none; transition: color 0.2s; }
        .mobile-nav .nav-item span { font-size: 0.65rem; font-weight: 700; }
        .mobile-nav .nav-item svg { width: 20px; height: 20px; }
        .mobile-nav .nav-item.active { color: var(--bryt-primary); }
        @media (min-width: 768px) { .mobile-nav { display: none !important; } body { padding-bottom: 0 !important; } }
    </style>
</head>
<body>

    <main class="receipt-container">
        <a href="/dashboard/history/" id="smart-back-btn" class="smart-back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back
        </a>

        <div class="receipt-card" id="receipt-content">
            <div class="receipt-content-wrapper">
                <div class="receipt-header">
                    <!-- Dynamic Logo - Now scales horizontally -->
                    <img src="../../assets/img/brytpay-logo.png" id="receipt-provider-logo" alt="Provider" class="receipt-provider-logo" onerror="this.style.display='none'">
                    <div class="receipt-title">Transaction Receipt</div>
                    <div class="receipt-date" id="rec-date">--</div>
                </div>

                <div class="receipt-amount-box">
                    <div class="receipt-amount-label">Amount Paid</div>
                    <div class="receipt-amount" id="rec-amount">₦0.00</div>
                    <div class="receipt-status" id="rec-status">--</div>
                </div>

                <!-- Education PIN Dynamic Display -->
                <div class="pin-container" id="pin-container">
                    <div class="pin-title">Your Exam PIN(s)</div>
                    <div class="pin-data" id="pin-display"></div>
                </div>

                <div class="receipt-details" id="receipt-details-list">
                    <!-- Rows dynamically injected via JS -->
                </div>

                <div class="receipt-footer">
                    <p style="margin: 0;">Generated securely by BRYT Pay</p>
                    <p style="margin: 2px 0 0 0; opacity: 0.6;" id="rec-timestamp">--</p>
                </div>
            </div>
        </div>

        <!-- Smart Dynamic Action Button -->
        <div id="smart-action-container" style="display: none; margin-bottom: 12px;">
            <a href="#" class="btn-action btn-save-pdf" style="text-decoration: none; margin-bottom: 8px;">
                View Order Details &rarr;
            </a>
        </div>

        <div class="action-buttons no-print">
            <div class="btn-row">
                <button id="download-pdf-btn" class="btn-action btn-save-pdf">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    Save PDF
                </button>
                <button id="download-img-btn" class="btn-action btn-save-img">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                    Save Image
                </button>
            </div>
            <a href="/dashboard/" class="btn-action btn-back-dash">Back to Dashboard</a>
        </div>
    </main>

    <!-- Mobile Nav -->
    <nav class="mobile-nav no-print">
        <a href="/dashboard/" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Home</span></a>
        <a href="/dashboard/services/" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg><span>Services</span></a>
        <a href="/dashboard/fund/" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg><span>Wallet</span></a>
        <a href="/dashboard/orders/" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg><span>My Orders</span></a>
        <a href="/dashboard/account/" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>Account</span></a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="../../assets/js/supabase-client.js"></script>
    <script src="../../assets/js/receipt.js"></script>
</body>
</html>
