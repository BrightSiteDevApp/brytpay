<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Account Statement — BRYT Pay</title>
    
    <script>
        if (localStorage.getItem('bryt_theme') === 'dark') {
            document.documentElement.classList.add('dark-theme');
        }
    </script>

    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="../../assets/css/main.css">
    <style>
        :root {
            --bryt-primary: #1D5ED0;
            --bryt-navy: #0B1220;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #0B1220;
            --border-light: #f1f5f9;
        }

        html.dark-theme {
            --bryt-navy: #ffffff;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --border-light: #334155;
        }

        /* 🚀 FIX: Prevent horizontal stretching */
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 80px !important;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            overflow-x: hidden; 
        }

        .app-topbar { 
            display: flex; align-items: center; gap: 16px; padding: 16px 20px; 
            background: var(--card-bg); position: sticky; top: 0; z-index: 100; 
            border-bottom: 1px solid var(--border-light);
        }
        .smart-back { color: var(--text-main); display: flex; align-items: center; text-decoration: none; padding: 4px; margin-left: -4px; }
        .page-title { font-size: 1.15rem; font-weight: 800; color: var(--text-main); margin: 0; }

        .main-content { padding: 20px; max-width: 480px; margin: 0 auto; width: 100%; }

        .statement-card { background: var(--card-bg); border: 1px solid var(--border-light); border-radius: 16px; padding: 24px; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        p.subtitle { font-size: 0.85rem; color: #64748b; margin-top: 0; margin-bottom: 24px; line-height: 1.5; font-weight: 500; }
        
        /* 🚀 FIX: Responsive Date Row */
        .date-row { display: flex; flex-direction: column; gap: 16px; margin-bottom: 20px; }
        @media (min-width: 380px) { .date-row { flex-direction: row; } }
        
        .form-group { flex: 1; margin-bottom: 0; }
        .form-label { display: block; font-weight: 800; font-size: 0.75rem; color: #64748b; margin-bottom: 8px; text-transform: uppercase; }
        .form-input { width: 100%; padding: 14px; border: 1px solid var(--border-light); border-radius: 12px; font-size: 0.95rem; outline: none; background: var(--bg-color); color: var(--text-main); font-family: inherit; font-weight: 600; transition: 0.2s; }
        .form-input:focus { border-color: var(--bryt-primary); background: var(--card-bg); }
        
        .btn-primary { background: var(--bryt-primary); color: #ffffff; width: 100%; padding: 16px; border-radius: 12px; font-weight: 800; font-size: 1rem; border: none; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 12px; }
        .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }
        
        .status-banner { display: none; padding: 16px; border-radius: 12px; font-size: 0.85rem; font-weight: 700; margin-bottom: 24px; text-align: center; }
        .status-success { background: rgba(34, 197, 94, 0.1); color: #10b981; border: 1px solid rgba(34, 197, 94, 0.2); }
        .status-error { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); }

        /* 🚀 COMPACT PIN KEYPAD OVERLAY */
        .pin-modal-overlay { position: fixed; inset: 0; background: rgba(11, 18, 32, 0.95); z-index: 20000; display: none; align-items: flex-end; justify-content: center; opacity: 0; transition: opacity 0.25s ease; }
        .pin-modal-overlay.active { display: flex; opacity: 1; }
        .pin-bottom-sheet { background: var(--card-bg); width: 100%; max-width: 480px; border-radius: 24px 24px 0 0; padding: 16px 20px 20px; text-align: center; transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.15); box-sizing: border-box; }
        .pin-modal-overlay.active .pin-bottom-sheet { transform: translateY(0); }
        
        .sheet-handle { width: 36px; height: 4px; background: #e2e8f0; border-radius: 10px; margin: 0 auto 12px; }
        html.dark-theme .sheet-handle { background: #334155; }
        
        .pin-display { display: flex; justify-content: center; gap: 12px; margin: 10px 0 16px; }
        .pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #cbd5e1; transition: 0.2s; }
        .pin-dot.filled { background: var(--bryt-primary); border-color: var(--bryt-primary); transform: scale(1.15); }

        .pin-keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 16px; max-width: 260px; margin: 0 auto 12px; }
        .keypad-btn { background: transparent; border: none; font-size: 1.35rem; font-weight: 800; color: var(--text-main); height: 48px; width: 48px; margin: 0 auto; cursor: pointer; border-radius: 50%; transition: background 0.15s; display: flex; align-items: center; justify-content: center; user-select: none; touch-action: manipulation; }
        .keypad-btn:active { background: rgba(29, 94, 208, 0.12); }
        
        .forgot-pin-wrap { margin: 4px 0 12px; text-align: center; }
        .forgot-pin-link { font-size: 0.75rem; font-weight: 700; color: var(--bryt-primary); text-decoration: none; }
        .forgot-pin-link:active { opacity: 0.7; }

        .pin-actions { display: flex; gap: 10px; }

        /* Toasts */
        .bryt-toast { position: fixed; top: 20px; left: 0; right: 0; margin: 0 auto; width: max-content; max-width: 90%; transform: translateY(-150px); background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-light); padding: 12px 16px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 10px; z-index: 999999; transition: transform 0.4s; border-left: 4px solid var(--bryt-primary); }
        .bryt-toast.show { transform: translateY(0); }
        .toast-icon { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0; }
        .toast-success .toast-icon { background: #16a34a; }
        .toast-error .toast-icon { background: #dc2626; }
        .toast-text { font-size: 0.8rem; font-weight: 600; }

        .mobile-nav { position: fixed !important; bottom: 0 !important; left: 0 !important; right: 0 !important; background: var(--card-bg) !important; z-index: 9999 !important; border-top: 1px solid var(--border-light) !important; display: flex !important; justify-content: space-around !important; padding: 12px 0 10px 0 !important; }
        .mobile-nav .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #94a3b8; text-decoration: none; }
        .mobile-nav .nav-item span { font-size: 0.65rem; font-weight: 800; }
        .mobile-nav .nav-item svg { width: 22px; height: 22px; }
        .mobile-nav .nav-item.active { color: var(--bryt-primary); }
    </style>
</head>
<body>

    <div id="bryt-toast" class="bryt-toast">
        <div id="toast-icon-wrap" class="toast-icon"></div>
        <div id="toast-text" class="toast-text">Message goes here</div>
    </div>

    <header class="app-topbar">
        <a href="/dashboard/account/index.html" class="smart-back">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </a>
        <h1 class="page-title">Account Statement</h1>
    </header>

    <main class="main-content">
        <div class="statement-card">
            <p class="subtitle">Generate an official BRYT Pay PDF statement of your transactions. It will be sent directly to your registered email.</p>
            
            <div id="status-msg" class="status-banner"></div>

            <div class="date-row">
                <div class="form-group">
                    <label class="form-label">Start Date</label>
                    <input type="date" id="start-date" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">End Date</label>
                    <input type="date" id="end-date" class="form-input" required>
                </div>
            </div>

            <button id="btn-open-pin" class="btn-primary">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                Email My Statement
            </button>
        </div>
    </main>

    <!-- 🚀 COMPACT CUSTOM PIN KEYPAD MODAL -->
    <div id="pin-modal-overlay" class="pin-modal-overlay">
        <div class="pin-bottom-sheet">
            <div class="sheet-handle"></div>
            <div style="width: 44px; height: 44px; background: rgba(29, 94, 208, 0.1); color: var(--bryt-primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
            </div>
            <h3 style="margin: 0 0 4px 0; font-size: 1.05rem; font-weight: 800;">Authorize Action</h3>
            <p style="font-size: 0.75rem; color: #64748b; margin: 0;">Enter your 4-digit PIN to generate statement.</p>

            <!-- PIN Dots Display -->
            <div class="pin-display">
                <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
            </div>

            <!-- Custom Numeric Keypad -->
            <div class="pin-keypad">
                <button type="button" class="keypad-btn" data-val="1">1</button>
                <button type="button" class="keypad-btn" data-val="2">2</button>
                <button type="button" class="keypad-btn" data-val="3">3</button>
                <button type="button" class="keypad-btn" data-val="4">4</button>
                <button type="button" class="keypad-btn" data-val="5">5</button>
                <button type="button" class="keypad-btn" data-val="6">6</button>
                <button type="button" class="keypad-btn" data-val="7">7</button>
                <button type="button" class="keypad-btn" data-val="8">8</button>
                <button type="button" class="keypad-btn" data-val="9">9</button>
                <div></div>
                <button type="button" class="keypad-btn" data-val="0">0</button>
                <button type="button" class="keypad-btn" data-val="back">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path><line x1="18" y1="9" x2="12" y2="15"></line><line x1="12" y1="9" x2="18" y2="15"></line></svg>
                </button>
            </div>

            <!-- Forgot PIN Link -->
            <div class="forgot-pin-wrap">
                <a href="/dashboard/security/index.html" class="forgot-pin-link">Forgot PIN?</a>
            </div>

            <div class="pin-actions">
                <button type="button" id="modal-cancel-pin" style="flex: 1; padding: 12px; border-radius: 12px; background: var(--bg-color); color: var(--text-main); border: 1px solid var(--border-light); font-weight: 700; font-size: 0.85rem; cursor: pointer;">Cancel</button>
                <button type="button" id="modal-submit-pin" style="flex: 1.5; padding: 12px; border-radius: 12px; background: var(--bryt-primary); color: #ffffff; border: none; font-weight: 800; font-size: 0.85rem; cursor: pointer;" disabled>Generate</button>
            </div>
        </div>
    </div>

    <!-- Native Bottom Nav -->
    <nav class="mobile-nav no-print">
        <a href="/dashboard/index.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Home</span></a>
        <a href="/dashboard/services/index.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg><span>Services</span></a>
        <a href="/dashboard/fund/index.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg><span>Wallet</span></a>
        <a href="/dashboard/orders/index.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg><span>Orders</span></a>
        <a href="/dashboard/account/index.html" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>Account</span></a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/supabase-client.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await window.db.auth.getSession();
            if (!session) { window.location.href = '/auth/login.html'; return; }

            const today = new Date();
            const lastMonth = new Date(today);
            lastMonth.setDate(today.getDate() - 30);
            
            document.getElementById('end-date').value = today.toISOString().split('T')[0];
            document.getElementById('start-date').value = lastMonth.toISOString().split('T')[0];

            let userPin = '';
            let currentPinInput = '';

            // Fetch User's PIN
            const { data: profile } = await window.db.from('profiles').select('transaction_pin').eq('id', session.user.id).single();
            if (profile && profile.transaction_pin) {
                userPin = profile.transaction_pin;
            }

            function showToast(message, type = 'success') {
                const toast = document.getElementById('bryt-toast');
                const toastText = document.getElementById('toast-text');
                const iconWrap = document.getElementById('toast-icon-wrap');
                
                toast.className = `bryt-toast toast-${type}`;
                iconWrap.textContent = '';
                
                const svgNS = "http://www.w3.org/2000/svg";
                const svg = document.createElementNS(svgNS, "svg");
                svg.setAttribute("width", "14"); svg.setAttribute("height", "14");
                svg.setAttribute("viewBox", "0 0 24 24"); svg.setAttribute("fill", "none");
                svg.setAttribute("stroke", "currentColor"); svg.setAttribute("stroke-width", "3");

                if (type === 'success') {
                    const poly = document.createElementNS(svgNS, "polyline");
                    poly.setAttribute("points", "20 6 9 17 4 12"); svg.appendChild(poly);
                } else {
                    const l1 = document.createElementNS(svgNS, "line");
                    l1.setAttribute("x1", "18"); l1.setAttribute("y1", "6"); l1.setAttribute("x2", "6"); l1.setAttribute("y2", "18");
                    const l2 = document.createElementNS(svgNS, "line");
                    l2.setAttribute("x1", "6"); l2.setAttribute("y1", "6"); l2.setAttribute("x2", "18"); l2.setAttribute("y2", "18");
                    svg.appendChild(l1); svg.appendChild(l2);
                }
                iconWrap.appendChild(svg);
                toastText.textContent = message; 
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 4000);
            }

            // PIN KEYPAD LOGIC
            const pinDots = document.querySelectorAll('.pin-dot');
            const keypadBtns = document.querySelectorAll('.keypad-btn');
            const btnSubmitPin = document.getElementById('modal-submit-pin');
            const pinModal = document.getElementById('pin-modal-overlay');
            const statusBox = document.getElementById('status-msg');

            function updatePinUI() {
                pinDots.forEach((dot, idx) => {
                    if (idx < currentPinInput.length) dot.classList.add('filled');
                    else dot.classList.remove('filled');
                });
                btnSubmitPin.disabled = currentPinInput.length !== 4;
            }

            keypadBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const val = btn.getAttribute('data-val');
                    if (val === 'back') {
                        currentPinInput = currentPinInput.slice(0, -1);
                    } else if (val) {
                        if (currentPinInput.length < 4) currentPinInput += val;
                    }
                    updatePinUI();
                });
            });

            // Open Modal 
            document.getElementById('btn-open-pin').addEventListener('click', () => {
                const startDate = document.getElementById('start-date').value;
                const endDate = document.getElementById('end-date').value;
                
                if (!startDate || !endDate) return showToast('Please select a valid date range.', 'error');
                
                statusBox.style.display = 'none';
                currentPinInput = '';
                updatePinUI();
                pinModal.classList.add('active');
            });

            // Close Modal
            document.getElementById('modal-cancel-pin').addEventListener('click', () => {
                pinModal.classList.remove('active');
            });

            // Process Generation
            btnSubmitPin.addEventListener('click', async () => {
                if (!userPin) return showToast('Please set your 4-digit PIN in security settings first.', 'error');
                if (currentPinInput !== userPin) return showToast('Incorrect PIN. Try again.', 'error');

                const startDate = document.getElementById('start-date').value;
                const endDate = document.getElementById('end-date').value;
                const btnGen = document.getElementById('btn-open-pin');

                pinModal.classList.remove('active');
                btnGen.disabled = true;
                btnGen.innerHTML = 'Generating PDF...';

                try {
                    const { data, error } = await window.db.functions.invoke('generate-statement', {
                        body: { startDate, endDate }
                    });

                    if (error) throw new Error(error.message);
                    if (data && data.error) throw new Error(data.error);

                    statusBox.className = 'status-banner status-success';
                    statusBox.innerHTML = `✓ Statement generated successfully! Please check your email inbox.`;
                    statusBox.style.display = 'block';
                    showToast('Statement sent to your email!', 'success');
                } catch (err) {
                    statusBox.className = 'status-banner status-error';
                    statusBox.textContent = `Error: ${err.message}`;
                    statusBox.style.display = 'block';
                } finally {
                    btnGen.disabled = false;
                    btnGen.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg> Email My Statement`;
                }
            });
        });
    </script>
</body>
</html>
