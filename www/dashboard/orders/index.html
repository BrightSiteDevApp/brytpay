<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Orders — BRYT Pay</title>
    
    <!-- Anti-Flash Dark Mode Script -->
    <script>
        if (localStorage.getItem('bryt_theme') === 'dark') {
            document.documentElement.classList.add('dark-theme');
        }
    </script>

    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../../assets/css/main.css">

    <style>
        :root {
            --bryt-primary: #1D5ED0;
            --bryt-navy: #0B1220;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #0B1220;
            --border-light: #f1f5f9;
        }

        html.dark-theme {
            --bryt-navy: #ffffff;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --border-light: #334155;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 80px !important;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Topbar Header */
        .app-topbar { 
            display: flex; align-items: center; gap: 16px; padding: 16px 20px; 
            background: var(--card-bg); position: sticky; top: 0; z-index: 100; 
            border-bottom: 1px solid var(--border-light); transition: background 0.3s, border 0.3s; 
        }
        .smart-back { 
            color: var(--text-main); display: flex; align-items: center; 
            text-decoration: none; padding: 4px; margin-left: -4px; cursor: pointer; border: none; background: transparent;
        }
        .page-title { font-size: 1.15rem; font-weight: 800; color: var(--text-main); margin: 0; }
        .page-subtitle { font-size: 0.75rem; color: #64748b; margin: 0; font-weight: 600; }

        .main-content { padding: 20px; }

        /* Sleek 2-Grid Category Cards */
        .category-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 24px; }
        .category-card { background: var(--card-bg); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; min-height: 90px; cursor: pointer; transition: 0.3s; text-decoration: none; border: 1px solid var(--border-light); box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        .cat-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .cat-count { font-size: 1.35rem; font-weight: 800; color: var(--text-main); line-height: 1; }
        .cat-icon-wrap { width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: rgba(29, 94, 208, 0.05); color: var(--bryt-primary); }
        html.dark-theme .cat-icon-wrap { background: rgba(29, 94, 208, 0.1); }
        .cat-icon-wrap svg { width: 18px; height: 18px; }
        .cat-title { font-size: 0.75rem; font-weight: 700; line-height: 1.2; color: var(--text-main); }

        #orders-list-view { display: none; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .tx-list { background: var(--card-bg); border: 1px solid var(--border-light); border-radius: 16px; padding: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); transition: 0.3s; }
        .tx-row:last-child { border-bottom: none !important; }

        /* Native Bottom Nav */
        .mobile-nav { position: fixed !important; bottom: 0 !important; left: 0 !important; right: 0 !important; background: var(--card-bg) !important; z-index: 9999 !important; border-top: 1px solid var(--border-light) !important; display: flex !important; justify-content: space-around !important; padding: 12px 0 10px 0 !important; transition: background 0.3s, border 0.3s; }
        .mobile-nav .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #94a3b8; text-decoration: none; transition: color 0.2s; }
        .mobile-nav .nav-item span { font-size: 0.65rem; font-weight: 800; }
        .mobile-nav .nav-item svg { width: 22px; height: 22px; }
        .mobile-nav .nav-item.active { color: var(--bryt-primary); }
    </style>
</head>
<body>
    
    <!-- CATEGORY VIEW HEADER -->
    <header class="app-topbar" id="header-categories">
        <a href="/dashboard/index.html" class="smart-back">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </a>
        <div>
            <h1 class="page-title">My Orders</h1>
            <p class="page-subtitle">Track all your service requests</p>
        </div>
    </header>

    <!-- LIST VIEW HEADER (Hidden by default) -->
    <header class="app-topbar" id="header-list" style="display: none;">
        <button class="smart-back" id="btn-back-categories">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </button>
        <div>
            <h1 class="page-title" id="dynamic-list-title">Loading...</h1>
            <p class="page-subtitle">Recent transactions</p>
        </div>
    </header>

    <main class="main-content">
        
        <div id="categories-view">
            <div class="category-grid">
                <!-- Airtime -->
                <div class="category-card" data-category="airtime">
                    <div class="cat-top">
                        <span class="cat-count" id="count-airtime">0</span>
                        <div class="cat-icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg></div>
                    </div>
                    <div class="cat-title">Airtime</div>
                </div>

                <!-- Data -->
                <div class="category-card" data-category="data">
                    <div class="cat-top">
                        <span class="cat-count" id="count-data">0</span>
                        <div class="cat-icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg></div>
                    </div>
                    <div class="cat-title">Data Bundles</div>
                </div>

                <!-- JAMB -->
                <div class="category-card" data-category="jamb">
                    <div class="cat-top">
                        <span class="cat-count" id="count-jamb">0</span>
                        <div class="cat-icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg></div>
                    </div>
                    <div class="cat-title">JAMB Services</div>
                </div>

                <!-- NIN -->
                <div class="category-card" data-category="nin">
                    <div class="cat-top">
                        <span class="cat-count" id="count-nin">0</span>
                        <div class="cat-icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg></div>
                    </div>
                    <div class="cat-title">NIN Services</div>
                </div>

                <!-- Education -->
                <div class="category-card" data-category="education">
                    <div class="cat-top">
                        <span class="cat-count" id="count-education">0</span>
                        <div class="cat-icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div>
                    </div>
                    <div class="cat-title">Education PINs</div>
                </div>

                <!-- TV -->
                <div class="category-card" data-category="tv">
                    <div class="cat-top">
                        <span class="cat-count" id="count-tv">0</span>
                        <div class="cat-icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect><polyline points="17 2 12 7 7 2"></polyline></svg></div>
                    </div>
                    <div class="cat-title">Cable TV</div>
                </div>

                <!-- Certificates -->
                <div class="category-card" data-category="certificates">
                    <div class="cat-top">
                        <span class="cat-count" id="count-certificates">0</span>
                        <div class="cat-icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="7"></circle><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline></svg></div>
                    </div>
                    <div class="cat-title">Exam Certifications</div>
                </div>

                <!-- Wallet Funding -->
                <div class="category-card" data-category="funding">
                    <div class="cat-top">
                        <span class="cat-count" id="count-funding">0</span>
                        <div class="cat-icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></div>
                    </div>
                    <div class="cat-title">Wallet Funding</div>
                </div>
            </div>
        </div>

        <div id="orders-list-view">
            <div class="tx-list" id="dynamic-tx-container">
                <div style="padding: 24px; text-align: center; color: #64748b; font-size: 0.8rem;">Loading...</div>
            </div>
        </div>

    </main>

    <!-- Native Bottom Nav -->
    <nav class="mobile-nav no-print">
        <a href="/dashboard/index.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Home</span></a>
        <a href="/dashboard/services/index.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg><span>Services</span></a>
        <a href="/dashboard/fund/index.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg><span>Wallet</span></a>
        <a href="/dashboard/orders/index.html" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg><span>Orders</span></a>
        <a href="/dashboard/account/index.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>Account</span></a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/supabase-client.js"></script>
    <script src="../../assets/js/orders.js"></script>

</body>
</html>
