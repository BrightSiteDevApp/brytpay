<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notifications — BRYT Pay</title>
    
    <!-- Anti-Flash Dark Mode Script -->
    <script>
        if (localStorage.getItem('bryt_theme') === 'dark') {
            document.documentElement.classList.add('dark-theme');
        }
    </script>
    
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    
    <style>
        :root {
            --bryt-primary: #1D5ED0;
            --bryt-navy: #0B1220;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0B1220;
            --border-light: #f1f5f9;
        }

        html.dark-theme {
            --bryt-navy: #ffffff;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --border-light: #334155;
        }

        /* Base Reset */
        * { box-sizing: border-box; }
        body { background: var(--bg-color); color: var(--text-main); margin: 0; font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; padding-bottom: 20px !important; transition: background-color 0.3s, color 0.3s; }
        
        /* Topbar Header */
        .app-topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: var(--card-bg); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border-light); transition: background 0.3s, border 0.3s; }
        .app-topbar-left { display: flex; align-items: center; gap: 16px; }
        .smart-back { color: var(--text-main); display: flex; align-items: center; text-decoration: none; padding: 4px; margin-left: -4px; cursor: pointer; border: none; background: transparent; }
        .page-title { font-size: 1.15rem; font-weight: 800; color: var(--text-main); margin: 0; }
        
        .app-container { max-width: 600px; margin: 0 auto; padding: 24px 16px; }

        .btn-mark-all { 
            background: rgba(29, 94, 208, 0.1); border: none; color: var(--bryt-primary); font-size: 0.75rem; 
            font-weight: 800; cursor: pointer; padding: 8px 14px; border-radius: 20px; transition: 0.2s; display: none;
        }
        .btn-mark-all:hover { background: rgba(29, 94, 208, 0.2); }

        /* Premium Notification Cards */
        .notif-feed { display: flex; flex-direction: column; gap: 14px; }
        
        .notif-card {
            background: var(--card-bg); border: 1px solid var(--border-light); border-radius: 16px; padding: 16px;
            display: flex; gap: 12px; align-items: flex-start; transition: 0.2s; position: relative;
        }
        
        /* Unread State Indicator */
        .notif-card.unread {
            background: var(--card-bg); border-color: rgba(29, 94, 208, 0.3); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
        }
        .notif-card.unread::before {
            content: ''; position: absolute; top: 16px; right: 16px; width: 8px; height: 8px;
            background: var(--bryt-primary); border-radius: 50%; box-shadow: 0 0 0 4px rgba(29, 94, 208, 0.1);
        }

        /* Modern Icon System */
        .notif-icon-wrap {
            width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; 
            justify-content: center; flex-shrink: 0;
        }
        .notif-icon-wrap svg { width: 18px; height: 18px; }
        .type-info { background: var(--bg-color); color: #64748b; border: 1px solid var(--border-light); }
        .type-alert { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); }
        .type-success { background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); }
        .type-system { background: rgba(29, 94, 208, 0.1); color: var(--bryt-primary); border: 1px solid rgba(29, 94, 208, 0.2); }

        /* Typography */
        .notif-body { flex: 1; min-width: 0; padding-top: 2px; }
        .notif-title { font-size: 0.85rem; font-weight: 800; color: var(--text-main); margin: 0 0 4px 0; line-height: 1.3; padding-right: 20px;}
        .notif-text { font-size: 0.75rem; color: #64748b; line-height: 1.4; margin: 0 0 10px 0; font-weight: 500; }
        
        /* Bottom Meta Row */
        .notif-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .notif-time { font-size: 0.65rem; color: #64748b; font-weight: 700; }
        
        .btn-action-read {
            background: var(--bg-color); border: 1px solid var(--border-light); color: var(--text-main); font-size: 0.65rem; 
            font-weight: 800; padding: 4px 10px; border-radius: 10px; cursor: pointer; transition: 0.2s;
        }

        /* Skeleton Loaders (Adapted for Dark Mode) */
        .skeleton {
            background: var(--border-light); background-image: linear-gradient(90deg, var(--border-light) 0px, var(--bg-color) 40px, var(--border-light) 80px);
            background-size: 200% 100%; animation: shimmer 1.5s infinite linear; border-radius: 8px;
            color: transparent !important; pointer-events: none; border: none !important;
        }
        .skeleton * { visibility: hidden; }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        
        .skel-card { height: 110px; width: 100%; border-radius: 16px; margin-bottom: 12px; }
        
        /* Empty State */
        .empty-inbox { text-align: center; padding: 60px 20px; }
        .empty-icon { width: 56px; height: 56px; background: var(--bg-color); color: #64748b; border: 1px solid var(--border-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
        .empty-title { font-size: 1.05rem; font-weight: 800; color: var(--text-main); margin: 0 0 8px 0; }
        .empty-desc { font-size: 0.8rem; color: #64748b; margin: 0; line-height: 1.5; font-weight: 600; }
    </style>
</head>
<body>

    <header class="app-topbar">
        <div class="app-topbar-left">
            <a href="/dashboard/index.html" class="smart-back">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </a>
            <h1 class="page-title">Inbox</h1>
        </div>
        <button id="mark-all-read" class="btn-mark-all">Mark all read</button>
    </header>

    <main class="app-container">
        <div id="notifications-container" class="notif-feed">
            <!-- Shimmer Loaders -->
            <div class="skel-card skeleton"></div>
            <div class="skel-card skeleton"></div>
            <div class="skel-card skeleton"></div>
        </div>
    </main>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/supabase-client.js"></script>
    <script src="../../assets/js/notifications.js"></script>
</body>
</html>
