<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchase Airtime — BRYT Pay</title>
    
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#1D5ED0">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="../../assets/css/main.css">
    <style>
        body { padding-bottom: 75px !important; }
        .form-card { background: #ffffff; border-radius: 16px; padding: 20px; border: 1px solid #e2e8f0; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02); }

        .provider-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; margin-bottom: 20px; }
        @media (max-width: 400px) { .provider-grid { grid-template-columns: repeat(2, 1fr); } }
        .provider-btn { background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 12px; padding: 10px 4px; text-align: center; cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .provider-btn:hover { border-color: #cbd5e1; background: #ffffff; }
        .provider-btn.active { border-color: var(--bryt-primary); background: #F0F6FF; box-shadow: 0 4px 10px rgba(29, 94, 208, 0.08); transform: translateY(-1px); }
        .provider-btn.active::after { content: '✓'; position: absolute; top: -6px; right: -6px; background: var(--bryt-primary); color: #ffffff; width: 16px; height: 16px; border-radius: 50%; font-size: 9px; font-weight: 800; display: flex; align-items: center; justify-content: center; border: 2px solid #ffffff; }
        .provider-logo { width: 32px; height: 32px; margin-bottom: 4px; border-radius: 50%; object-fit: contain; }
        .provider-btn-label { font-size: 0.7rem; font-weight: 700; color: var(--bryt-navy); }

        .input-carrier-wrapper, .input-currency-wrapper { position: relative; display: flex; align-items: center; margin-top: 8px; }
        .input-carrier-wrapper input, .input-currency-wrapper input { width: 100%; padding: 12px 14px 12px 14px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 0.95rem; font-weight: 600; color: #0f172a; outline: none; transition: all 0.2s; background: #f8fafc; }
        .input-currency-wrapper input { padding-left: 32px; }
        .input-carrier-wrapper input:focus, .input-currency-wrapper input:focus { border-color: var(--bryt-primary); background: #ffffff; box-shadow: 0 0 0 3px rgba(29, 94, 208, 0.1); }
        .input-currency-prefix { position: absolute; left: 14px; font-weight: 800; color: var(--bryt-navy); font-size: 1rem; }
        
        .carrier-badge { position: absolute; right: 10px; background: #e2e8f0; color: #475569; font-size: 0.65rem; font-weight: 800; padding: 4px 8px; border-radius: 16px; text-transform: uppercase; display: none; }
        .carrier-badge.active { display: inline-block; background: #dbeafe; color: var(--bryt-primary); }

        .preset-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
        .preset-chip { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 8px 4px; text-align: center; font-size: 0.75rem; font-weight: 700; color: #475569; cursor: pointer; transition: all 0.2s; }
        .preset-chip:hover, .preset-chip.active { border-color: var(--bryt-primary); color: var(--bryt-primary); background: #F0F6FF; }

        /* Modal Updates */
        .modal-overlay { position: fixed; inset: 0; background: rgba(7, 26, 58, 0.6); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 2000; }
        .modal-content { background: #ffffff; border-radius: 16px; width: 100%; max-width: 360px; padding: 24px 20px; text-align: center; }
        .modal-title { font-size: 1.15rem; font-weight: 800; color: var(--bryt-navy); margin-bottom: 4px; }
        .modal-breakdown { background: #f8fafc; border-radius: 12px; padding: 14px; text-align: left; margin-bottom: 20px; border: 1px solid #e2e8f0; }
        .modal-row { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 8px; }
        .modal-actions { display: flex; gap: 8px; }
        
        .bryt-toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-150px); background: #ffffff; padding: 12px 16px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 10px; z-index: 9999; transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); min-width: 260px; border-left: 4px solid var(--bryt-primary); }
        .bryt-toast.show { transform: translateX(-50%) translateY(0); }
        .toast-icon { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0; }
        .toast-success .toast-icon { background: #16a34a; }
        .toast-error .toast-icon { background: #dc2626; }
        .toast-text { font-size: 0.8rem; font-weight: 600; color: var(--bryt-navy); }
    </style>
</head>
<body>

    <div id="bryt-toast" class="bryt-toast">
        <div id="toast-icon-wrap" class="toast-icon"></div>
        <div id="toast-text" class="toast-text">Message</div>
    </div>

    <main class="app-container" style="max-width: 520px;">
        <header style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: flex-start;">
            <div style="min-width: 0; flex: 1;">
                <a href="/dashboard/" id="smart-back-btn" style="text-decoration:none; color:var(--text-muted); font-size:0.85rem; font-weight:700; display:inline-flex; align-items:center; gap:6px; margin-bottom: 12px;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    Dashboard
                </a>
                <h1 style="font-size: 1.35rem; font-weight: 800; color: var(--bryt-navy); margin: 0 0 2px 0;">Purchase Airtime</h1>
                <p style="font-size: 0.75rem; color: var(--text-muted); margin: 0;">Instant top-up to any network</p>
            </div>
            
            <div style="display: flex; align-items: center; gap: 6px; background: var(--bryt-primary); padding: 6px 12px; border-radius: 16px; box-shadow: 0 4px 12px rgba(29, 94, 208, 0.2); flex-shrink: 0; margin-top: 4px;">
                <div style="background: rgba(255,255,255,0.2); border-radius: 50%; padding: 4px; display: flex;">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
                </div>
                <div style="display: flex; flex-direction: column; align-items: flex-end;">
                    <span style="font-size: 0.55rem; color: #e0f2fe; text-transform: uppercase; font-weight: 800; letter-spacing: 0.5px; line-height: 1;">Balance</span>
                    <strong id="user-balance" style="color: #ffffff; font-size: 0.85rem; font-weight: 800; line-height: 1.2;">₦0.00</strong>
                </div>
            </div>
        </header>

        <div class="form-card">
            <form id="airtime-form">
                <div class="form-group" style="margin-bottom: 16px;">
                    <label style="font-size: 0.75rem; font-weight: 800; color: #475569; text-transform: uppercase;">1. Select Network</label>
                    <div class="provider-grid" id="provider-container">
                        <div class="provider-btn network-btn active" data-network="mtn" data-logo="mtn-logo.png">
                            <img src="../../assets/img/mtn-logo.png" class="provider-logo" alt="MTN">
                            <span class="provider-btn-label">MTN</span>
                        </div>
                        <div class="provider-btn network-btn" data-network="airtel" data-logo="airtel-logo.png">
                            <img src="../../assets/img/airtel-logo.png" class="provider-logo" alt="Airtel">
                            <span class="provider-btn-label">Airtel</span>
                        </div>
                        <div class="provider-btn network-btn" data-network="glo" data-logo="glo-logo.png">
                            <img src="../../assets/img/glo-logo.png" class="provider-logo" alt="Glo">
                            <span class="provider-btn-label">Glo</span>
                        </div>
                        <div class="provider-btn network-btn" data-network="9mobile" data-logo="9mob-logo.png">
                            <img src="../../assets/img/9mob-logo.png" class="provider-logo" alt="9mobile">
                            <span class="provider-btn-label">9mobile</span>
                        </div>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 16px;">
                    <label class="form-label" for="phone" style="font-size: 0.75rem; font-weight: 800; color: #475569; text-transform: uppercase;">2. Phone Number</label>
                    <div class="input-carrier-wrapper">
                        <input type="tel" id="phone" placeholder="0801 234 5678" maxlength="11" required>
                        <span id="carrier-indicator" class="carrier-badge">MTN</span>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 24px;">
                    <label class="form-label" for="amount" style="font-size: 0.75rem; font-weight: 800; color: #475569; text-transform: uppercase;">3. Amount (₦)</label>
                    <div class="input-currency-wrapper">
                        <span class="input-currency-prefix">₦</span>
                        <input type="number" id="amount" min="100" max="50000" placeholder="0.00" required>
                    </div>
                    
                    <div class="preset-grid">
                        <div class="preset-chip" data-amt="100">₦100</div>
                        <div class="preset-chip" data-amt="200">₦200</div>
                        <div class="preset-chip" data-amt="500">₦500</div>
                        <div class="preset-chip" data-amt="1000">₦1k</div>
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="btn-primary" style="padding: 14px; font-size: 0.9rem; border-radius: 10px; font-weight: 800; display: flex; justify-content: center; gap: 8px;">
                    Proceed
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </button>
            </form>
        </div>
    </main>

    <div id="confirm-modal" class="modal-overlay">
        <div class="modal-content">
            <img id="modal-network-logo" src="../../assets/img/mtn-logo.png" alt="Network" style="width: 50px; height: 50px; border-radius: 50%; margin: 0 auto 12px; object-fit: contain; background: #f8fafc; padding: 4px; border: 1px solid #e2e8f0;">
            <h3 class="modal-title">Confirm Purchase</h3>
            <p style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 16px;">Review details before wallet deduction.</p>

            <div class="modal-breakdown">
                <div class="modal-row">
                    <span style="color: var(--text-muted);">Network</span>
                    <strong id="modal-network" style="color: var(--bryt-navy);">MTN Airtime</strong>
                </div>
                <div class="modal-row" style="margin-bottom: 12px;">
                    <span style="color: var(--text-muted);">Recipient</span>
                    <strong id="modal-phone" style="color: var(--bryt-navy); font-family: monospace; font-size: 0.9rem;">---</strong>
                </div>
                <div class="modal-row" style="padding-top: 10px; border-top: 1px dashed #cbd5e1; align-items: center; margin-bottom: 0;">
                    <span style="color: var(--text-muted);">Total Debit</span>
                    <strong id="modal-amount" style="color: #10b981; font-size: 1.15rem; font-weight: 800;">₦0.00</strong>
                </div>
            </div>

            <div class="modal-actions">
                <button type="button" id="modal-cancel" class="btn-secondary" style="flex: 1; padding: 12px; font-weight: 700;">Cancel</button>
                <button type="button" id="modal-confirm" class="btn-primary" style="flex: 1.5; padding: 12px; font-weight: 800;">Pay Now</button>
            </div>
        </div>
    </div>

    <!-- Navigation included via main.css fix! -->
    <nav class="mobile-nav no-print">
        <a href="/dashboard/" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Home</span></a>
        <a href="/dashboard/services/" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg><span>Services</span></a>
        <a href="/dashboard/fund/" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg><span>Wallet</span></a>
        <a href="/dashboard/orders/" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg><span>My Orders</span></a>
        <a href="/dashboard/account/" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>Account</span></a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/supabase-client.js"></script>
    <script src="../../assets/js/airtime.js"></script>
</body>
</html>
