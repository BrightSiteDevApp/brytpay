<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Send Money — BRYT Pay</title>
    
    <script>
        if (localStorage.getItem('bryt_theme') === 'dark') {
            document.documentElement.classList.add('dark-theme');
        }
    </script>

    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../../assets/css/main.css">

    <style>
        :root {
            --bryt-primary: #1D5ED0;
            --bryt-navy: #0B1220;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #0B1220;
            --border-light: #f1f5f9;
        }

        html.dark-theme {
            --bryt-navy: #ffffff;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --border-light: #334155;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 80px !important;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Topbar Header */
        .app-topbar { 
            display: flex; align-items: center; gap: 16px; padding: 16px 20px; 
            background: var(--card-bg); position: sticky; top: 0; z-index: 100; 
            border-bottom: 1px solid var(--border-light); transition: background 0.3s, border 0.3s; 
        }
        .smart-back { color: var(--text-main); display: flex; align-items: center; text-decoration: none; padding: 4px; margin-left: -4px; }
        .page-title { font-size: 1.15rem; font-weight: 800; color: var(--text-main); margin: 0; }
        .main-content { padding: 20px; }
        .section-title { font-size: 0.75rem; font-weight: 800; color: #64748b; text-transform: uppercase; margin-bottom: 12px; letter-spacing: 0.5px; }

        /* Fintech Menu List Layout */
        .menu-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
        .menu-item { background: var(--card-bg); border: 1px solid var(--border-light); border-radius: 16px; padding: 16px; display: flex; align-items: center; gap: 14px; text-decoration: none; cursor: pointer; transition: 0.3s; box-shadow: 0 2px 8px rgba(0,0,0,0.01); }
        .menu-item:active { background: var(--bg-color); transform: scale(0.98); }
        .menu-icon { width: 46px; height: 46px; border-radius: 50%; background: rgba(29, 94, 208, 0.08); color: var(--bryt-primary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        html.dark-theme .menu-icon { background: rgba(29, 94, 208, 0.15); }
        .menu-icon svg { width: 22px; height: 22px; }
        .menu-text { flex: 1; }
        .menu-title { font-size: 0.95rem; font-weight: 800; color: var(--text-main); margin-bottom: 2px; }
        .menu-sub { font-size: 0.7rem; font-weight: 600; color: #64748b; }
        .chevron { width: 18px; height: 18px; color: #94a3b8; flex-shrink: 0; }

        /* Native Bottom Nav */
        .mobile-nav { position: fixed !important; bottom: 0 !important; left: 0 !important; right: 0 !important; background: var(--card-bg) !important; z-index: 9999 !important; border-top: 1px solid var(--border-light) !important; display: flex !important; justify-content: space-around !important; padding: 12px 0 10px 0 !important; transition: background 0.3s, border 0.3s; }
        .mobile-nav .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #94a3b8; text-decoration: none; transition: color 0.2s; }
        .mobile-nav .nav-item span { font-size: 0.65rem; font-weight: 800; }
        .mobile-nav .nav-item svg { width: 22px; height: 22px; }
        .mobile-nav .nav-item.active { color: var(--bryt-primary); }
    </style>
</head>
<body>

    <header class="app-topbar">
        <a href="/dashboard/index.html" class="smart-back">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </a>
        <h1 class="page-title">Send Money</h1>
    </header>

    <main class="main-content">
        <div class="section-title">Transfer Options</div>
        <div class="menu-list">
            
            <a href="bryt.html" class="menu-item">
                <div class="menu-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </div>
                <div class="menu-text">
                    <div class="menu-title">BRYT Pay User</div>
                    <div class="menu-sub">Free & instant using ID or Email</div>
                </div>
                <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </a>

           <!-- UNLOCKED: Points to bank.html with classic Bank Building icon -->
            <a href="bank.html" class="menu-item">
                <div class="menu-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="21" width="18" height="2"></rect><polygon points="12 2 20 7 4 7 12 2"></polygon><line x1="6" y1="21" x2="6" y2="11"></line><line x1="10" y1="21" x2="10" y2="11"></line><line x1="14" y1="21" x2="14" y2="11"></line><line x1="18" y1="21" x2="18" y2="11"></line></svg>
                </div>
                <div class="menu-text">
                    <div class="menu-title">Other Bank Account</div>
                    <div class="menu-sub">Send to external banks in Nigeria</div>
                </div>
                <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </a>

        </div>
    </main>

    <nav class="mobile-nav no-print">
        <a href="/dashboard/index.html" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Home</span></a>
        <a href="/dashboard/services/index.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg><span>Services</span></a>
        <a href="/dashboard/fund/index.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg><span>Wallet</span></a>
        <a href="/dashboard/orders/index.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg><span>Orders</span></a>
        <a href="/dashboard/account/index.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>Account</span></a>
    </nav>
</body>
</html>
